      - contentType
      - customFieldMappings
      - objectTags
      - alignment
      - compilationError
      - managedBy
      - dataTableViewState
      - defaultDashboard
      - defaultInstanceDashboard
      - isView
      - isMonitor
      - isMetricSMA
      - accelerationType
      - accelerationInfo
      - createdBy
      - updatedBy
      - createdAt
      - updatedAt
      - storageIntegration
      - definitionType
      - defaultQueryWindowSeconds
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
        label:
          type: string
        description:
          type: string
        icon:
          type: string
        kind:
          $ref: '#/components/schemas/Dataset-DatasetKind'
        source:
          type:
          - string
          - 'null'
        lastUpdateSource:
          type:
          - string
          - 'null'
        fieldList:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-FieldDesc'
        validFromField:
          type:
          - string
          - 'null'
        validToField:
          type:
          - string
          - 'null'
        labelField:
          type:
          - string
          - 'null'
        primaryKey:
          type: array
          items:
            type: string
        candidateKeys:
          type: array
          items:
            type: array
            items:
              type: string
        foreignKeys:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-ForeignKey'
        relatedKeys:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-RelatedKey'
        groupingKey:
          anyOf:
          - $ref: '#/components/schemas/Dataset-GroupingKey'
          - type: 'null'
        correlationTags:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-CorrelationTag'
        isSource:
          type: boolean
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-ImplementedInterface'
        contentType:
          $ref: '#/components/schemas/DatasetContentType'
          description: 'The type of data this dataset contains. For Resource datasets, determined by

            the dataset kind. For other kinds, derived from the dataset''s interface bindings.

            Returns Unknown if no recognized interface is found.

            '
        customFieldMappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Custom field mappings associated with the dataset''s content type. Maps canonical

            field names to column name(s). Most fields map to a single column, but some

            (e.g. metric "tag") allow multiple columns. The exact set of keys depends on

            the contentType. For example, a Log dataset might have {"log": ["message"]}, while

            a Metric dataset might have {"metric": ["metric_name"], "value": ["metric_value"]}.

            Empty if the dataset has no recognized content type.

            '
        objectTags:
          $ref: '#/components/schemas/ObjectTags'
        alignment:
          anyOf:
          - $ref: '#/components/schemas/Dataset-TimeAlignment'
          - type: 'null'
        compilationError:
          anyOf:
          - $ref: '#/components/schemas/Dataset-CompilationError'
          - type: 'null'
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        dataTableViewState:
          type:
          - string
          - 'null'
        defaultDashboard:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        defaultInstanceDashboard:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        isView:
          type: boolean
        isMonitor:
          type: boolean
        isMetricSMA:
          type: boolean
        accelerationType:
          $ref: '#/components/schemas/Dataset-AccelerationType'
        accelerationInfo:
          $ref: '#/components/schemas/Dataset-AccelerationInfo'
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          $ref: '#/components/schemas/Time'
        storageIntegration:
          oneOf:
          - $ref: '#/components/schemas/StorageIntegration-Ref'
          - type: 'null'
          readOnly: true
          description: 'The storage integration associated with this dataset, if any.

            Returns null for datasets without a storage integration.

            When expand=true, includes a record object with label, type, and storageProvider.

            '
        definitionType:
          $ref: '#/components/schemas/Dataset-DefinitionType'
          description: 'The kind of definition that produces this dataset. Always populated;

            classifies every dataset, including source datasets (datastreams /

            external tables) and rows whose stored kind is empty or corrupt.

            '
        score:
          type: number
          format: double
          readOnly: true
          description: 'Cosine similarity score (0–1). Only present when the `query` search

            parameter is used (semantic search). Omitted for non-semantic list

            requests.

            '
    DatasetLegacy-Resource:
      type: object
      required:
      - meta
      - config
      - state
      properties:
        meta:
          type: object
          description: Metadata about the dataset.
          required:
          - id
          - workspaceId
          - customerId
          properties:
            id:
              type: string
            workspaceId:
              type: string
              format: int64
            customerId:
              type: string
              format: int64
        config:
          description: Directly settable properties of the dataset.
          type: object
          required:
          - name
          properties:
            name:
              type: string
        state:
          description: Implicitly derived state of the dataset.
          type: object
          required:
          - urlPath
          - kind
          - createdBy
          - createdDate
          - updatedBy
          - updatedDate
          properties:
            urlPath:
              type: string
            kind:
              type: string
            createdBy:
              type: string
              format: int64
            createdDate:
              type: string
              format: date-time
            updatedBy:
              type: string
              format: int64
            updatedDate:
              type: string
              format: date-time
            columns:
              type: array
              items:
                type: object
                required:
                - name
                - type
                properties:
                  name:
                    type: string
                  type:
                    type: string
            interfaces:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  mapping:
                    type: array
                    items:
                      type: object
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    Dataset-GraphSummary:
      title: DatasetGraphSummary
      type: object
      description: 'Lean per-dataset projection used to render the Dataset Graph, Lineage tab,

        and Explore Universe views. Intentionally a strict subset of Dataset-Resource:

        only the fields required to render a graph node and its outgoing edges.

        expand is not supported on graph endpoints.


        NOTE: foreignKeyTargetIds and inputDatasetIds are returned as flat arrays of

        id strings rather than the nested reference shape used elsewhere in this API.

        This is a deliberate divergence from the REST Style Guide accepted for payload

        size on the full-graph endpoint; these fields are not expandable.

        '
      required:
      - id
      - label
      - kind
      - contentType
      - icon
      - compilationError
      - accelerationState
      - foreignKeyTargetIds
      - inputDatasetIds
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
        label:
          type: string
          description: Full dataset label (path/name).
        kind:
          $ref: '#/components/schemas/Dataset-DatasetKind'
        contentType:
          $ref: '#/components/schemas/DatasetContentType'
          description: 'The content type (Resource, Log, Metric, OTelSpan, OTelTrace, Unknown).

            Combined with kind to pick the dataset icon in the UI.

            '
        icon:
          type:
          - string
          - 'null'
          description: Explicit icon URL when set; null means the UI should derive from kind + contentType.
        compilationError:
          anyOf:
          - $ref: '#/components/schemas/Dataset-CompilationError'
          - type: 'null'
          description: Non-null when the dataset currently fails to compile.
        accelerationState:
          $ref: '#/components/schemas/Dataset-AccelerationState'
          description: 'The dataset''s current acceleration state, projected out of AccelerationInfo.

            Exposed as a top-level scalar on this endpoint to avoid batch-loading the

            full AccelerationInfo object.

            '
        foreignKeyTargetIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: 'Deduplicated list of foreign-key target dataset ids (forward edges only).

            Self-references and targets pointing at datasets excluded by the default filter

            are omitted.

            '
        inputDatasetIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: 'Deduplicated list of dataset ids that feed this dataset via transform inputs

            with InputRole=Data. Reference-role inputs are excluded.

            '
    Dataset-GraphResponse:
      title: DatasetGraphResponse
      type: object
      description: 'Response body for both GET /v1/datasets/graph and GET /v1/datasets/{id}/graph.

        On the full-graph endpoint: datasets are sorted by id ascending, and meta.totalCount

        is always the number of returned datasets (never -1).

        On the focal endpoint: datasets are sorted in BFS-nearest order (focal first, then

        by BFS depth, ties broken by id ascending for determinism), and meta.totalCount is

        -1 iff the BFS was capped by limit; otherwise it is the number of returned datasets.

        '
      required:
      - datasets
      - meta
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-GraphSummary'
        meta:
          $ref: '#/components/schemas/Meta'
    StatValueCount:
      title: StatValueCount
      type: object
      description: One distinct attribute value and the number of rows carrying it.
      required:
      - value
      - count
      properties:
        value:
          type: string
          description: 'The attribute value, always a JSON string regardless of the expression''s

            underlying type. Strings appear verbatim; ints as decimal digits (e.g.

            `"41000234"`); bools as `"true"` or `"false"`; timestamps as RFC 3339

            (e.g. `"2024-01-01T00:00:00Z"`).

            '
        count:
          type: integer
          format: int64
          description: Number of rows with this value.
    AttributeStats:
      title: AttributeStats
      type: object
      description: 'Aggregated statistics for one requested attribute expression: how many

        distinct values it produced, plus the most frequent value/count pairs.

        '
      required:
      - attribute
      - distinctCount
      - stats
      properties:
        attribute:
          type: string
          description: The attribute expression that was queried, verbatim from the request.
        distinctCount:
          type: integer
          format: int64
          description: Total distinct values, including those outside the returned top-K.
        stats:
          type: array
          description: Top-K value/count pairs, sorted by count descending.
          items:
            $ref: '#/components/schemas/StatValueCount'
    Dataset-StatsMeta:
      title: DatasetStatsMeta
      type: object
      required:
      - totalDatasets
      - filteredDatasets
      properties:
        totalDatasets:
          type: integer
          format: int64
          description: Total number of datasets before applying filter
        filteredDatasets:
          type: integer
          format: int64
          description: Number of datasets after applying filter (equal to totalDatasets when no filter)
    Dataset-StatsResponse:
      title: DatasetStatsResponse
      type: object
      description: Aggregated stats for requested dataset attributes
      required:
      - attributes
      - multiValueAttributes
      - meta
      properties:
        attributes:
          type: array
          description: 'One entry per requested `attributes` expression, in request

            order. Empty array if `attributes` was empty in the request.

            '
          items:
            $ref: '#/components/schemas/AttributeStats'
        multiValueAttributes:
          type: array
          description: 'One entry per requested `multiValueAttributes` expression, in

            request order. Empty array if `multiValueAttributes` was empty in

            the request. Each entry''s `count` values are total

            occurrences across all matching datasets and may exceed

            `meta.filteredDatasets`.

            '
          items:
            $ref: '#/components/schemas/AttributeStats'
        meta:
          $ref: '#/components/schemas/Dataset-StatsMeta'
    Monitor-RuleKind:
      title: MonitorRuleKind
      type: string
      description: 'The evaluation rule kind of the monitor. `Composite` is the one kind that inspects no query: it alerts on a boolean condition over whether other monitors are currently alerting, correlated per group.

        '
      enum:
      - Anomaly
      - Composite
      - Count
      - Promote
      - Threshold
    Monitor-DisabledCause:
      title: MonitorDisabledCause
      type: string
      description: Why a monitor was disabled.
      enum:
      - AlertRateLimit
      - Cost
      - ResultTooBig
      - User
    Monitor-DisabledByCost:
      title: MonitorDisabledByCost
      type: object
      description: Detail for a monitor the cost governor disabled.
      required:
      - creditLimitPerDay
      properties:
        creditLimitPerDay:
          type: number
          description: The daily credit limit the monitor exceeded.
    Monitor-DisabledByAlertRateLimit:
      title: MonitorDisabledByAlertRateLimit
      type: object
      description: Detail for a monitor disabled for exceeding its alert rate limit.
      required:
      - alertRateLimit
      - alertsGenerated
      - lookbackSeconds
      properties:
        alertRateLimit:
          type: integer
          format: int64
          description: The monitor's configured maximum alerts per hour.
        alertsGenerated:
          type: integer
          format: int64
          description: 'Alerts generated within the lookback window, which exceeded `alertRateLimit` and triggered the disable.

            '
        lookbackSeconds:
          type: number
          description: Length of the window over which alerts were counted.
    Monitor-DisabledByUser:
      title: MonitorDisabledByUser
      type: object
      description: Detail for a monitor a user explicitly disabled.
      required:
      - disabledBy
      properties:
        disabledBy:
          $ref: '#/components/schemas/User'
    Monitor-DisabledByResultTooBig:
      title: MonitorDisabledByResultTooBig
      type: object
      description: 'Detail for a monitor disabled because a run result was too large. Either the bytes pair or the rows pair is set; the other is null.

        '
      required:
      - bytesRead
      - bytesLimit
      - rowsRead
      - rowsLimit
      properties:
        bytesRead:
          type:
          - integer
          - 'null'
          format: int64
          description: Bytes read. Null for a row-limit disable.
        bytesLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: Byte limit exceeded. Null for a row-limit disable.
        rowsRead:
          type:
          - integer
          - 'null'
          format: int64
          description: Rows read. Null for a byte-limit disable.
        rowsLimit:
          type:
          - integer
          - 'null'
          format: int64
          description: Row limit exceeded. Null for a byte-limit disable.
    Monitor-DisabledDetail:
      title: MonitorDisabledDetail
      type: object
      description: 'Why the monitor is disabled. Exactly one of the cause-specific fields is populated, matching `cause`; the others are null.

        '
      required:
      - cause
      - cost
      - alertRateLimit
      - user
      - resultTooBig
      properties:
        cause:
          $ref: '#/components/schemas/Monitor-DisabledCause'
        cost:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledByCost'
          - type: 'null'
        alertRateLimit:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledByAlertRateLimit'
          - type: 'null'
        user:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledByUser'
          - type: 'null'
        resultTooBig:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledByResultTooBig'
          - type: 'null'
    Monitor-RollupStatus:
      title: MonitorRollupStatus
      type: string
      description: 'Single health summary, derived from the monitor''s other fields and resolved by priority, highest first: `Disabled` (by a user or a limit), `Failed` (an error logged since the last run and less than a week old), `Warnings` (likewise a warning), `Initializing` (an anomaly monitor that has not yet produced its output dataset, so it cannot evaluate yet), `Running` (the default). A monitor can satisfy more than one — only the highest is reported, and the ranking may change. See the note under the list operation''s `filter` for the part of `Initializing` this endpoint cannot see.

        '
      enum:
      - Disabled
      - Failed
      - Initializing
      - Running
      - Warnings
    Monitor-Health:
      title: MonitorHealth
      type: string
      description: 'The monitor''s operating state as one value, which is what the monitors

        list shows in its Health column and facets on.


        `rollupStatus` answers a narrower question — how the last evaluation

        went — so it reports `Running` for a monitor that is turned off, over its

        spend limit, or on a passive cluster. `health` ranks those causes above

        the run outcome, highest first:


        | Value | Meaning |

        |---|---|

        | `CostDisabled` | Turned off after exceeding its spend limit. |

        | `AlertRateLimitDisabled` | Turned off after exceeding its alert rate. |

        | `Disabled` | Turned off by a user. |

        | `ClusterPassive` | Its customer''s monitoring is not active on this cluster, so nothing evaluates. Set for every monitor of that customer at once. |

        | `AtRisk` | Inside the grace period before its spend limit disables it. |

        | `Failed` | An error was logged since the last run, less than a week ago. |

        | `Warnings` | Likewise a warning. |

        | `Initializing` | An anomaly monitor that has not yet produced its output dataset, so it cannot evaluate. |

        | `Running` | None of the above. |


        A monitor can satisfy several; only the highest is reported, and the

        ranking may change. `Initializing` is only partially reachable — see the

        note under the list operation''s `filter` for the warm-up tail this

        endpoint cannot see.

        '
      enum:
      - AlertRateLimitDisabled
      - AtRisk
      - ClusterPassive
      - CostDisabled
      - Disabled
      - Failed
      - Initializing
      - Running
      - Warnings
    Monitor-GovernorState:
      title: MonitorGovernorState
      type: string
      description: 'Where the monitor sits against its configured spend limit. `Normal` is within budget, `GracePeriod` is over it but still evaluating, and `CostDisabled` means the limit has turned it off.

        '
      enum:
      - CostDisabled
      - GracePeriod
      - Normal
    Monitor-AlertState:
      title: MonitorAlertState
      type: string
      description: 'Whether the monitor is alerting now, has alerted before, or never has. `Triggering` means an alarm is open, or one was raised since the last evaluation; a monitor that is turned off is never `Triggering` because it cannot evaluate. `Previous` means it has alerted at some point but is not now — the same set as `lastAlarmTime != null` minus the triggering ones.

        '
      enum:
      - Never
      - Previous
      - Triggering
    Monitor-AiTriagingMode:
      title: MonitorAiTriagingMode
      type: string
      description: 'Whether AI auto-investigation runs when this monitor alerts. `None` disables it; `Triage` runs it.

        '
      enum:
      - None
      - Triage
    Monitor-MuteState:
      title: MonitorMuteState
      type: string
      description: 'Whether mute rules currently suppress this monitor''s notifications. `PartiallyMuted` means every covering rule is scoped to particular alert groupings, so some alerts still notify.

        '
      enum:
      - Muted
      - NotMuted
      - PartiallyMuted
    Monitor-IntervalSchedule:
      title: MonitorIntervalSchedule
      type: object
      description: Evaluation on a fixed interval.
      required:
      - intervalSeconds
      properties:
        intervalSeconds:
          type: number
          format: double
          description: How often the monitor evaluates, in seconds.
    Monitor-TransformSchedule:
      title: MonitorTransformSchedule
      type: object
      description: Evaluation driven by the input dataset's transform.
      required:
      - freshnessGoalSeconds
      properties:
        freshnessGoalSeconds:
          type: number
          format: double
          description: How stale the monitor's data may get, in seconds.
    Monitor-AlarmMode:
      title: MonitorAlarmMode
      type: string
      description: 'How alerts span consecutive cron runs. `PerRun` raises a separate alert per firing run. `Ongoing` extends one alert across consecutive runs that fire for the same group and severity.

        '
      enum:
      - Ongoing
      - PerRun
    Monitor-CronSchedule:
      title: MonitorCronSchedule
      type: object
      description: Evaluation on a wall-clock cron.
      required:
      - rawCron
      - timezone
      - alarmMode
      properties:
        rawCron:
          type: string
          description: Crontab expression for when to evaluate.
        timezone:
          type: string
          description: IANA timezone the cron is interpreted in.
        alarmMode:
          $ref: '#/components/schemas/Monitor-AlarmMode'
    Monitor-Scheduling:
      title: MonitorScheduling
      type: object
      description: 'When the monitor evaluates. `automatic` is always returned, `true` or `false`. Alongside it, one of `interval`, `transform` and `cron` is set: the schedule the monitor actually runs on, with the server''s defaults filled in. All three are null only for a monitor that is saved but not yet running and asked for no schedule; the server picks one when it starts the monitor.

        '
      required:
      - automatic
      - interval
      - transform
      - cron
      properties:
        automatic:
          type: boolean
          description: 'Whether the server chose this schedule, rather than the monitor setting one. An automatic schedule is re-chosen whenever the monitor is saved, so it follows changes to the query and lookback. Always `true` for `Anomaly` and `Composite` monitors, which cannot set one.

            '
        interval:
          anyOf:
          - $ref: '#/components/schemas/Monitor-IntervalSchedule'
          - type: 'null'
          description: 'Evaluation on a fixed interval. Chosen by the server, not requested: anomaly and composite monitors always run this way, as does a monitor whose query cannot be accelerated.

            '
        transform:
          anyOf:
          - $ref: '#/components/schemas/Monitor-TransformSchedule'
          - type: 'null'
          description: Evaluation each time the input dataset's transform runs.
        cron:
          anyOf:
          - $ref: '#/components/schemas/Monitor-CronSchedule'
          - type: 'null'
          description: Evaluation on a wall-clock cron.
    Monitor-InputRole:
      title: MonitorInputRole
      type: string
      description: 'How a stage uses an input: `Data` is queried, `Reference` is only joined against.

        '
      enum:
      - Data
      - Reference
    Monitor-StageInput:
      title: MonitorStageInput
      type: object
      description: 'One source a stage reads: a dataset (by `dataset` or `datasetPath`), an earlier stage, or a parameter. The fields it does not use are null.

        '
      required:
      - inputName
      - inputRole
      - dataset
      - datasetPath
      - stageId
      - parameterId
      properties:
        inputName:
          type: string
          description: The `@name` OPAL refers to this input by, without the `@`.
        inputRole:
          $ref: '#/components/schemas/Monitor-InputRole'
        dataset:
          anyOf:
          - $ref: '#/components/schemas/DatasetRef'
          - type: 'null'
          description: Dataset this input reads. Null when it reads something else.
        datasetPath:
          type:
          - string
          - 'null'
          description: 'The dataset as `Workspace.path/Name`, when it was saved that way. Null otherwise.

            '
        stageId:
          type:
          - string
          - 'null'
          description: '`id` of an earlier stage of this query. Null when not reading a stage.

            '
        parameterId:
          type:
          - string
          - 'null'
          description: 'Parameter the dataset is taken from. Null when not reading a parameter.

            '
    Monitor-StageQuery:
      title: MonitorStageQuery
      type: object
      description: One stage of a monitor's input query.
      required:
      - id
      - input
      - pipeline
      properties:
        id:
          type: string
          description: 'Identifies the stage within this query. `outputStage` and other stages'' `input[].stageId` refer to it by this value.

            '
        input:
          type: array
          description: What this stage reads.
          items:
            $ref: '#/components/schemas/Monitor-StageInput'
        pipeline:
          type: string
          description: The stage's OPAL.
    Monitor-MultiStageQuery:
      title: MonitorMultiStageQuery
      type: object
      description: The OPAL query the rules are evaluated over, as a pipeline of stages.
      required:
      - outputStage
      - stages
      properties:
        outputStage:
          type: string
          description: '`id` of the stage the rules read.'
        stages:
          type: array
          description: The stages, in definition order.
          items:
            $ref: '#/components/schemas/Monitor-StageQuery'
    Monitor-ValueAggregation:
      title: MonitorValueAggregation
      type: string
      description: 'How the values in a window are reduced before comparison: `Max`, `Min`, `AvgOf` and `SumOf` compare the largest, smallest, mean or total. The older `AllOf` and `AnyOf` require every or at least one value to match; new monitors use `Min` or `Max` instead.

        '
      enum:
      - AllOf
      - AnyOf
      - AvgOf
      - Max
      - Min
      - SumOf
    Monitor-BoundComparisonFunction:
      title: MonitorBoundComparisonFunction
      type: string
      description: Which side of the baseline counts as anomalous.
      enum:
      - Above
      - AboveOrBelow
      - Below
    Monitor-BasicAlgorithm:
      title: MonitorBasicAlgorithm
      type: object
      description: Baseline as a mean, with anomalies a number of standard deviations away.
      required:
      - numStandardDeviations
      properties:
        numStandardDeviations:
          type: integer
          format: int64
          description: How many standard deviations from the mean count as anomalous.
    Monitor-SeasonalSensitivity:
      title: MonitorSeasonalSensitivity
      type: string
      description: 'How readily a departure from a seasonal baseline alerts, from `Low` (fewest alerts) to `VeryHigh`.

        '
      enum:
      - High
      - Low
      - Medium
      - VeryHigh
    Monitor-SeasonalAlgorithm:
      title: MonitorSeasonalAlgorithm
      type: object
      description: 'Baseline that models daily and weekly cycles, so a regular nightly trough is not read as an anomaly.

        '
      required:
      - sensitivity
      - dailyPeriods
      - weeklyPeriods
      properties:
        sensitivity:
          anyOf:
          - $ref: '#/components/schemas/Monitor-SeasonalSensitivity'
          - type: 'null'
          description: 'How readily a departure from the baseline alerts. Null when the monitor takes the server default.

            '
        dailyPeriods:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Daily cycles the model fits. Null when the monitor takes the server default.

            '
        weeklyPeriods:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Weekly cycles the model fits. Null when the monitor takes the server default.

            '
    Monitor-Baseline:
      title: MonitorBaseline
      type: object
      description: 'The baseline an anomaly monitor compares `valueColumn` against, and how far a value must stray from it. Exactly one of `basicAlgorithm` and `seasonalAlgorithm` is set.

        '
      required:
      - compareFn
      - computationWindowSeconds
      - frequencySeconds
      - basicAlgorithm
      - seasonalAlgorithm
      properties:
        compareFn:
          $ref: '#/components/schemas/Monitor-BoundComparisonFunction'
        computationWindowSeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How much history the baseline is computed over, in seconds. Null when the monitor takes the server default.

            '
        frequencySeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How often the baseline is recomputed, in seconds. Null when the monitor takes the server default.

            '
        basicAlgorithm:
          anyOf:
          - $ref: '#/components/schemas/Monitor-BasicAlgorithm'
          - type: 'null'
          description: Set when the monitor uses the standard-deviation algorithm.
        seasonalAlgorithm:
          anyOf:
          - $ref: '#/components/schemas/Monitor-SeasonalAlgorithm'
          - type: 'null'
          description: Set when the monitor uses the seasonal algorithm.
    Monitor-AlarmLevel:
      title: MonitorAlarmLevel
      type: string
      description: 'Severity of an alert. `NoData` comes from a no-data rule rather than a comparison.

        '
      enum:
      - Critical
      - Error
      - Informational
      - NoData
      - None
      - Warning
    Monitor-ComparisonFunction:
      title: MonitorComparisonFunction
      type: string
      description: 'How a value is compared. `IsNull` and `IsNotNull` take no right-hand side; the rest require one.

        '
      enum:
      - Contains
      - Equal
      - Greater
      - GreaterOrEqual
      - IsNotNull
      - IsNull
      - Less
      - LessOrEqual
      - NotContains
      - NotEqual
      - NotStartsWith
      - StartsWith
    Monitor-ValueType:
      title: MonitorValueType
      type: string
      description: The type of a comparison's right-hand side.
      enum:
      - Bool
      - Duration
      - Float64
      - Int64
      - String
      - Timestamp
    Monitor-Comparison:
      title: MonitorComparison
      type: object
      description: One comparison applied to a value.
      required:
      - compareFn
      - compareValue
      - valueType
      properties:
        compareFn:
          $ref: '#/components/schemas/Monitor-ComparisonFunction'
        compareValue:
          type:
          - string
          - 'null'
          description: 'The right-hand side as a string, in the form `valueType` names. Null

            for `IsNull` and `IsNotNull`, and for a stored null.


            Numbers are base-10, booleans `true`/`false`, timestamps RFC 3339 in

            UTC, and **durations a count of nanoseconds** -- the one place in this

            schema a duration is not in seconds.

            '
        valueType:
          anyOf:
          - $ref: '#/components/schemas/Monitor-ValueType'
          - type: 'null'
          description: 'Type of `compareValue`. Null when the comparison has no operand (`IsNull`, `IsNotNull`).

            '
    Monitor-BooleanOperator:
      title: MonitorBooleanOperator
      type: string
      description: How a set of conditions combine.
      enum:
      - And
      - Or
    Monitor-ColumnFilter:
      title: MonitorColumnFilter
      type: object
      description: 'A test on one column: its `columnComparisons`, combined by `operator`. The column is named as in `groupBy`: exactly one of `column`, `link` and `tag`.

        '
      required:
      - column
      - path
      - link
      - tag
      - operator
      - columnComparisons
      properties:
        column:
          type:
          - string
          - 'null'
          description: A column of the query output. Null for a link or tag.
        path:
          type:
          - string
          - 'null'
          description: Dotted path into `column`. Null for the whole column.
        link:
          type:
          - string
          - 'null'
          description: A link column. Null unless comparing on a link.
        tag:
          type:
          - string
          - 'null'
          description: Correlation tag, without the `#`. Null unless comparing on a tag.
        operator:
          $ref: '#/components/schemas/Monitor-BooleanOperator'
          description: 'How `columnComparisons` combine: `Or` matches when any holds, `And` when all do. Always returned. A monitor saved without one gets `And` when any comparison is `NotEqual`, `NotContains`, `NotStartsWith` or `IsNotNull`, and `Or` otherwise.

            '
        columnComparisons:
          type: array
          description: Comparisons applied to the column's value.
          items:
            $ref: '#/components/schemas/Monitor-Comparison'
    Monitor-Rule:
      title: MonitorRule
      type: object
      description: 'One alert condition at one severity: the monitor triggers an alert at `level` when every entry in `triggerComparisons` holds, for the groups (or rows) every entry in the filters matches. `ruleKind` decides which fields are used; the lists it does not use are empty:

        | Rule | Fields used | |---|---| | `Count`, `Threshold`, `Anomaly` | `triggerComparisons`, `groupFilters` | | `Promote` | `rowFilters` | | `level: NoData` | `expirationSeconds` (`Threshold` only) |

        A `NoData` rule alerts when no data arrives for a full lookback window. Only `Threshold` and `Anomaly` monitors have one, at most one each, and it watches the same `valueColumn` as the other rules.

        '
      required:
      - level
      - triggerComparisons
      - groupFilters
      - rowFilters
      - expirationSeconds
      properties:
        level:
          $ref: '#/components/schemas/Monitor-AlarmLevel'
        triggerComparisons:
          type: array
          description: 'Comparisons that trigger the alert, all of which must hold (so two

            entries express a range). What they compare depends on `ruleKind`:


            | `ruleKind` | Compared value |

            |---|---|

            | `Count` | Number of rows in each group over the window |

            | `Threshold` | `valueColumn`, reduced over the window by `aggregation` |

            | `Anomaly` | Percentage (0-100) of the window outside `baseline` |

            '
          items:
            $ref: '#/components/schemas/Monitor-Comparison'
        groupFilters:
          type: array
          description: 'Restricts the rule to groups matching every entry. Each entry tests one of the `groupBy` columns. Empty when the rule applies to every group.

            '
          items:
            $ref: '#/components/schemas/Monitor-ColumnFilter'
        rowFilters:
          type: array
          description: 'Rows of the query output to promote to an alert at this level: a row is promoted when it matches every entry. Empty promotes every row.

            '
          items:
            $ref: '#/components/schemas/Monitor-ColumnFilter'
        expirationSeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How long a no-data alert stays open before resolving itself, in seconds. Set only on a `Threshold` monitor''s `NoData` rule, where null means the server default. Always null otherwise, including for `Anomaly`, whose no-data alerts always close after a fixed time.

            '
    Monitor-ColumnPath:
      title: MonitorColumnPath
      type: object
      description: A column, optionally a field within it.
      required:
      - name
      - path
      properties:
        name:
          type: string
          description: The column's name within its dataset.
        path:
          type:
          - string
          - 'null'
          description: Dotted path into the column. Null for the whole column.
    Monitor-GroupingMeta:
      title: MonitorGroupingMeta
      type: object
      description: The physical columns a link or correlation tag resolves to.
      required:
      - srcFields
      - dstFields
      - targetDataset
      properties:
        srcFields:
          type: array
          description: Columns of this dataset the link or tag reads.
          items:
            $ref: '#/components/schemas/Monitor-ColumnPath'
        dstFields:
          type: array
          description: Columns of the target dataset a link resolves to. Empty for a tag.
          items:
            type: string
        targetDataset:
          anyOf:
          - $ref: '#/components/schemas/DatasetRef'
          - type: 'null'
          description: Dataset a link points at. Null for a tag.
    Monitor-Grouping:
      title: MonitorGrouping
      type: object
      description: 'One dimension the rules are evaluated per. Exactly one of `column`, `link` and `tag` is set; `path` only accompanies `column`.

        '
      required:
      - column
      - path
      - link
      - tag
      - meta
      properties:
        column:
          type:
          - string
          - 'null'
          description: A column of the query output. Null for a link or tag.
        path:
          type:
          - string
          - 'null'
          description: Dotted path into `column`. Null for the whole column.
        link:
          type:
          - string
          - 'null'
          description: A link column, grouping by the linked resource. Null otherwise.
        tag:
          type:
          - string
          - 'null'
          description: Correlation tag, without the `#`. Null otherwise.
        meta:
          anyOf:
          - $ref: '#/components/schemas/Monitor-GroupingMeta'
          - type: 'null'
          description: 'What `link` or `tag` resolved to when the monitor was saved. Read-only. Null for a plain `column`.

            '
    Monitor-ServiceBindingMatchMode:
      title: MonitorServiceBindingMatchMode
      type: string
      description: 'How a binding dimension is matched. `Exact` matches `value`. `Wildcard` takes each alert''s value from the monitor''s `groupBy` columns or the input dataset''s correlation tags.

        '
      enum:
      - Exact
      - Wildcard
    Monitor-ServiceBindingValue:
      title: MonitorServiceBindingValue
      type: object
      description: One dimension of a service binding.
      required:
      - value
      - matchMode
      properties:
        value:
          type:
          - string
          - 'null'
          description: The value this dimension matches. Null when `matchMode` is `Wildcard`.
        matchMode:
          $ref: '#/components/schemas/Monitor-ServiceBindingMatchMode'
    Monitor-ServiceBinding:
      title: MonitorServiceBinding
      type: object
      description: 'A service a monitor''s alerts are attributed to, as its three identifying dimensions.

        '
      required:
      - serviceName
      - environment
      - serviceNamespace
      properties:
        serviceName:
          $ref: '#/components/schemas/Monitor-ServiceBindingValue'
        environment:
          $ref: '#/components/schemas/Monitor-ServiceBindingValue'
        serviceNamespace:
          $ref: '#/components/schemas/Monitor-ServiceBindingValue'
    MonitorAction-Type:
      title: MonitorActionType
      type: string
      description: 'How an action notifies. `PagerDuty` and `Slack` are webhooks posted to those services.

        '
      enum:
      - Email
      - PagerDuty
      - Slack
      - Webhook
    MonitorAction-Email:
      title: MonitorActionEmail
      type: object
      description: An email notification's payload.
      required:
      - users
      - addresses
      - subject
      - body
      - fragments
      properties:
        users:
          type: array
          description: Users to notify.
          items:
            $ref: '#/components/schemas/User'
        addresses:
          type: array
          description: Email addresses to notify.
          items:
            type: string
        subject:
          type:
          - string
          - 'null'
          description: Subject template. Null when the action sets none.
        body:
          type:
          - string
          - 'null'
          description: Body template. Null when the action sets none.
        fragments:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Named template fragments the subject and body can include. Null when the action defines none.

            '
    MonitorAction-HttpMethod:
      title: MonitorActionHttpMethod
      type: string
      description: HTTP method a webhook action posts with.
      enum:
      - Post
      - Put
    MonitorAction-WebhookHeader:
      title: MonitorActionWebhookHeader
      type: object
      required:
      - header
      - value
      properties:
        header:
          type: string
          description: Header name.
        value:
          type: string
          description: Header value template.
    MonitorAction-Webhook:
      title: MonitorActionWebhook
      type: object
      description: 'A webhook notification''s payload, also used for PagerDuty and Slack. A PagerDuty routing key is part of the `body` template, not a field of its own.

        '
      required:
      - url
      - method
      - headers
      - body
      - fragments
      properties:
        url:
          type:
          - string
          - 'null'
          description: Endpoint to post to. Null when the action sets none.
        method:
          anyOf:
          - $ref: '#/components/schemas/MonitorAction-HttpMethod'
          - type: 'null'
          description: HTTP method. Null when the action sets none.
        headers:
          type: array
          description: Headers sent with the request.
          items:
            $ref: '#/components/schemas/MonitorAction-WebhookHeader'
        body:
          type:
          - string
          - 'null'
          description: Request-body template. Null when the action sets none.
        fragments:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Named template fragments the body can include. Null when the action defines none.

            '
    MonitorAction-Brief:
      title: MonitorActionBrief
      type: object
      description: 'A bound action, with enough of its configuration to read it back and send it again.

        '
      required:
      - label
      - type
      - inline
      - email
      - webhook
      properties:
        label:
          type:
          - string
          - 'null'
          description: 'The action''s name. An inline action''s is generated rather than chosen. Null when the action has none.

            '
        type:
          $ref: '#/components/schemas/MonitorAction-Type'
        inline:
          type: boolean
          description: Whether the action belongs to this monitor alone rather than being shared.
        email:
          anyOf:
          - $ref: '#/components/schemas/MonitorAction-Email'
          - type: 'null'
          description: The email payload. Set when `type` is `Email`.
        webhook:
          anyOf:
          - $ref: '#/components/schemas/MonitorAction-Webhook'
          - type: 'null'
          description: 'The webhook payload. Set when `type` is `Webhook`, `Slack` or `PagerDuty`, all of which post a webhook.

            '
    MonitorAction-Ref:
      title: MonitorActionRef
      type: object
      description: 'Reference to a monitor action; `record` is populated only with `expand=true`. Actions have no endpoint of their own yet, so read one through a monitor that binds it.

        '
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        record:
          $ref: '#/components/schemas/MonitorAction-Brief'
    Monitor-ComparisonTerm:
      title: MonitorComparisonTerm
      type: object
      description: 'One comparison against one column, named as in `groupBy`: exactly one of `column`, `link` and `tag`.

        '
      required:
      - column
      - path
      - link
      - tag
      - comparison
      properties:
        column:
          type:
          - string
          - 'null'
          description: A column of the query output. Null for a link or tag.
        path:
          type:
          - string
          - 'null'
          description: Dotted path into `column`. Null for the whole column.
        link:
          type:
          - string
          - 'null'
          description: A link column. Null unless comparing on a link.
        tag:
          type:
          - string
          - 'null'
          description: Correlation tag, without the `#`. Null unless comparing on a tag.
        comparison:
          $ref: '#/components/schemas/Monitor-Comparison'
    Monitor-ComparisonExpression:
      title: MonitorComparisonExpression
      type: object
      description: 'Boolean tree over column comparisons: `operator` combines this node''s `compareTerms` and `subExpressions`.

        '
      required:
      - operator
      - compareTerms
      - subExpressions
      properties:
        operator:
          $ref: '#/components/schemas/Monitor-BooleanOperator'
        compareTerms:
          type: array
          description: This node's own comparisons.
          items:
            $ref: '#/components/schemas/Monitor-ComparisonTerm'
        subExpressions:
          type: array
          description: Nested expressions. Empty at a leaf.
          items:
            $ref: '#/components/schemas/Monitor-ComparisonExpression'
    Monitor-ActionRule:
      title: MonitorActionRule
      type: object
      description: Binds one action to the monitor, and says when it fires.
      required:
      - action
      - levels
      - conditions
      - sendEndNotifications
      - sendRemindersIntervalSeconds
      properties:
        action:
          $ref: '#/components/schemas/MonitorAction-Ref'
        levels:
          type: array
          description: Severities that fire this action. Empty means every severity.
          items:
            $ref: '#/components/schemas/Monitor-AlarmLevel'
        conditions:
          anyOf:
          - $ref: '#/components/schemas/Monitor-ComparisonExpression'
          - type: 'null'
          description: 'Condition on the alert''s values, so one monitor can route different groups to different actions. Null to fire for every alert at `levels`.

            '
        sendEndNotifications:
          type: boolean
          description: Whether the action also fires when an alert resolves.
        sendRemindersIntervalSeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How often to re-notify while an alert stays open, in seconds. Null to notify once.

            '
    Monitor-Resource:
      title: MonitorResource
      type: object
      description: 'One monitor in full: the fields `GET /v1/monitors` returns for it, plus the query and rules that define it. Every field is required; one that can be absent comes back as an explicit null.

        '
      required:
      - id
      - name
      - description
      - disabled
      - ruleKind
      - monitorVersion
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - disabledDetail
      - scheduled
      - rollupStatus
      - health
      - governorState
      - alertState
      - aiTriagingMode
      - muteState
      - mutedUntil
      - muteCount
      - lastErrorTime
      - lastAlarmTime
      - lastWarnTime
      - managedBy
      - lookbackSeconds
      - dataStabilizationDelaySeconds
      - maxAlertsPerHour
      - scheduling
      - inputQuery
      - valueColumn
      - aggregation
      - baseline
      - rules
      - groupBy
      - serviceBindings
      - actions
      - customVariables
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: Name of the monitor, unique within its workspace.
        description:
          type:
          - string
          - 'null'
          description: Monitor description. Null when no description is configured.
        disabled:
          type: boolean
          description: 'Whether the monitor is currently disabled, either by a user or automatically by the system on exceeding its alert rate or cost limit.

            '
        ruleKind:
          $ref: '#/components/schemas/Monitor-RuleKind'
        monitorVersion:
          type: string
          format: int64
          description: 'Version of the monitor''s current definition, as a Unix nanosecond timestamp — currently identical to `updatedAt`, and so it advances on every save. Alerts record the version they were evaluated against, so this identifies which definition produced a given alert. Carried as a string because it exceeds the JSON safe-integer range.

            '
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          $ref: '#/components/schemas/Time'
        disabledDetail:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledDetail'
          - type: 'null'
          description: 'Why the monitor is disabled. Null when it is enabled.

            '
        scheduled:
          type: boolean
          description: 'Whether the monitor runs on a cron, i.e. `scheduling.cron` is set.

            '
        rollupStatus:
          $ref: '#/components/schemas/Monitor-RollupStatus'
        health:
          $ref: '#/components/schemas/Monitor-Health'
        governorState:
          anyOf:
          - $ref: '#/components/schemas/Monitor-GovernorState'
          - type: 'null'
          description: 'Cost-governor state. Null when no spend limit is configured for the monitor, which is the common case. `health` already folds this in; read it directly only to distinguish "no limit" from `Normal`.

            '
        alertState:
          $ref: '#/components/schemas/Monitor-AlertState'
        aiTriagingMode:
          anyOf:
          - $ref: '#/components/schemas/Monitor-AiTriagingMode'
          - type: 'null'
          description: 'Whether AI auto-investigation runs when this monitor alerts. Null when the stored mode is not one this API declares. Not reported as `None`, because the filter compares the stored value and `aiTriagingMode == "None"` would not select these rows.

            '
        muteState:
          $ref: '#/components/schemas/Monitor-MuteState'
        mutedUntil:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the mute covering this monitor expires. Null when the monitor is not muted, or is muted indefinitely — use `muteState` to tell those apart.

            '
        muteCount:
          type: integer
          format: int64
          description: Number of mute rules currently covering this monitor.
        lastErrorTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a fatal error. Null if it never has.

            '
        lastAlarmTime:
          $ref: '#/components/schemas/NullableTime'
          description: When the monitor last raised an alert. Null if it never has.
        lastWarnTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a non-fatal warning. Null if it never has.

            '
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
          description: 'App that manages this monitor, or null when it is user-managed. Returned id-only; request the app separately for its metadata.

            '
        lookbackSeconds:
          type: number
          format: double
          description: Window of data each evaluation considers, in seconds.
        dataStabilizationDelaySeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How long evaluation waits for late data before judging a window, in seconds. Null when the monitor takes the server default.

            '
        maxAlertsPerHour:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Alerts per hour after which the monitor disables itself. Null when the monitor takes the server default.

            '
        scheduling:
          $ref: '#/components/schemas/Monitor-Scheduling'
        inputQuery:
          $ref: '#/components/schemas/Monitor-MultiStageQuery'
        valueColumn:
          type:
          - string
          - 'null'
          description: 'Column of the query output the monitor watches. Null for `Count`, `Promote` and `Composite`.

            '
        aggregation:
          anyOf:
          - $ref: '#/components/schemas/Monitor-ValueAggregation'
          - type: 'null'
          description: 'How `valueColumn` is reduced over each window before the rules compare it. Null unless `ruleKind` is `Threshold`.

            '
        baseline:
          anyOf:
          - $ref: '#/components/schemas/Monitor-Baseline'
          - type: 'null'
          description: 'What an anomaly monitor compares `valueColumn` against. Null unless `ruleKind` is `Anomaly`. A composite''s constituents and condition are read from `GET /v1/composite-monitors/{id}`.

            '
        rules:
          type: array
          description: 'When the monitor alerts, one rule per severity, including a `NoData` rule when the monitor alerts on missing data. Empty for `Composite` monitors, whose condition and level are read from `GET /v1/composite-monitors/{id}`.

            '
          items:
            $ref: '#/components/schemas/Monitor-Rule'
        groupBy:
          type: array
          description: 'Dimensions the rules are evaluated per; each distinct combination of values alerts independently. Empty for a single global alert.

            '
          items:
            $ref: '#/components/schemas/Monitor-Grouping'
        serviceBindings:
          type: array
          description: 'The service the monitor''s alerts are attributed to. At most one entry; empty when the monitor is not bound to a service.

            '
          items:
            $ref: '#/components/schemas/Monitor-ServiceBinding'
        actions:
          type: array
          description: 'The actions this monitor notifies through, and when each fires. Empty when it notifies nothing.

            '
          items:
            $ref: '#/components/schemas/Monitor-ActionRule'
        customVariables:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Free-form values the monitor author defined for substitution into action templates. Null when there are none.

            '
    Monitor-StatsMeta:
      title: MonitorStatsMeta
      type: object
      required:
      - totalMonitors
      - filteredMonitors
      properties:
        totalMonitors:
          type: integer
          format: int64
          description: 'Monitors the caller may read, before `filter` is applied.

            '
        filteredMonitors:
          type: integer
          format: int64
          description: 'Monitors the statistics were computed over, after `filter` is applied. Equal to `totalMonitors` when no filter was given.

            '
    Monitor-StatsResponse:
      title: MonitorStatsResponse
      type: object
      description: Aggregated stats for the requested monitor attributes.
      required:
      - attributes
      - meta
      properties:
        attributes:
          type: array
          description: 'One entry per requested `attributes` expression, in request order.

            '
          items:
            $ref: '#/components/schemas/AttributeStats'
        meta:
          $ref: '#/components/schemas/Monitor-StatsMeta'
    Alert-FacetEntry:
      title: AlertFacetEntry
      type: object
      description: A single facet value and its alert count.
      required:
      - key
      - label
      - count
      properties:
        key:
          type: string
          description: 'The facet value used for filtering (e.g. "Active", "Critical", a

            monitor ID, or "true"/"false" for boolean facets).

            '
        label:
          type:
          - string
          - 'null'
          description: 'Human-readable display label. For most facets this equals key.

            For monitors, this is the monitor label while key is the monitor ID.

            Null when no label is needed (i.e. it would equal key).

            '
        count:
          type: string
          format: int64
          description: Number of alerts matching this facet value.
    Alert-Facets:
      title: AlertFacets
      type: object
      description: 'Faceted counts of all alerts in the requested time window, grouped by

        key attributes. Computed independently of any filter or pagination

        parameters.

        '
      required:
      - byStatus
      - byLevel
      - byMonitor
      - byMuted
      properties:
        byStatus:
          type: array
          description: Count of alerts grouped by status (Active, Ended, Retracted).
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
        byLevel:
          type: array
          description: Count of alerts grouped by severity level.
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
        byMonitor:
          type: array
          description: Count of alerts grouped by monitor, ordered by count descending.
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
        byMuted:
          type: array
          description: Count of alerts grouped by mute status.
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
        byHasAiChat:
          type: array
          description: Count of alerts with vs without an AI investigation. Omitted when that feature is not enabled.
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
    Alert-ListResponse:
      title: AlertListResponse
      type: object
      required:
      - alerts
      - meta
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
        facets:
          $ref: '#/components/schemas/Alert-Facets'
          description: 'Faceted counts for key alert attributes across all alerts in the time

            window. Independent of filter and pagination. Only included when

            includeFacets=true.

            '
    ApiToken-ListResponse:
      title: ApiTokenListResponse
      type: object
      required:
      - apiTokens
      - meta
      properties:
        apiTokens:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Apm-Meta:
      title: ApmMeta
      type: object
      description: 'APM list-response meta. Extends platform Meta (totalCount only) with

        limit and offset echoed from the request. A totalCount of -1 means the

        exact count is unknown (too expensive to compute); in that case paginate

        by advancing offset until a short page (len(items) < limit) is returned.

        '
      required:
      - totalCount
      - limit
      - offset
      properties:
        totalCount:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
      additionalProperties: false
    Apm-EnvironmentEntry:
      title: ApmEnvironmentEntry
      type: object
      description: One environment + the service namespaces observed in it.
      required:
      - environment
      - serviceNamespaces
      - truncated
      properties:
        environment:
          type: string
        serviceNamespaces:
          type: array
          items:
            type: string
        truncated:
          type: boolean
          description: 'True when serviceNamespaces was capped at the server limit and the

            full set for this environment is larger than the array returned.

            serviceNamespaces is never paged; this flag signals truncation.

            '
      additionalProperties: false
    Apm-EnvironmentsListResponse:
      title: ApmEnvironmentsListResponse
      type: object
      description: 'Response envelope for GET /v1/apm/environments. `interval` echoes the

        server-resolved query window. Pagination is on the environments axis

        — `serviceNamespaces` is the complete list per environment, never paged.

        '
      required:
      - interval
      - environments
      - meta
      properties:
        interval:
          $ref: '#/components/schemas/Apm-Interval'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Apm-EnvironmentEntry'
        meta:
          $ref: '#/components/schemas/Apm-Meta'
      additionalProperties: false
    Apm-ServicesListResponse:
      title: ApmServicesListResponse
      type: object
      description: 'Response envelope for GET /v1/apm/services. `interval` echoes the

        server-resolved query window. `meta.totalCount` is `-1` when unknown.

        '
      required:
      - interval
      - services
      - meta
      properties:
        interval:
          $ref: '#/components/schemas/Apm-Interval'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Apm-Service'
        meta:
          $ref: '#/components/schemas/Apm-Meta'
      additionalProperties: false
    Dashboard-ListItem:
      title: DashboardListItem
      type: object
      additionalProperties: false
      required:
      - id
      - schemaVersion
      - name
      - createdAt
      - updatedAt
      - createdBy
      - description
      - updatedBy
      - managedBy
      - visibility
      - objectTags
      description: 'Dashboard envelope metadata returned by list. Does not include `definition`.


        When `expand=true`, `createdBy` and `updatedBy` include display

        fields (e.g. `label`); `managedBy.record` is populated. Without

        `expand`, references contain only `id`.

        '
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
        schemaVersion:
          type: integer
          enum:
          - 2
          description: Dashboard document schema version. Always `2` on the wire.
        name:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          $ref: '#/components/schemas/Time'
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
          description: 'The app or other object that manages this dashboard, or `null` when

            it is not managed. Returned only — it cannot be set through this

            API.

            '
        visibility:
          type: string
          enum:
          - Listed
          - Hidden
        objectTags:
          $ref: '#/components/schemas/ObjectTags'
    Dashboard-ListResponse:
      title: DashboardListResponse
      type: object
      additionalProperties: false
      required:
      - dashboards
      - meta
      - errors
      properties:
        dashboards:
          type: array
          description: 'This page of results. Empty when the filter matches nothing or the

            offset is past the end.

            '
          items:
            $ref: '#/components/schemas/Dashboard-ListItem'
        meta:
          $ref: '#/components/schemas/Meta'
        errors:
          type: array
          description: 'Items that could not be returned. Each entry identifies the dashboard

            by `id` and includes a `type`/`message` explaining why it was omitted.

            Empty when all items were returned successfully.

            '
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - type
            - message
            properties:
              id:
                $ref: '#/components/schemas/ObjectId'
              type:
                type: string
                description: Stable machine-readable error type.
              message:
                type: string
                description: Human-readable explanation of why this item was omitted.
    Dataset-ListResponse:
      title: DatasetListResponse
      type: object
      required:
      - datasets
      - meta
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    TagKind:
      title: TagKind
      type: string
      enum:
      - Metric
      - Correlation
      description: Kind of tag.
    Tag-Mapping:
      title: TagMapping
      type: object
      description: 'A single per-dataset definition of a tag.

        '
      required:
      - dataset
      - path
      - origin
      - discoveryRuleAlias
      - createdBy
      properties:
        dataset:
          $ref: '#/components/schemas/DatasetRef'
        path:
          $ref: '#/components/schemas/Dataset-FieldPath'
        origin:
          anyOf:
          - $ref: '#/components/schemas/DatasetRef'
          - type: 'null'
          description: 'The dataset in which this mapping was originally declared. When

            the tag was declared directly on `dataset`, `origin.id` equals

            `dataset.id`. When the tag was inherited from an upstream

            dataset, `origin` points to that upstream dataset. Only

            meaningful for `kind=Correlation`; always `null` for

            `kind=Metric`. Mirrors the GraphQL `TagSourceInfo.origin`

            convention.

            '
        discoveryRuleAlias:
          type:
          - string
          - 'null'
          description: 'The discovery rule alias that created this mapping, or `null` when

            the mapping was not created by a discovery rule. Only meaningful

            for `kind=Correlation`; always `null` for `kind=Metric`. If the tag

            is inherited from an upstream dataset, this field points to the

            discovery rule alias that created the mapping on the origin

            dataset.

            '
        createdBy:
          anyOf:
          - $ref: '#/components/schemas/User'
          - type: 'null'
          description: 'User who declared this mapping on `origin`. Only meaningful for

            `kind=Correlation`; always `null` for `kind=Metric`.

            '
    Tag-Resource:
      title: TagObject
      type: object
      description: 'A tag (correlation or metric) along with every dataset that defines

        it. Tags are identified by `(name, kind)`; there is no ObjectId for

        a tag — `name` is the natural identifier within a kind.

        '
      required:
      - name
      - kind
      - datasetCount
      - mappings
      properties:
        name:
          type: string
          description: Tag name. Natural identifier within `kind`.
        kind:
          $ref: '#/components/schemas/TagKind'
        datasetCount:
          type: integer
          format: int64
          description: Number of distinct datasets in which this tag is defined.
        mappings:
          type: array
          description: 'Per-dataset definitions of the tag. Always populated; use the

            `mappings.exists(m, m.dataset.id == ...)` CEL quantifier to

            filter tags scoped to a specific dataset.


            Limited to 20 entries.

            '
          items:
            $ref: '#/components/schemas/Tag-Mapping'
        sampleValues:
          type: array
          description: 'Up to 20 sample values observed for this tag, scoped to the

            datasets the caller can view. Present only when the request sets

            `sampleValues=true`. This is a bounded, non-paginated sample, NOT

            the full value set; it may be empty or absent when values could

            not be retrieved. Use `GET /v1/tags/values` to search values.

            '
          items:
            type: string
    Tag-ListResponse:
      title: TagListResponse
      type: object
      required:
      - tags
      - meta
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    IngestFilters-FilterableDatasetsResponse:
      title: IngestFiltersFilterableDatasetsResponse
      type: object
      description: A page of datasets eligible for drop filtering.
      required:
      - datasets
      - meta
      properties:
        datasets:
          type: array
          description: The eligible source datasets in this page.
          items:
            $ref: '#/components/schemas/DatasetRef'
        meta:
          $ref: '#/components/schemas/Meta'
          description: Pagination metadata, including the total dataset count.
    IngestFilters-ListResponse:
      title: IngestFiltersListResponse
      type: object
      description: A page of drop filters.
      required:
      - ingestFilters
      - meta
      properties:
        ingestFilters:
          type: array
          description: The drop filters in this page, in the requested order.
          items:
            $ref: '#/components/schemas/IngestFilters-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
          description: Pagination metadata, including the total filter count.
    IngestRoutes-ListResponse:
      title: IngestRoutesListResponse
      type: object
      description: All ingest routes for a type, in priority order.
      required:
      - ingestRoutes
      - meta
      properties:
        ingestRoutes:
          type: array
          description: The routes, ordered by descending priority. The type's default route is always last.
          items:
            $ref: '#/components/schemas/IngestRoutes-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
          description: Result metadata. `totalCount` is the number of routes for the type. This endpoint is not paginated, so it always equals the length of `ingestRoutes`.
    IngestToken-ListResponse:
      title: IngestTokenListResponse
      type: object
      required:
      - tokens
      - meta
      properties:
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/IngestToken-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Metric-Type:
      title: MetricType
      type: string
      description: 'Metric semantic type.


        * `CumulativeCounter`: A metric that represents a non-decreasing counter with possible resets.

        * `Delta`: A metric that represents a change in a value over time

        * `Gauge`: A metric that represents a value that can increase or decrease

        * `TDigest`: A metric that represents a t-digest of values

        * `Sample`: A metric that represents a sample of values

        * `Histogram`: A metric that represents an OpenTelemetry explicit bucket histogram

        * `ExponentialHistogram`: A metric that represents an OpenTelemetry exponential histogram

        '
      enum:
      - CumulativeCounter
      - Delta
      - Gauge
      - TDigest
      - Sample
      - Histogram
      - ExponentialHistogram
    Metric-Status:
      title: MetricStatus
      type: string
      description: 'Active: usable and currently reporting.

        Inactive: usable, but not currently reporting.

        Error: unusable because the metric dataset has errors in its

        definition.

        '
      enum:
      - Active
      - Inactive
      - Error
    Metric-Resource:
      title: MetricResource
      type: object
      description: 'A metric resource. Metrics do not have a globally unique ObjectId —

        they are identified by the tuple (dataset.id, name).

        '
      required:
      - name
      - dataset
      - type
      - unit
      - description
      - rollup
      - aggregate
      - intervalMillis
      - suggestedBucketSizeMillis
      - userDefined
      - status
      - lastReported
      - pointCount
      - cardinality
      - linkLabels
      - metricTags
      - correlationTags
      properties:
        name:
          type: string
          description: The metric's name within its dataset.
        dataset:
          $ref: '#/components/schemas/DatasetRef'
          description: 'Reference to the dataset that owns this metric. With ?expand=true,

            `record` is populated with the dataset brief (label, description,

            iconUrl, contentType).

            '
        type:
          $ref: '#/components/schemas/Metric-Type'
        unit:
          type:
          - string
          - 'null'
          description: 'Unit the metric values are reported in (e.g. "ms", "bytes",

            "requests/s"). Null when not specified.

            '
        description:
          type:
          - string
          - 'null'
          description: 'Free-form description of what the metric measures. Null when

            not specified.

            '
        rollup:
          type: string
          description: 'How values are combined when reducing along the time axis (e.g.

            "sum", "avg", "max", "min", "rate"). Drives the default temporal

            aggregation when querying this metric.

            '
        aggregate:
          type: string
          description: 'How values are combined when reducing along non-time dimensions

            (e.g. "sum", "avg", "max", "min"). Drives the default spatial

            aggregation across tag groupings.

            '
        intervalMillis:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Reporting interval, in milliseconds (e.g. 60000 for a metric

            reported every 60 seconds). If the user declared an interval

            for this metric (via the `set_metric` OPAL verb), this field reflects

            the declared value. Otherwise, this field is the observed cadence

            derived from metric discovery sampling. Null when neither a declaration nor sufficient

            observations are available.

            '
        suggestedBucketSizeMillis:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Suggested bucket size for queries against this metric, in

            milliseconds. Null when not enough samples have been observed.

            '
        userDefined:
          type: boolean
          description: 'Whether the metric has been defined explicitly by the user.

            Non-user-defined metrics are discovered by scanning metric data.

            '
        status:
          $ref: '#/components/schemas/Metric-Status'
        lastReported:
          $ref: '#/components/schemas/NullableTime'
          description: 'Last time this metric was reported, derived from metric

            discovery sampling. May be underreported by up to an hour.

            Null when no observations are available.

            '
        pointCount:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Number of data points observed for this metric in the

            discovery sampling window. Null when no observations are

            available.

            '
        cardinality:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Number of distinct tag combinations observed for this metric

            in the discovery sampling window. Null when no observations

            are available.

            '
        linkLabels:
          type: array
          items:
            type: string
          description: 'Link labels on the metric dataset that are useful for

            grouping/filtering this metric, ranked by usefulness and

            cardinality. Derived from metric discovery sampling.

            '
        metricTags:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-FieldPath'
          description: 'Tag paths observed for this metric, ranked by cardinality.

            Derived from metric discovery sampling.

            '
        correlationTags:
          type: array
          items:
            $ref: '#/components/schemas/Dataset-CorrelationTag'
          description: 'Correlation tags on the metric dataset filtered to those

            relevant to this metric. Derived from metric discovery

            sampling.

            '
    Metric-ListResponse:
      title: MetricListResponse
      type: object
      required:
      - metrics
      - meta
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    MonitorV2MuteRuleScheduleTerse:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/MonitorV2MuteScheduleType'
    MonitorV2MuteRuleTerse:
      type: object
      required:
      - id
      - name
      - schedule
      - validFrom
      properties:
        schedule:
          $ref: '#/components/schemas/MonitorV2MuteRuleScheduleTerse'
        validFrom:
          readOnly: true
          $ref: '#/components/schemas/Time'
        validTo:
          readOnly: true
          $ref: '#/components/schemas/Time'
        monitorID:
          $ref: '#/components/schemas/ObjectId'
        id:
          readOnly: true
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        isGlobal:
          type: boolean
          readOnly: true
        isConditional:
          type: boolean
          readOnly: true
    MonitorMute-ListResponse:
      title: MonitorMuteListResponse
      type: object
      required:
      - monitorMutes
      - meta
      properties:
        monitorMutes:
          type: array
          items:
            $ref: '#/components/schemas/MonitorMute-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Monitor-ListItem:
      title: MonitorListItem
      type: object
      description: 'Monitor envelope and derived state, as returned by the collection endpoints. Does not include `inputQuery`, `rules` or `groupBy` -- read one monitor with `GET /v1/monitors/{id}` for those.

        '
      required:
      - id
      - name
      - label
      - description
      - disabled
      - ruleKind
      - monitorVersion
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - disabledDetail
      - scheduled
      - rollupStatus
      - health
      - governorState
      - alertState
      - aiTriagingMode
      - muteState
      - mutedUntil
      - muteCount
      - lastErrorTime
      - lastAlarmTime
      - lastWarnTime
      - managedBy
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          description: 'Name of the monitor, unique within its workspace.

            '
        label:
          type: string
          deprecated: true
          description: Same as `name`. Deprecated; read `name` instead.
        description:
          type:
          - string
          - 'null'
          description: Monitor description. Null when no description is configured.
        disabled:
          type: boolean
          description: 'Whether the monitor is currently disabled, either by a user or automatically by the system on exceeding its alert rate or cost limit.

            '
        ruleKind:
          $ref: '#/components/schemas/Monitor-RuleKind'
        monitorVersion:
          type: string
          format: int64
          description: 'Version of the monitor''s current definition, as a Unix nanosecond timestamp — currently identical to `updatedAt`, and so it advances on every save. Alerts record the version they were evaluated against, so this identifies which definition produced a given alert. Carried as a string because it exceeds the JSON safe-integer range.

            '
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          $ref: '#/components/schemas/Time'
        disabledDetail:
          anyOf:
          - $ref: '#/components/schemas/Monitor-DisabledDetail'
          - type: 'null'
          description: 'Why the monitor is disabled. Null when it is enabled.

            '
        scheduled:
          type: boolean
          description: Whether the monitor runs on a cron.
        rollupStatus:
          $ref: '#/components/schemas/Monitor-RollupStatus'
        health:
          $ref: '#/components/schemas/Monitor-Health'
        governorState:
          anyOf:
          - $ref: '#/components/schemas/Monitor-GovernorState'
          - type: 'null'
          description: 'Cost-governor state. Null when no spend limit is configured for the monitor, which is the common case. `health` already folds this in; read it directly only to distinguish "no limit" from `Normal`.

            '
        alertState:
          $ref: '#/components/schemas/Monitor-AlertState'
        aiTriagingMode:
          anyOf:
          - $ref: '#/components/schemas/Monitor-AiTriagingMode'
          - type: 'null'
          description: 'Whether AI auto-investigation runs when this monitor alerts. Null when the stored mode is not one this API declares. Not reported as `None`, because the filter compares the stored value and `aiTriagingMode == "None"` would not select these rows.

            '
        muteState:
          $ref: '#/components/schemas/Monitor-MuteState'
        mutedUntil:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the mute covering this monitor expires. Null when the monitor is not muted, or is muted indefinitely — use `muteState` to tell those apart.

            '
        muteCount:
          type: integer
          format: int64
          description: Number of mute rules currently covering this monitor.
        lastErrorTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a fatal error. Null if it never has.

            '
        lastAlarmTime:
          $ref: '#/components/schemas/NullableTime'
          description: When the monitor last raised an alert. Null if it never has.
        lastWarnTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a non-fatal warning. Null if it never has.

            '
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
          description: 'App that manages this monitor, or null when it is user-managed. Returned id-only; request the app separately for its metadata.

            '
    Monitor-ListResponse:
      title: MonitorListResponse
      type: object
      description: 'One page of monitors. `meta.totalCount` counts the monitors matching the request across all pages, not the page.

        '
      required:
      - monitors
      - meta
      properties:
        monitors:
          type: array
          items:
            $ref: '#/components/schemas/Monitor-ListItem'
        meta:
          $ref: '#/components/schemas/Meta'
    ServiceAccount-ListResponse:
      title: ServiceAccountListResponse
      type: object
      required:
      - serviceAccounts
      - meta
      properties:
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Skill-ListResponse:
      title: SkillListResponse
      type: object
      required:
      - skills
      - meta
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Documentation-SearchRequest:
      title: DocumentationSearchRequest
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: Natural-language search query.
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
          description: Maximum number of results to return.
        minScore:
          type: number
          format: float
          default: 0.5
          minimum: 0
          maximum: 1
          description: Minimum cosine similarity score. Results below this threshold are excluded.
    Documentation-SearchResult:
      title: DocumentationSearchResult
      type: object
      required:
      - title
      - text
      properties:
        title:
          type: string
          description: Chunk title, typically the source document or section name.
        text:
          type: string
          description: The chunk's text content.
        url:
          type:
          - string
          - 'null'
          description: Link to the full documentation page on docs.observeinc.com, or null if unavailable.
    Documentation-SearchResponse:
      title: DocumentationSearchResponse
      type: object
      required:
      - documentation
      - meta
      properties:
        documentation:
          type: array
          items:
            $ref: '#/components/schemas/Documentation-SearchResult'
        meta:
          $ref: '#/components/schemas/Meta'
    ObjectTagKey:
      title: ObjectTagKey
      type: object
      required:
      - key
      - count
      properties:
        key:
          type: string
          description: The tag key
        count:
          type: integer
          format: int64
          description: Number of objects with this tag key
    ObjectTagKeys-SearchResponse:
      title: ObjectTagKeysSearchResponse
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTagKey'
          description: Unique tag keys with counts, sorted by count descending then alphabetically
          example:
          - key: environment
            count: 42
          - key: team
            count: 15
    ObjectTagValue:
      title: ObjectTagValue
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
          description: The tag value
        count:
          type: integer
          format: int64
          description: Number of objects with this tag key-value pair
    ObjectTagValues-SearchResponse:
      title: ObjectTagValuesSearchResponse
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTagValue'
          description: Unique values with counts, sorted by count descending then alphabetically
          example:
          - value: production
            count: 25
          - value: staging
            count: 10
    TagValues-SearchMode:
      title: TagValuesSearchMode
      type: string
      enum:
      - Regex
      - Semantic
      description: '`Regex`: treat `query` as a regular expression.

        `Semantic`: use semantic search against `query`.

        '
    TagValuePair:
      title: TagValuePair
      type: object
      required:
      - name
      - value
      - kind
      properties:
        name:
          type: string
          description: Tag name.
        value:
          type: string
          description: Tag value.
        kind:
          $ref: '#/components/schemas/TagKind'
    TagValues-Response:
      title: TagValuesResponse
      type: object
      required:
      - tagValuePairs
      - meta
      properties:
        tagValuePairs:
          type: array
          description: Tag name-value pairs matching the query and pagination.
          items:
            $ref: '#/components/schemas/TagValuePair'
        meta:
          $ref: '#/components/schemas/Meta'
    ApiToken-UpdateRequest:
      title: ApiTokenUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        lifetimeHours:
          type: integer
          minimum: 1
        disabled:
          type: boolean
    Dashboard-UpdateRequest:
      title: DashboardUpdateRequest
      type: object
      additionalProperties: false
      description: 'Merge-patch (RFC 7396) body for a dashboard. Only fields present are

        applied. When `definition` is present it replaces the whole document.

        '
      properties:
        schemaVersion:
          type: integer
          enum:
          - 2
          description: Must be `2` when sent.
        name:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        visibility:
          type: string
          enum:
          - Listed
          - Hidden
        objectTags:
          $ref: '#/components/schemas/ObjectTags'
        definition:
          $ref: '#/components/schemas/DashboardContent'
    DatasetQueryFilter-UpdateRequest:
      title: DatasetQueryFilterUpdateRequest
      type: object
      properties:
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type:
          - string
          - 'null'
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. When updating a filter''s semantics, a request may provide either `filter` or `pipeline`, but not both.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            When updating a filter''s semantics, a request may provide either `filter` or `pipeline`, but not both. `pipeline` is preferred, as `filter` may be removed in a future API version.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type:
          - string
          - 'null'
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
    IngestFilters-UpdateRequest:
      title: IngestFiltersUpdateRequest
      type: object
      description: Merge-patch payload (RFC 7396). Only fields explicitly present are updated; omitted fields keep their current value. `description`, `iconUrl`, and `layout` accept an explicit `null` to clear them. `label`, `pipeline`, `dropRate`, and `enabled` are not nullable — sending `null` for any of those is rejected with a 400.
      properties:
        label:
          type: string
          description: Display name of the filter.
        description:
          type:
          - string
          - 'null'
          description: Optional human-readable description. `null` clears it.
        iconUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Optional icon shown in the UI. `null` clears it.
        pipeline:
          type: string
          description: OPAL pipeline expression defining the filter predicate. Compiled against the source dataset's schema; compilation failure returns a 400.
        layout:
          type:
          - object
          - 'null'
          description: Reserved for UI state, never interpreted by Observe. `null` clears it.
        dropRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction (0.0-1.0) of matching observations to drop. 1.0 = drop all matches; 0.0 = drop none.
        enabled:
          type: boolean
          description: Whether the filter is actively dropping observations. Send this field alone to enable or disable an existing filter.
      examples:
      - enabled: false
      - label: drop-debug-logs
        pipeline: filter severity = "DEBUG"
        dropRate: 0.95
    IngestRoutes-UpdateRequest:
      title: IngestRoutesUpdateRequest
      type: object
      description: 'Merge-patch payload (RFC 7396). Only fields explicitly present are updated; omitted fields keep their current value. Priority is not settable here — use `PATCH /v1/ingest/routes/{type}` to reorder.


        `secondaryDestinationId` accepts an explicit `null` to clear it.'
      properties:
        pipeline:
          type: string
          description: Replacement OPAL match predicate, subject to the same compilation and per-type restrictions as on create.
        layout:
          type: object
          description: Opaque JSON blob round-tripped to the frontend; not interpreted by the server. Ignored for a type's default route.
        destinationId:
          $ref: '#/components/schemas/ObjectId'
          description: Replacement primary destination dataset ID. Must be a source dataset whose type matches the route's type.
        secondaryDestinationId:
          $ref: '#/components/schemas/NullableObjectId'
          description: Replacement secondary destination dataset ID, subject to the same type check. Pass `null` to remove the secondary destination.
        enabled:
          type: boolean
          description: Set true to start evaluating this route against incoming data. New routes are created disabled, so this is the call that puts a route into service.
    IngestRoutes-UpdatePriorityRequest:
      title: IngestRoutesUpdatePriorityRequest
      type: object
      description: New priority order for every route of a type. Reordering is a whole-list operation; there is no way to move a single route.
      required:
      - ordering
      properties:
        ordering:
          type: array
          description: Route IDs in the desired priority order, highest priority first. Must contain every route ID for the type exactly once.
          items:
            $ref: '#/components/schemas/ObjectId'
    IngestToken-UpdateRequest:
      title: IngestTokenUpdateRequest
      type: object
      properties:
        name:
          type: string
          maxLength: 127
          description: New name. Must be unique per customer; max 127 bytes.
        description:
          type:
          - string
          - 'null'
          maxLength: 255
          description: New description. Max 255 bytes. `null` resets it to an empty string.
        disabled:
          type: boolean
    MonitorV2PatchRequest:
      type: object
      description: 'Request body for `PATCH .../monitors/{id}`. Every property is optional. Only these

        top-level keys participate in the update; see the operation description for merge vs

        whole-value replacement rules.

        '
      properties:
        name:
          type: string
        disabled:
          type: boolean
        description:
          type: string
        ruleKind:
          $ref: '#/components/schemas/MonitorV2RuleKind'
        definition:
          $ref: '#/components/schemas/MonitorV2Definition'
        actionRules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ActionRule'
    MonitorMute-UpdateRequest:
      title: MonitorMuteUpdateRequest
      description: 'All fields are optional. Omitted fields are left unchanged. Sending a `target` object replaces the entire target subtree atomically; `target.kind` must match the existing value (it is immutable). Send `filter: null` to remove an existing filter.

        '
      type: object
      properties:
        label:
          type: string
        description:
          type:
          - string
          - 'null'
          description: Pass `null` to clear the description.
        target:
          $ref: '#/components/schemas/MonitorMute-TargetInput'
        schedule:
          $ref: '#/components/schemas/MonitorMute-ScheduleInput'
        filter:
          type:
          - string
          - 'null'
          description: Pass `null` to remove an existing filter.
    ReferenceTables-TableMetadataPatch:
      title: ReferenceTableMetadataPatch
      type: object
      properties:
        label:
          type:
          - string
          - 'null'
          description: The label of the reference table.
        description:
          type:
          - string
          - 'null'
          description: The description of the reference table.
        primaryKey:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The primary key of the reference table.
    ServiceAccount-UpdateRequest:
      title: ServiceAccountUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        disabled:
          type: boolean
          description: Whether the service account is disabled. Disabling a service account will delete all of its API tokens.
        externalOAuth:
          description: The external OAuth binding for this service account. Set to null to clear the binding.
          anyOf:
          - $ref: '#/components/schemas/ServiceAccount-ExternalOAuth'
          - type: 'null'
    Skill-UpdateRequest:
      title: SkillUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/Skill-Visibility'
    IngestFilters-ValidateRequest:
      title: IngestFiltersValidateRequest
      type: object
      description: A pipeline to compile, plus the dataset whose schema it compiles against.
      required:
      - pipeline
      - sourceDataset
      properties:
        pipeline:
          type: string
          description: OPAL pipeline expression to compile.
        sourceDataset:
          $ref: '#/components/schemas/DatasetRef'
          description: Source dataset reference. Only the `id` is consumed; any `record` payload is ignored.
    IngestFilters-CompilerErrorPos:
      title: IngestFiltersCompilerErrorPos
      type: object
      description: A single position within the pipeline text.
      properties:
        row:
          type: integer
          format: int32
          description: Line number, starting at 1.
        col:
          type: integer
          format: int32
          description: Column number within the line, starting at 1.
    IngestFilters-CompilerErrorSpan:
      title: IngestFiltersCompilerErrorSpan
      type: object
      description: A half-open range within the pipeline text, from `start` up to `end`.
      properties:
        start:
          $ref: '#/components/schemas/IngestFilters-CompilerErrorPos'
          description: First position covered by the error.
        end:
          $ref: '#/components/schemas/IngestFilters-CompilerErrorPos'
          description: Position just past the last one covered by the error.
    IngestFilters-CompilerError:
      title: IngestFiltersCompilerError
      type: object
      description: A single compiler error from compiling the OPAL pipeline.
      required:
      - type
      - message
      properties:
        type:
          type: string
          description: Stable identifier for the kind of compiler error.
        message:
          type: string
          description: Human-readable explanation of the error.
        span:
          $ref: '#/components/schemas/IngestFilters-CompilerErrorSpan'
          description: Location of the error within the pipeline text. Absent when the compiler could not attribute the error to a specific position.
    IngestFilters-ValidateResponse:
      title: IngestFiltersValidateResponse
      type: object
      description: 'Result of compiling the pipeline. A 200 does not mean the pipeline is valid: check that `errors` is empty.'
      required:
      - errors
      properties:
        errors:
          type: array
          description: Compiler errors, in source order. Empty when the pipeline compiled successfully.
          items:
            $ref: '#/components/schemas/IngestFilters-CompilerError'
      examples:
      - errors: []
      - errors:
        - type: unknown_column
          message: column "sevrity" does not exist
          span:
            start:
              row: 1
              col: 8
            end:
              row: 1
              col: 15
  parameters:
    ExpandParam:
      name: expand
      in: query
      description: Whether to expand resources referenced in the response to include additional fields
      schema:
        type: boolean
    DatasetIdParam:
      name: datasetId
      in: path
      required: true
      description: The ID of the dataset
      schema:
        type: string
        format: int64
    IngestRoutes-Type:
      in: path
      name: type
      schema:
        $ref: '#/components/schemas/IngestRoutes-Type'
      required: true
      description: 'The type of the ingest route to query. These types correspond to the various source dataset schemas supported by Observe.

        `any` refers to the "default" generic source dataset schema with the `FIELDS` and `EXTRA` columns. All of the others

        correspond to direct-write source datasets. Each type is also associated with particular ingest HTTP endpoints that emit

        compatible data for that type. Incoming data on a given endpoint is routable to any dataset of the corresponding type.


        The following [type -> ingest path] mappings are defined:


        - `otellogs` <-> `/v1/otel/v1/logs`

        - `otelmetrics` <-> `/v1/otel/v1/metrics`

        - `oteltraces` <-> `/v1/otel/v1/traces`

        - `prometheus` <-> `/v1/prometheus`

        - `k8sentity` <-> `/v1/kubernetes`

        - `any` <-> `/v1/*`

        '
      example: otellogs
    Dashboard-Id:
      name: id
      in: path
      required: true
      description: 'Unique identifier of the dashboard (numeric id serialized as a string).

        '
      schema:
        type: string
        format: int64
      example: '41000001'
    IngestFilters-Id:
      in: path
      name: id
      schema:
        type: string
        format: int64
      required: true
      description: The ID of the drop filter.
      example: '41030001'
    IngestRoutes-Id:
      in: path
      name: id
      schema:
        type: string
        format: int64
      required: true
      description: The id of the ingest route
      example: '1'
    IngestTokens-TokenId:
      name: id
      in: path
      required: true
      description: The stable token id (the `ds1...` string).
      schema:
        type: string
    Apm-ServiceNameParam:
      name: serviceName
      in: query
      description: 'OTel service.name. Single-value exact-match filter; omit (or pass an

        empty value) to match services with any service.name.

        '
      schema:
        type: string
    Apm-ServiceNamespaceParam:
      name: serviceNamespace
      in: query
      description: 'OTel service.namespace. Single-value exact-match filter; omit (or pass

        an empty value) to match services in any namespace.

        '
      schema:
        type: string
    Apm-StartTimeParam:
      name: startTime
      in: query
      description: 'RFC3339 window start (inclusive). The query window is `[startTime,

        endTime)`. The two bounds are independent: omit `startTime` and it

        defaults to `endTime − 1h`; omit `endTime` and it defaults to now;

        omit both for the last hour. `startTime` must be earlier than

        `endTime`, otherwise `BadRequest`.

        '
      schema:
        type: string
        format: date-time
    Apm-EndTimeParam:
      name: endTime
      in: query
      description: 'RFC3339 window end (exclusive). Defaults to now when omitted. Pairs with

        `startTime` to form the `[startTime, endTime)` window; see `startTime`

        for the full defaulting rule.

        '
      schema:
        type: string
        format: date-time
    Monitor-Id:
      name: id
      in: path
      required: true
      description: 'Unique identifier of the monitor. A string, as every response body renders it.

        '
      schema:
        type: string
        format: int64
      example: '41000123'
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return in the response
      schema:
        type: integer
        format: int64
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip before starting to collect the result set
      schema:
        type: integer
        format: int64
    Apm-EnvironmentParam:
      name: environment
      in: query
      description: 'OTel deployment.environment. Single-value exact-match filter; omit (or

        pass an empty value) to match services in any environment.

        '
      schema:
        type: string
    Apm-LimitParam:
      name: limit
      in: query
      description: Max items per page. Default 100, range [1, 100000].
      schema:
        type: integer
        format: int64
        default: 100
        minimum: 1
        maximum: 100000
    Apm-OffsetParam:
      name: offset
      in: query
      description: Items to skip before the page starts. Default 0.
      schema:
        type: integer
        format: int64
        default: 0
        minimum: 0
    Apm-OrderByEnvironmentsParam:
      name: orderBy
      in: query
      description: 'Sort key (single key; leading `-` for descending).

        Default: `environment`. Allowed: `environment` (and `-environment`).

        Ties are broken by `environment` ascending (the primary key, so ties

        across rows are impossible — each environment appears once).

        '
      schema:
        type: string
        default: environment
        enum:
        - environment
        - -environment
    Apm-ExpandParam:
      name: expand
      in: query
      description: 'Endpoint-specific opt-in. On /v1/apm/services, expand=true populates

        redMetrics.series[] on every row.

        '
      schema:
        type: boolean
        default: false
    Apm-OrderByServicesParam:
      name: orderBy
      in: query
      description: 'Sort key (single key; leading `-` for descending).

        Default: `serviceName`. Allowed: `serviceName`, `environment`,

        `serviceNamespace`, `invocationRatePerSecond`, `errorRatePerSecond`,

        `durationP95Seconds` (and their `-` descending forms). Sorts on

        row-level scalars only — does not affect series order. Ties on the

        primary key are broken by `serviceName` ascending for deterministic

        pagination.

        '
      schema:
        type: string
        default: serviceName
        enum:
        - serviceName
        - -serviceName
        - environment
        - -environment
        - serviceNamespace
        - -serviceNamespace
        - invocationRatePerSecond
        - -invocationRatePerSecond
        - errorRatePerSecond
        - -errorRatePerSecond
        - durationP95Seconds
        - -durationP95Seconds
    IngestFilters-OffsetQuery:
      in: query
      name: offset
      required: false
      description: Number of items to skip before starting to collect the result set.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    IngestFilters-LimitQuery:
      in: query
      name: limit
      required: false
      description: Maximum number of items to return in the response.
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 100
    IngestFilters-OrderByQuery:
      in: query
      name: orderBy
      required: false
      schema:
        type: string
      description: 'Comma-separated list of fields to order results by. Prefix a field

        with `-` for descending. Default ordering is by `id`.

        Supported fields: `id`, `label`, `enabled`, `dropRate`,

        `sourceDataset.id`.

        '
    IngestFilters-FilterQuery:
      in: query
      name: filter
      required: false
      schema:
        type: string
      description: 'CEL expression that response drop filters must match. Must evaluate

        to `bool`. Must be URL-encoded.

        Supported fields: `id` (int), `label` (string), `sourceDataset.id`

        (int), `enabled` (bool).

        '
      examples:
        filterByLabel:
          summary: Exact label match
          value: label == "my-filter"
        filterByLabelRegex:
          summary: Regex search by label
          value: label.matches(".*prod.*")
        filterBySourceDataset:
          summary: All filters attached to a given source dataset
          value: sourceDataset.id == 41030001
        filterCombined:
          summary: Enabled filters whose label contains "checkout"
          value: enabled && label.contains("checkout")
  responses:
    ErrorResponse-400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-429:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-5XX:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-422:
      description: Unprocessable entity — a required query parameter was omitted (e.g. `missing_field`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Apm-ErrorResponse-400:
      description: Bad request (BadRequest, RequiredParamMissing, InvalidTimestamp, OutOfAcceleratedRange, NotConfigured).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Apm-Error'
    Apm-ErrorResponse-413:
      description: Payload too large (PayloadTooLarge).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Apm-Error'
    Apm-ErrorResponse-500:
      description: Internal server error (InternalError).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Apm-Error'
    Apm-ErrorResponse-504:
      description: Query timed out (TimedOut).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Apm-Error'
    Apm-ErrorResponse-401:
      description: Unauthorized — missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Apm-ErrorResponse-403:
      description: Forbidden — the caller lacks permission for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    Apm-ErrorResponse-404:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
