          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
  /v1/datasets/{datasetId}/query-filters/{id}:
    delete:
      summary: Delete a dataset query filter
      description: Delete an existing query filter
      operationId: DeleteDatasetQueryFilter
      tags:
      - Dataset Query Filter
      parameters:
      - $ref: '#/components/parameters/DatasetIdParam'
      - name: id
        in: path
        required: true
        description: The ID of the query filter to delete
        schema:
          type: string
          format: int64
        example: '7890123'
      responses:
        '204':
          description: Dataset query filter deleted successfully
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: Get a dataset query filter by ID
      description: Retrieve a specific query filter by its ID
      operationId: GetDatasetQueryFilterById
      tags:
      - Dataset Query Filter
      parameters:
      - $ref: '#/components/parameters/DatasetIdParam'
      - name: id
        in: path
        required: true
        description: The ID of the query filter to retrieve
        schema:
          type: string
          format: int64
        example: '7890123'
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Dataset query filter retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQueryFilter-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
