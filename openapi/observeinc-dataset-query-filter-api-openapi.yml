        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    patch:
      summary: Update a dataset query filter
      description: Update an existing query filter using JSON Merge Patch semantics
      operationId: UpdateDatasetQueryFilter
      tags:
      - Dataset Query Filter
      parameters:
      - $ref: '#/components/parameters/DatasetIdParam'
      - name: id
        in: path
        required: true
        description: The ID of the query filter to update
        schema:
          type: string
          format: int64
        example: '7890123'
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryFilter-UpdateRequest'
      responses:
