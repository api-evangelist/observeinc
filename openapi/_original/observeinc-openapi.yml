  /v1/datasets:
    get:
      summary: Get a list of datasets
      description: 'Returns a paginated list of datasets the caller has read access to,

        optionally filtered and ordered with a CEL expression. Default page

        size is 50; maximum is 100. Default ordering is by `id` ascending.


        Set `expand=true` to inline reference fields (`createdBy`,

        `managedBy`, `storageIntegration.record`, …). Without `expand`,

        references contain only `id`.


        ## Filtering and ordering with CEL


        The `filter` and `orderBy` query parameters are evaluated as

        [Common Expression Language (CEL)](https://cel.dev) expressions

        against a stable schema that mirrors the dataset response body.

        `filter` must evaluate to `bool`; `orderBy` is a CSV list of

        CEL expressions whose values must be comparable. URL-encode

        both; CSV-escape `orderBy` items first (see the `orderBy`

        parameter for syntax).


        Expressions that reference unknown fields, use the wrong type, or

        exceed the server-side cost limit return 400.


        ### CEL → REST field mapping


        With the exceptions noted below, every CEL field name matches the

        JSON key on `Dataset-Resource` 1‑to‑1, and CEL types map to JSON

        wire types as follows:


        | CEL type            | JSON wire type                                   |

        | ------------------- | ------------------------------------------------ |

        | `string`, `string?` | string (or `null` when nullable)                 |

        | `bool`              | boolean                                          |

        | `int`               | integer                                          |

        | `timestamp`         | RFC 3339 string (e.g. `createdAt`, `updatedAt`)  |

        | `list(T)`           | array                                            |

        | `map(K, V)`         | object                                           |

        | Wrapper types       | nested object with the same sub-field names      |


        Every `id` field — top-level and nested — is `int` in CEL but

        rendered as `string` in JSON (int64 values may overflow the JS

        number range). Compare with an integer literal in CEL:

        `id == 41000234`, not `id == "41000234"`.


        ### Discrepancies between CEL and REST


        | Field                          | CEL                                            | REST                                   | Notes                                                                                                                         |

        | ------------------------------ | ---------------------------------------------- | -------------------------------------- | ----------------------------------------------------------------------------------------------------------------------------- |

        | `_name`, `_package`            | `string`, derived from `label`                 | not present                            | CEL-only convenience fields. `label = "Logs/AWS/CloudTrail"` ⇒ `_package = "Logs/AWS/"`, `_name = "CloudTrail"`.              |

        | `createdAt`, `updatedAt`       | `timestamp`                                    | RFC 3339 string                        | In CEL, compare with `timestamp("2024-01-01T00:00:00Z")` or use `now() - duration("24h")`.                                     |

        | `storageIntegration.record.*`  | always loadable for filter evaluation          | only present when `expand=true`        | A filter like `storageIntegration.record.label == "snowflake-prod"` works on every request; the `record` object is only echoed back in the response when `expand=true`. |


        ### Available CEL functions


        The dataset CEL environment registers the [CEL standard

        definitions](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#StdLib)

        (operators, `in`, `?:`, `size()`, `string.contains`, `string.startsWith`,

        `string.endsWith`, `matches`, etc.) plus the following extension

        libraries from

        [cel-go v0.28.0](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext):


        - [`ext.Strings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Strings) — `charAt`, `indexOf`, `join`, `lowerAscii`, `replace`, `split`, `substring`, `trim`, `upperAscii`, `format`

        - [`ext.Lists`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Lists) — `lists.flatten`, `lists.range`, `lists.slice`

        - [`ext.Math`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Math) — `math.greatest`, `math.least`

        - [`ext.Sets`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Sets) — `sets.contains`, `sets.equivalent`, `sets.intersects`

        - [`ext.Regex`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Regex) — `re.capture`, `re.extract`

        - [`ext.Encoders`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Encoders) — `base64.encode`, `base64.decode`

        - [`ext.Bindings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Bindings) — `cel.bind` for let-binding sub-expressions

        - [`ext.Protos`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Protos) — protobuf helpers

        - [`cel.OptionalTypes`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#OptionalTypes) — `optional.of`, `optional.ofNonZero`, `optional.none`


        See `Dataset-Resource` below for the full set of fields and types.


        ## Semantic search


        Pass `query` to find datasets by meaning rather than by exact field values.

        Results are ranked by relevance descending; `orderBy` is ignored when

        `query` is set. `meta.totalCount` is always `-1` for semantic-search

        requests because the full match count cannot be computed efficiently.


        `filter` may be combined with `query` to narrow results after ranking.

        When both are set, the response may contain fewer than `limit` items

        if many ranked candidates are filtered out.


        Returns 404 if semantic search is not available in this deployment.

        '
      operationId: ListDatasets
      tags:
      - Dataset
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: "CEL expression that response datasets must match. Must evaluate to\n`bool`. Must be URL-encoded. See the operation description for the\nCEL primer (field mapping, type discrepancies, available functions).\n\n## CEL functions\n\n### `hasCorrelationTag(tag string, value string) bool`\n\nReturns `true` if this dataset has ever been associated with the\ncorrelation tag key-value pair `tag=value`.\n\nBoth arguments must be constant string literals. Field references,\n`cel.bind` names, and function calls are rejected with HTTP 400.\n\nError conditions:\n- HTTP 400 if a `(tag, value)` pair matches more than 10,000 datasets.\n  Narrow the tag name or value to reduce the match set.\n- HTTP 400 if this feature is not available for your account.\n  Contact support to enable correlation-tag filtering.\n- HTTP 503 if the tag index is temporarily unavailable. Retry after a short interval.\n\n### `hasCorrelationTag(tag string) bool`\n\nReturns `true` if this dataset contains or inherits\
          \ the correlation\ntag named `tag` (regardless of value).\n\nThe argument must be a constant string literal. Field references,\n`cel.bind` names, and function calls are rejected with HTTP 400.\n"
        examples:
          equalityAndIdList:
            summary: Top-level scalars and an `id` list (note `id` is `int` in CEL, even though it serializes as a string in JSON)
            value: label == "Source" || id in [40000123, 40000456]
          nullSafeNestedRef:
            summary: Null-guarded traversal into a nested reference record
            value: storageIntegration != null && storageIntegration.record.label == "snowflake-prod"
          mapAndListQuantifier:
            summary: Map key check plus a list quantifier over nested objects
            value: '"env" in objectTags && interfaces.exists(i, i.path == "log")'
          stringAndTimestampFunctions:
            summary: Regex match and timestamp comparison
            value: label.matches("^Logs/AWS/") && createdAt > timestamp("2024-01-01T00:00:00Z")
          urlEncoded:
            summary: URL-encoded form of the equalityAndIdList example
            value: label%20%3D%3D%20%22Source%22%20%7C%7C%20id%20in%20%5B40000123%2C%2040000456%5D
          filterByCorrelationTagKV:
            summary: Filter by a single correlation tag key-value pair
            value: hasCorrelationTag("customer.name","tekion")
          filterByCorrelationTagPresence:
            summary: Filter to datasets that contain or inherit a correlation tag
            value: hasCorrelationTag("env")
          filterByTagAndMetadata:
            summary: Combine hasCorrelationTag with a metadata filter
            value: hasCorrelationTag("customer.name","tekion") && label.startsWith("k8s")
          filterByTagOr:
            summary: Union of two correlation tag values
            value: hasCorrelationTag("env","prod") || hasCorrelationTag("env","staging")
      - in: query
        name: orderBy
        schema:
          type: string
        required: false
        description: 'CSV list of CEL expressions, each producing a comparable value. Prefix an item with `-` for descending order. Default sort is `id` ascending; pagination is stable as long as no datasets are created or deleted between requests.

          CSV-escape first, then URL-encode. Wrap an item in `"` if it contains a comma or `"`; double a literal `"` to `""` inside a quoted item.

          **Ignored when `query` is set** — results are ordered by relevance when semantic search is active (see the Semantic search section in the operation description).

          '
        examples:
          csvQuotedExpression:
            summary: Multi-key sort with a CSV-quoted CEL expression containing a comma
            value: '"coalesce(managedBy.label, label)",-id'
          csvQuotedAndUrlEncoded:
            summary: URL-encoded form of csvQuotedExpression (literal `,` and `"` percent-encoded; outer CSV delimiter encoded too)
            value: '%22coalesce%28managedBy.label%2C%20label%29%22%2C-id'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/ExpandParam'
      - in: query
        name: query
        schema:
          type: string
          maxLength: 2000
        required: false
        description: 'Free-text search query. When set, returns datasets ranked by relevance to the query, with the most relevant results first. `orderBy` is ignored — results are always ordered by relevance descending.

          May be combined with `filter` to narrow results after ranking, and with `limit`/`offset` for pagination. When `filter` is also set, the response may contain fewer than `limit` items if many ranked candidates are filtered out.

          `meta.totalCount` is always `-1` for semantic-search requests. Returns 404 if semantic search is not available in this deployment.

          '
        examples:
          searchByIntent:
            summary: Find datasets related to customer purchase events
            value: customer purchase orders
      - in: query
        name: minScore
        schema:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.3
        required: false
        description: 'Minimum cosine similarity score (0.0–1.0) for semantic search results. Datasets scoring below this threshold are excluded. Only applies when `query` is set. Defaults to 0.3.

          '
      responses:
        '200':
          description: Datasets queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/dataset:
    get:
      summary: List datasets (legacy)
      operationId: listDatasets
      tags:
      - Dataset Legacy
      description: 'List datasets, optionally matching:


        * Name substring

        * Workspace ID

        * Dataset type

        * Interface binding

        '
      parameters:
      - name: workspaceId
        description: Only include datasets in this workspace.
        in: query
        schema:
          type: integer
        required: false
        examples:
          A workspace ID:
            value: '41000011'
      - name: match
        in: query
        description: Alphanumeric fuzzy match the name of the dataset.
        schema:
          type: string
        required: false
        examples:
          A name substring:
            value: logs
      - name: name
        in: query
        description: exact name of the dataset to match
        schema:
          type: string
        required: false
        examples:
          A dataset name`:
            value: kubernetes/Container Logs
      - name: type
        in: query
        description: Only include datasets of this type.
        schema:
          type: string
        required: false
        examples:
