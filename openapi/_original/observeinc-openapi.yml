        schemaVersion:
          type: integer
          enum:
          - 2
          description: Dashboard document schema version. Always `2` on the wire.
        name:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedAt:
          $ref: '#/components/schemas/Time'
        createdBy:
          $ref: '#/components/schemas/User'
        updatedBy:
          $ref: '#/components/schemas/User'
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
          description: 'The app or other object that manages this dashboard, or `null` when

            it is not managed. Returned only — it cannot be set through this

            API.

            '
        visibility:
          type: string
          enum:
          - Listed
          - Hidden
        objectTags:
          $ref: '#/components/schemas/ObjectTags'
        definition:
          $ref: '#/components/schemas/DashboardContent'
    DatasetQueryFilter-Resource:
      title: DatasetQueryFilter
      type: object
      required:
      - id
      - label
      - filter
      - pipeline
      - disabled
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. When creating or updating a filter, clients must provide exactly one of `filter` or `pipeline`.

            API responses always include both `filter` and `pipeline`; clients should consume `pipeline`.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            When creating or updating a filter, clients must provide exactly one of `filter` or `pipeline`.

            API responses always include both `filter` and `pipeline`; clients should consume `pipeline`.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
        errors:
          type: array
          items:
            type: string
          description: List of error messages if the filter has issues (omitted if no errors)
        createdBy:
          $ref: '#/components/schemas/User'
          description: User who created the filter
        createdAt:
          type: string
          format: date-time
          description: When the filter was created
        updatedBy:
          $ref: '#/components/schemas/User'
          description: User who last updated the filter
        updatedAt:
          type: string
          format: date-time
          description: When the filter was last updated
        startTime:
          type: string
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type: string
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type: string
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
    DatasetQueryFilter-CreateRequest:
      title: DatasetQueryFilterCreateRequest
      type: object
      required:
      - label
      properties:
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. Exactly one of `filter` or `pipeline` must be provided when creating a filter.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            Exactly one of `filter` or `pipeline` must be provided when creating a filter. `pipeline` is preferred for new integrations, as `filter` may be removed in a future API version.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
          default: false
        startTime:
          type: string
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type: string
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type: string
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
    DatasetContentType:
      title: DatasetContentType
      type: string
      description: 'The type of data a dataset contains. For Resource datasets, this is

        determined by the dataset kind. For other kinds, it is derived from the

        dataset''s interface bindings. Returns Unknown if no recognized interface

        is found.

        '
      enum:
      - Unknown
      - Resource
      - Log
      - Metric
      - OTelSpan
      - OTelTrace
    DatasetBrief:
      title: DatasetBrief
      type: object
      description: 'Brief record fields for a DatasetRef (label, description, iconUrl, contentType). Field naming mirrors ObjectBrief in this same file (iconUrl, not icon) for consistency across reference-brief pairs.

        '
      required:
      - label
      - description
      - iconUrl
      - contentType
      properties:
        label:
          type: string
        description:
          type: string
        iconUrl:
          type: string
        contentType:
          $ref: '#/components/schemas/DatasetContentType'
          description: 'The type of data the referenced dataset contains — Resource, Log,

            Metric, OTelSpan, OTelTrace, or Unknown. Derived from the dataset''s

            kind and interface bindings.

            '
    DatasetRef:
      title: DatasetRef
      type: object
      description: 'A reference to a dataset. Always carries the id; the optional `record` field carries the brief metadata, populated when expand=true. Mirrors ObjectRef (see ObjectRef / ObjectBrief in this file).

        '
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        record:
          $ref: '#/components/schemas/DatasetBrief'
    IngestFilters-Resource:
      title: IngestFiltersObject
      type: object
      description: A drop filter resource.
      required:
      - id
      - label
      - description
      - iconUrl
      - sourceDataset
      - pipeline
      - layout
      - dropRate
      - enabled
      - managedBy
      - createdAt
      - createdBy
      - updatedAt
      - updatedBy
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
          description: Unique, immutable identifier of the filter.
        label:
          type: string
          description: Mutable display name of the filter.
        description:
          type:
          - string
          - 'null'
          description: Optional human-readable description.
        iconUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Optional icon shown alongside the filter in the UI.
        sourceDataset:
          $ref: '#/components/schemas/DatasetRef'
          description: The source dataset this filter applies to. Cannot be changed after creation.
        pipeline:
          type: string
          description: OPAL pipeline expression defining the filter predicate. Observations matching the pipeline are candidates for dropping, subject to `dropRate`.
        layout:
          type:
          - object
          - 'null'
          description: Reserved for UI state. Stored and returned verbatim, never interpreted by Observe. Safe to omit.
        dropRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction (0.0-1.0) of matching observations to drop. 1.0 = drop all matches; 0.0 = drop none.
        enabled:
          type: boolean
          description: Whether the filter is actively dropping observations. Disabled filters are retained but have no effect on ingest.
        managedBy:
          readOnly: true
          description: Identifies the owner/manager of this filter. Managed filters cannot be modified through the API.
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        createdBy:
          $ref: '#/components/schemas/User'
          readOnly: true
          description: User who created the filter.
        createdAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
          description: When the filter was created.
        updatedBy:
          $ref: '#/components/schemas/User'
          readOnly: true
          description: User who most recently updated the filter.
        updatedAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
          description: When the filter was last updated.
    IngestFilters-CreateRequest:
      title: IngestFiltersCreateRequest
      type: object
      description: Fields for a new drop filter.
      required:
      - label
      - sourceDataset
      - pipeline
      properties:
        label:
          type: string
          description: Display name of the filter.
        description:
          type: string
          description: Optional human-readable description.
        iconUrl:
          type: string
          format: uri
          description: Optional icon shown alongside the filter in the UI.
        sourceDataset:
          $ref: '#/components/schemas/DatasetRef'
          description: Source dataset reference. Only the `id` is consumed; any `record` payload is ignored. Cannot be changed after creation.
        pipeline:
          type: string
          description: OPAL pipeline expression defining the filter predicate. Observations matching the pipeline are candidates for dropping, subject to `dropRate`.
        layout:
          type: object
          description: Reserved for UI state. Stored and returned verbatim, never interpreted by Observe. Safe to omit.
        dropRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Fraction (0.0-1.0) of matching observations to drop. 1.0 = drop all matches; 0.0 = drop none. Default 1.0 when omitted.
        enabled:
          type: boolean
          description: Whether the filter starts actively dropping observations. Default true when omitted.
      example:
        label: drop-debug-logs
        description: Discard debug-level application logs.
        sourceDataset:
          id: '41030001'
        pipeline: filter severity = "DEBUG"
        dropRate: 1
        enabled: true
    IngestRoutes-Type:
      title: IngestRoutesType
      type: string
      description: The observation type a route applies to. Each type corresponds to a source dataset schema and to the ingest endpoints that emit compatible data. `any` is the generic schema with `FIELDS` and `EXTRA` columns; the rest are direct-write source datasets. See the `type` path parameter for the endpoint mappings.
      enum:
      - otellogs
      - otelmetrics
      - oteltraces
      - prometheus
      - k8sentity
      - any
    NullableObjectId:
      type:
      - string
      - 'null'
      format: ObjectId
    IngestRoutes-Resource:
      title: IngestRoutesObject
      type: object
      description: An ingest route resource. This is one rule defining a route for observations of a certain type.
      required:
      - id
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - type
      - pipeline
      - layout
      - destinationId
      - secondaryDestinationId
      - enabled
      - managedBy
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
          description: Unique identifier for this ingest route.
        createdBy:
          $ref: '#/components/schemas/User'
          readOnly: true
          description: User who created this route. Always returned as an ID-only object; pass expand=true to populate `record`.
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Time at which this route was created.
        updatedBy:
          $ref: '#/components/schemas/User'
          readOnly: true
          description: User who last updated this route. Always returned as an ID-only object; pass expand=true to populate `record`.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Time at which this route was last updated.
        type:
          $ref: '#/components/schemas/IngestRoutes-Type'
          readOnly: true
          description: The observation type this route applies to. Set at creation and cannot be changed.
        pipeline:
          type: string
          readOnly: true
          description: 'OPAL expression acting as the match predicate for this route. An observation is routed here when the expression evaluates true. Compiled against the schema of the destination source dataset.


            An empty string identifies the type''s default route, which matches every observation not matched by a higher-priority route. See the `pipeline` field on the create request for the restrictions that apply per type.'
        layout:
          type: object
          readOnly: true
          description: Opaque JSON blob round-tripped to the frontend; not interpreted by the server.
        destinationId:
          $ref: '#/components/schemas/ObjectId'
          readOnly: true
          description: Primary destination dataset ID. Observations matching this route are written here.
        secondaryDestinationId:
          $ref: '#/components/schemas/NullableObjectId'
          readOnly: true
          description: Secondary destination dataset ID. When set, observations matching this route are duplicated to both the primary and secondary destination datasets.
        enabled:
          type: boolean
          readOnly: true
          description: Whether this route is evaluated against incoming data. A disabled route is skipped entirely, as though it did not exist. New routes are created disabled; see the create request for details.
        managedBy:
          readOnly: true
          description: Identifies the owner/manager of this route. Managed routes cannot be created, modified, or deleted through the API. Always returned as an ID-only object; pass expand=true to populate `record` (label, description, iconUrl).
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
    IngestRoutes-CreateRequest:
      title: IngestRoutesCreateRequest
      type: object
      description: 'A new route is created **disabled**, and is ignored by the ingest pipeline until you enable it with a PATCH. The one exception is the default route, which is always enabled.


        A new route is assigned the lowest priority among non-default routes, so it is evaluated last. Use `PATCH /v1/ingest/routes/{type}` to reorder.


        Creating the first route for a type also creates that type''s default route automatically, so that no observation is left unrouted.'
      required:
      - pipeline
      - destinationId
      properties:
        pipeline:
          type: string
          description: 'OPAL expression acting as the match predicate for this route, compiled against the destination dataset''s schema. A compile error is rejected with a 400.


            Pass an empty string to create the type''s default route, the catch-all evaluated after every other route. Once a default route exists, an empty pipeline is rejected with a 400.


            Two restrictions apply per type:


            - `oteltraces` supports only the default route. A non-empty pipeline is rejected with a 400.

            - Some types restrict which columns the expression may reference: `prometheus`, `k8sentity`, and `oteltraces` allow only `meta`; `otelmetrics` allows `meta` and `metric`. `otellogs` and `any` are unrestricted. Referencing any other column is rejected with a 400.


            Unlike a drop filter, a route predicate that fails at evaluation time fails the whole bundle rather than failing open. Expressions are therefore rejected at creation if they reference columns that cannot be resolved.'
        layout:
          type: object
          description: Opaque JSON blob round-tripped to the frontend; not interpreted by the server.
        destinationId:
          $ref: '#/components/schemas/ObjectId'
          description: Primary destination dataset ID. Must be a source dataset whose type matches the `type` path parameter.
        secondaryDestinationId:
          $ref: '#/components/schemas/ObjectId'
          description: Optional secondary destination dataset ID, subject to the same type check as `destinationId`. When set, matching observations are written to both destinations. Omit to leave unset; use PATCH with an explicit `null` to clear it later.
    IngestToken-StatsError:
