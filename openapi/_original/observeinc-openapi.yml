        stats:
          $ref: '#/components/schemas/IngestToken-Stats'
          description: Ingest health metrics. Populated only when `?expand=true`, and only on GET /v1/ingest/tokens/{id} and the list endpoint (never returned by create or update). A token that has not yet ingested any data has no metrics to report, so the field is omitted until the token is first used.
    IngestToken-CreateRequest:
      title: IngestTokenCreateRequest
      type: object
      properties:
        name:
          type: string
          maxLength: 127
          description: Optional. Auto-generated from a timestamp if omitted. Must be unique per customer; max 127 bytes.
        description:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Optional. Max 255 bytes. `null` is stored as an empty string.
    IngestToken-CreateResponse:
      title: IngestTokenCreateResponse
      description: The newly created ingest token. Same shape as IngestToken-Resource, but the one-time `secret` is always present here — it is returned only in this response and can never be read back.
      allOf:
      - $ref: '#/components/schemas/IngestToken-Resource'
      - type: object
        required:
        - secret
        properties:
          secret:
            type: string
            description: Token secret. Returned exactly once, on create; never readable again.
    InputDefinition:
      type: object
      required:
      - inputName
      properties:
        inputName:
          description: The @name used to reference this input in OPAL (without the @ sign)
          type: string
        inputRole:
          description: Data or Reference, defaults to Data if not specified.
          type: string
        datasetId:
          description: The dataset ID (as int64-string) to bind to this name.
          type: string
          format: int64
        datasetPath:
          description: The dataset name as Workspace.path/Name to bind to this name. datasetId takes precedence if both are set; on read, this is populated alongside datasetId as a portable reference.
          type: string
        stageId:
          description: The stageID of the previously defined stage to reference, if it's a stage and not a dataset.
          type: string
        parameterId:
          description: The parameter ID to take the input dataset reference from. (Advanced usage only)
          type: string
    MonitorV2Health:
      type: string
      description: 'The monitor''s operating state as one value, computed from its last

        evaluation and from its cluster''s failover role. Resolved by priority,

        highest first:


        | Value | Meaning |

        |---|---|

        | `Disabled` | Turned off, whether by a user or by a spend or alert-rate limit. |

        | `ClusterPassive` | Its customer''s monitoring is not active on this cluster, so nothing evaluates. Set for every monitor of that customer at once. |

        | `Failed` | The monitor logged an error since its last run, less than a week ago. |

        | `Warnings` | The monitor logged a warning in that same window. |

        | `Initializing` | An anomaly monitor has not yet produced its output dataset, so it cannot evaluate. |

        | `Running` | Nothing above applies. |


        A monitor can satisfy several; the API reports only the highest, and the

        ranking may change.


        A monitor that a limit turned off reports plain `Disabled` here. The

        monitors list API separates those causes into `CostDisabled`,

        `AlertRateLimitDisabled` and `AtRisk` in its own `MonitorHealth` enum;

        this one omits them.

        '
      enum:
      - ClusterPassive
      - Disabled
      - Failed
      - Initializing
      - Running
      - Warnings
    MonitorV2RuleKind:
      type: string
      enum:
      - Anomaly
      - Count
      - Promote
      - Threshold
    StageQuery:
      type: object
      required:
      - input
      - pipeline
      properties:
        id:
          type: string
        input:
          $ref: '#/components/schemas/InputDefinition'
        pipeline:
          type: string
    MultiStageQuery:
      type: object
      required:
      - outputStage
      - stages
      properties:
        outputStage:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageQuery'
    MonitorV2AlarmLevel:
      type: string
      enum:
      - Critical
      - Error
      - Informational
      - None
      - Warning
    MonitorV2ComparisonFunction:
      type: string
      enum:
      - Contains
      - Equal
      - Greater
      - GreaterOrEqual
      - Less
      - LessOrEqual
      - NotContains
      - NotEqual
      - NotStartsWith
      - StartsWith
    PrimitiveValue:
      properties:
        bool:
          type: boolean
        float64:
          type: number
          format: double
        int64:
          type: string
          format: int64
        string:
          type: string
        timestamp:
          $ref: '#/components/schemas/TimeNano'
        duration:
          $ref: '#/components/schemas/DurationNanoseconds'
        array:
          type: array
          items:
            $ref: '#/components/schemas/PrimitiveValue'
        link:
          type: object
          properties:
            datasetId:
              $ref: '#/components/schemas/ObjectId'
            primaryKeyValue:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
            storedLabel:
              type: string
        datasetref:
          type: object
          properties:
            datasetId:
              $ref: '#/components/schemas/ObjectId'
            datasetPath:
              type: string
            stageId:
              type: string
    MonitorV2Comparison:
      properties:
        compareFn:
          $ref: '#/components/schemas/MonitorV2ComparisonFunction'
        compareValue:
          $ref: '#/components/schemas/PrimitiveValue'
    MonitorV2ColumnPath:
      properties:
        name:
          type: string
        path:
          type: string
    MonitorV2LinkColumn:
      properties:
        name:
          type: string
        meta:
          type: object
          properties:
            srcFields:
              type: array
              items:
                $ref: '#/components/schemas/MonitorV2ColumnPath'
            dstFields:
              type: array
              items:
                type: string
            targetDataset:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
    MonitorV2CorrelationTag:
      type: object
      description: 'Marker on a `MonitorV2Column` indicating that the column is grouping by a

        correlation tag (e.g. `service.name`) rather than a specific physical

        column. The per-column struct carries the tag name and optional resolution

        `meta`; the authoritative `(tag, backing-column)` mapping for every

        correlation tag in the schema lives on `MonitorV2AlertSchema.correlationTags`.

        '
      properties:
        tag:
          type: string
          description: 'Correlation tag name, without the leading `#`. The save-time resolver

            expands this into the canonical primary backing column picked by the

            OPAL coalesce ordering and records the `(tag, column)` pair on

            `MonitorV2AlertSchema.correlationTags`; this column itself carries

            only the tag identifier.

            '
        meta:
          type: object
          description: 'Optional resolution context surfaced for frontend preview/display: the

            physical backing columns the tag resolves to.

            '
          properties:
            srcFields:
              type: array
              items:
                $ref: '#/components/schemas/MonitorV2ColumnPath'
    MonitorV2Column:
      description: 'Identifies a column in a monitor''s input pipeline. At most one of

        `linkColumn`, `columnPath`, and `correlationTag` may be set; the

        save-time validator rejects violations of this one-of contract.

        '
      properties:
        linkColumn:
          $ref: '#/components/schemas/MonitorV2LinkColumn'
        columnPath:
          $ref: '#/components/schemas/MonitorV2ColumnPath'
        correlationTag:
          $ref: '#/components/schemas/MonitorV2CorrelationTag'
    MonitorV2ColumnComparison:
      properties:
        compareValues:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2Comparison'
        column:
          $ref: '#/components/schemas/MonitorV2Column'
    MonitorV2CountRule:
      type: object
      required:
      - compareValues
      properties:
        compareValues:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2Comparison'
        compareGroups:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ColumnComparison'
    MonitorV2ValueAggregation:
      type: string
      enum:
      - AllOf
      - AnyOf
      - AvgOf
      - SumOf
    MonitorV2ThresholdRule:
      type: object
      required:
      - compareValues
      - valueColumnName
      - aggregation
      properties:
        compareValues:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2Comparison'
        valueColumnName:
          type: string
        aggregation:
          $ref: '#/components/schemas/MonitorV2ValueAggregation'
        compareGroups:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ColumnComparison'
    MonitorV2PromoteRule:
      type: object
      properties:
        compareColumns:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ColumnComparison'
    MonitorV2Rule:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/MonitorV2AlarmLevel'
        count:
          $ref: '#/components/schemas/MonitorV2CountRule'
        threshold:
          $ref: '#/components/schemas/MonitorV2ThresholdRule'
        promote:
          $ref: '#/components/schemas/MonitorV2PromoteRule'
    MonitorV2TransformSchedule:
      type: object
      properties:
        freshnessGoal:
          $ref: '#/components/schemas/DurationNanoseconds'
    MonitorV2CronSchedule:
      type: object
      required:
      - timezone
      properties:
        cronConfig:
          type: string
          description: Crontab configuration for wall-clock scheduled evaluation.
        timezone:
          type: string
          description: IANA timezone for interpreting cronConfig on the wall clock.
        alarmMode:
          type: string
          enum:
          - PerRun
          - Ongoing
          description: 'Controls how alarms are emitted across consecutive monitor evaluations. PerRun (the default when omitted) emits an independent zero-duration alarm per firing evaluation. Ongoing causes consecutive evaluations that re-assert the same (group, level) to extend a single ongoing alarm. Setting the value to Ongoing is gated by a customer feature flag.

            '
    MonitorV2Scheduling:
      type: object
      description: 'Scheduling modes are mutually exclusive. Omit both transform and scheduled for service-chosen defaults. Set transform for continuous transform-driven evaluation, or scheduled for cron-based wall-clock evaluation.

        '
      properties:
        transform:
          $ref: '#/components/schemas/MonitorV2TransformSchedule'
        scheduled:
          $ref: '#/components/schemas/MonitorV2CronSchedule'
    MonitorV2NoDataRule:
      type: object
      properties:
        expiration:
          $ref: '#/components/schemas/DurationNanoseconds'
          description: 'How long the no-data alarm persists before auto-resolving. Omit for the backend default (~24 hours).

            '
        threshold:
          $ref: '#/components/schemas/MonitorV2ThresholdRule'
          description: 'Threshold configuration. valueColumnName and aggregation must match the monitor''s regular rules. compareValues must be empty.

            '
    MonitorV2Definition:
      type: object
      required:
      - inputQuery
      - rules
      properties:
        inputQuery:
          $ref: '#/components/schemas/MultiStageQuery'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2Rule'
        lookbackTime:
          $ref: '#/components/schemas/DurationNanoseconds'
        dataStabilizationDelay:
          $ref: '#/components/schemas/DurationNanoseconds'
        maxAlertsPerHour:
          type: integer
        groupings:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2Column'
        scheduling:
          description: 'User-specified scheduling preference. When read back via GET, this reflects only what the user explicitly set, not the scheduling mode the backend is actually using. Null or omitted means the system chooses the best mode automatically. To see the resolved scheduling mode, use the top-level effectiveScheduling field instead.

            '
          nullable: true
          $ref: '#/components/schemas/MonitorV2Scheduling'
        noDataRules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2NoDataRule'
          description: 'No-data rules that fire at NoData severity when no data arrives for the full lookback window. At most one entry for threshold monitors.

            '
    MonitorV2BooleanOperator:
      type: string
      enum:
      - And
      - Or
    MonitorV2ComparisonExpression:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/MonitorV2BooleanOperator'
        subExpressions:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ComparisonExpression'
        compareTerms:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ComparisonTerm'
    MonitorV2ComparisonTerm:
      type: object
      required:
      - comparison
      - column
      properties:
        comparison:
          $ref: '#/components/schemas/MonitorV2Comparison'
        column:
          $ref: '#/components/schemas/MonitorV2Column'
    MonitorV2ActionType:
      type: string
      enum:
      - Email
      - PagerDuty
      - Slack
      - Webhook
    MonitorV2EmailAction:
      type: object
      required:
      - subject
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        addresses:
          type: array
          items:
            type: string
        subject:
          type: string
        body:
          type: string
        fragments:
          type: object
    MonitorV2HttpType:
      type: string
      description: 'The http type describes the method or verb to use in http webhooks.

        note: As a convenience, the values POST and PUT will be accepted, but converted

        to the enumeration values Post and Put respectively.

        '
      enum:
      - Post
      - Put
    MonitorV2WebhookHeader:
      type: object
      required:
      - header
      - value
      properties:
        header:
          type: string
        value:
          type: string
    MonitorV2WebhookAction:
      type: object
      required:
      - url
      - method
      - body
      properties:
        url:
          type: string
        method:
          $ref: '#/components/schemas/MonitorV2HttpType'
        headers:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2WebhookHeader'
        body:
          type: string
        fragments:
          type: object
    MonitorV2ActionDefinition:
      type: object
      description: 'The configuration of an action. `type` selects which payload applies:

        `Email` uses `email`, while `Webhook`, `Slack` and `PagerDuty` all use

        `webhook`. A PagerDuty action is a webhook posted to the PagerDuty

        Events API, so its routing key is a field of the JSON template in

        `webhook.body` rather than a property of its own.

        '
      required:
      - type
      properties:
        inline:
          type: boolean
          description: 'True when the action is private to its monitor, false when it is a

            shared action bound by `actionId`. Only an inline action''s

            definition is written by a monitor create or update.

            '
        name:
          type: string
          description: 'Names a shared action. An inline action is named internally: reads

            do not return one and any value sent is replaced, so it may be

            omitted for inline actions.

            '
        type:
          $ref: '#/components/schemas/MonitorV2ActionType'
        email:
          $ref: '#/components/schemas/MonitorV2EmailAction'
        webhook:
          $ref: '#/components/schemas/MonitorV2WebhookAction'
    MonitorV2ActionRule:
      type: object
      description: 'Either the actionId or the definition must be present when setting.

        The actionId references an existing shared action, while the

        definition would be used to configure an inline (private to a monitor)

        action. A read returns both: the actionId of the bound action and, for

        an inline action, the definition that can be edited and sent back.

        '
      properties:
        actionId:
          $ref: '#/components/schemas/ObjectId'
        levels:
          $ref: '#/components/schemas/MonitorV2AlarmLevel'
        conditions:
          $ref: '#/components/schemas/MonitorV2ComparisonExpression'
        sendEndNotifications:
          type: boolean
        sendRemindersInterval:
          type: boolean
        definition:
          $ref: '#/components/schemas/MonitorV2ActionDefinition'
    MonitorV2:
      type: object
      required:
      - id
      - name
      - definition
      - ruleKind
      properties:
        id:
          readOnly: true
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        disabled:
          readOnly: true
          type: boolean
        health:
          readOnly: true
          $ref: '#/components/schemas/MonitorV2Health'
        ruleKind:
          $ref: '#/components/schemas/MonitorV2RuleKind'
        definition:
          $ref: '#/components/schemas/MonitorV2Definition'
        actionRules:
          type: array
          items:
            $ref: '#/components/schemas/MonitorV2ActionRule'
        effectiveScheduling:
          readOnly: true
          description: 'The resolved scheduling mode the monitor is actually using, as determined by the backend. Always populated on GET responses. This may differ from definition.scheduling, which only reflects what the user explicitly configured. Ignored on POST/PATCH.

            '
          $ref: '#/components/schemas/MonitorV2Scheduling'
    NullableTime:
      type:
      - string
      - 'null'
      format: RFC3339
    Monitor-Brief:
      title: MonitorBrief
      type: object
      description: Brief monitor metadata included when a reference is expanded.
      required:
      - name
      - label
      - description
      properties:
        name:
          type: string
          description: 'Name of the monitor, unique within its workspace.

            '
        label:
          type: string
          deprecated: true
          description: Same as `name`. Deprecated; read `name` instead.
        description:
          type:
          - string
          - 'null'
          description: The monitor's description. Null when no description is configured.
    Monitor-Ref:
      title: MonitorRef
      type: object
      description: 'Reference to a monitor. Always carries the `id`. The `record` field is

        populated with brief metadata only when `expand=true`.

        '
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        record:
          $ref: '#/components/schemas/Monitor-Brief'
    MonitorMute-TargetKind:
      title: MonitorMuteTargetKind
      type: string
      description: '`Global` suppresses all monitors (requires a non-empty `filter`). `Monitors` targets a specific set of monitors by ID.

        '
      enum:
      - Global
      - Monitors
    MonitorMute-Target:
      title: MonitorMuteTarget
      description: 'Describes which monitors this mute rule applies to. `monitors` is always present: empty when `kind` is `Global`, non-empty when `kind` is `Monitors`.

        '
      type: object
      required:
      - kind
      - monitors
      properties:
        kind:
          $ref: '#/components/schemas/MonitorMute-TargetKind'
        monitors:
          type: array
          items:
            $ref: '#/components/schemas/Monitor-Ref'
    MonitorMute-ScheduleKind:
      title: MonitorMuteScheduleKind
      type: string
      description: '`OneTime` defines a fixed window with an explicit start and optional end. `Recurring` fires on a cron schedule for a specified duration.

        '
      enum:
      - OneTime
      - Recurring
    MonitorMute-OneTime:
      title: MonitorMuteOneTime
      description: A one-time mute window. Always fully populated in responses.
      type: object
      required:
      - startTime
      - endTime
      properties:
        startTime:
          $ref: '#/components/schemas/Time'
          description: Start of the mute window.
        endTime:
          $ref: '#/components/schemas/NullableTime'
          description: End of the mute window. `null` means until manually deleted.
    MonitorMute-CronSchedule:
      title: MonitorMuteCronSchedule
      type: object
      required:
      - rawCron
      - timezone
      properties:
        rawCron:
          type: string
          description: 'POSIX 5-field cron expression (`minute hour day-of-month month day-of-week`). No seconds field, no year field, no Quartz extensions, no `@daily`-style macros. Fields support `*` (any), `,` (list), `-` (range), and `/` (step). The server rejects expressions outside this dialect with `invalid_schedule`. Examples: `0 2 * * *` (daily at 02:00), `0 9-17 * * 1-5` (every hour 09:00–17:00 Mon–Fri), `0-59/15 * * * *` (every 15 min).

            '
        timezone:
          type: string
          description: 'IANA timezone name. Example: "America/Los_Angeles".'
    MonitorMute-Recurring:
      title: MonitorMuteRecurring
      description: A recurring mute window driven by a cron schedule.
      type: object
      required:
      - cronSchedule
      - durationSeconds
      properties:
        cronSchedule:
          $ref: '#/components/schemas/MonitorMute-CronSchedule'
        durationSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Wall-clock length of each fired window in seconds. Must be at least 1.
    MonitorMute-Schedule:
      title: MonitorMuteSchedule
      description: 'Discriminated schedule. Both `oneTime` and `recurring` are always present in responses; the inactive sibling is `null`.

        '
      type: object
      required:
      - kind
      - oneTime
      - recurring
      properties:
        kind:
          $ref: '#/components/schemas/MonitorMute-ScheduleKind'
        oneTime:
          description: Populated when `kind` is `OneTime`; `null` otherwise.
          oneOf:
          - $ref: '#/components/schemas/MonitorMute-OneTime'
          - type: 'null'
        recurring:
          description: Populated when `kind` is `Recurring`; `null` otherwise.
          oneOf:
          - $ref: '#/components/schemas/MonitorMute-Recurring'
          - type: 'null'
    MonitorMute-Resource:
      title: MonitorMuteResource
      description: 'A mute rule suppresses alert notifications during a defined time window. Use `target.kind: Global` to mute all monitors, or `target.kind: Monitors` to target a specific set.

        '
      type: object
      required:
      - id
      - label
      - description
      - target
      - schedule
      - filter
      - startTime
      - endTime
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
          description: Human-readable name for this mute rule.
        description:
          type:
          - string
          - 'null'
          description: Free-form description. `null` when unset.
        target:
          $ref: '#/components/schemas/MonitorMute-Target'
        schedule:
          $ref: '#/components/schemas/MonitorMute-Schedule'
        filter:
          type:
          - string
          - 'null'
          description: 'Optional CEL boolean expression evaluated against each fired alarm row at notification time. `null` means every firing is suppressed. Required and non-empty when `target.kind` is `Global` to prevent accidental fleet-wide suppression. Example: `level == "Critical" && context["service"] == "payments"`.

            '
        startTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'Computed start of the current or next active window. For `OneTime` schedules this mirrors `schedule.oneTime.startTime`. For `Recurring` schedules this is the next computed firing time. `null` between recurring windows.

            '
        endTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'Computed end of the current or next active window. For `OneTime` schedules this mirrors `schedule.oneTime.endTime` (`null` for open-ended mutes). For `Recurring` schedules this is `startTime + durationSeconds`.

            '
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Time'
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          $ref: '#/components/schemas/Time'
    MonitorMute-TargetInput:
      title: MonitorMuteTargetInput
      description: 'Input shape for a mute target. `kind` is optional in PATCH — if provided it must match the existing value since `kind` is immutable after creation. `monitors` is required and non-empty when `kind` is `Monitors`; omit or leave empty when `kind` is `Global`.

        '
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MonitorMute-TargetKind'
        monitors:
          type: array
          items:
            $ref: '#/components/schemas/Monitor-Ref'
    MonitorMute-OneTimeInput:
      title: MonitorMuteOneTimeInput
      description: 'Input shape for a one-time schedule. `startTime` is required. Omit `endTime` or pass `null` to create an open-ended mute.

        '
      type: object
      required:
      - startTime
      properties:
        startTime:
          $ref: '#/components/schemas/Time'
          description: Start of the mute window.
        endTime:
          $ref: '#/components/schemas/NullableTime'
          description: End of the mute window. Omit or pass `null` for open-ended.
    MonitorMute-RecurringInput:
      title: MonitorMuteRecurringInput
      description: 'Input shape for a recurring schedule. Mirrors `MonitorMute-Recurring`; kept separate so server-computed response fields can be added to the response type without widening the write contract.

        '
      type: object
      required:
      - cronSchedule
      - durationSeconds
      properties:
        cronSchedule:
          $ref: '#/components/schemas/MonitorMute-CronSchedule'
        durationSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Wall-clock length of each fired window in seconds. Must be at least 1.
    MonitorMute-ScheduleInput:
      title: MonitorMuteScheduleInput
      description: 'Input shape for a schedule. `kind` is required; send only the sibling matching `kind` (`oneTime` or `recurring`).

        '
      type: object
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/MonitorMute-ScheduleKind'
        oneTime:
          $ref: '#/components/schemas/MonitorMute-OneTimeInput'
        recurring:
          $ref: '#/components/schemas/MonitorMute-RecurringInput'
    MonitorMute-CreateRequest:
      title: MonitorMuteCreateRequest
      type: object
      required:
      - label
      - target
      - schedule
      properties:
        label:
          type: string
        description:
          type: string
          description: Free-form description. Omit to leave blank.
        target:
          $ref: '#/components/schemas/MonitorMute-TargetInput'
        schedule:
          $ref: '#/components/schemas/MonitorMute-ScheduleInput'
        filter:
          type: string
          description: 'CEL boolean expression evaluated against each fired alarm row. Required and non-empty when `target.kind` is `Global` (prevents accidental fleet-wide suppression). When `target.kind` is `Monitors`, omit to suppress all firings for those monitors unconditionally. Example: `level == "Critical" && context["service"] == "payments"`.

            '
    MonitorV2MuteScheduleType:
      type: string
      enum:
      - OneTime
    MonitorV2OneTimeMuteSchedule:
      type: object
      required:
      - startTime
      properties:
        startTime:
          $ref: '#/components/schemas/Time'
        endTime:
          $ref: '#/components/schemas/Time'
    MonitorV2MuteRuleSchedule:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/MonitorV2MuteScheduleType'
        oneTime:
          $ref: '#/components/schemas/MonitorV2OneTimeMuteSchedule'
    MonitorV2MuteRule:
      type: object
      required:
      - id
      - name
      - schedule
      - validFrom
      properties:
        schedule:
          $ref: '#/components/schemas/MonitorV2MuteRuleSchedule'
        criteria:
          $ref: '#/components/schemas/MonitorV2ComparisonExpression'
        validFrom:
          readOnly: true
          $ref: '#/components/schemas/Time'
        validTo:
          readOnly: true
          $ref: '#/components/schemas/Time'
        monitorID:
          $ref: '#/components/schemas/ObjectId'
        monitor:
          type: object
          readOnly: true
          properties:
            id:
              $ref: '#/components/schemas/ObjectId'
            name:
              type: string
        id:
          readOnly: true
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        isGlobal:
          type: boolean
          readOnly: true
        isConditional:
          type: boolean
          readOnly: true
    ReferenceTables-Field:
      title: ReferenceTableField
      type: object
      properties:
        name:
          type: string
          description: The name of the field
        type:
          type: string
          description: The type of the field (e.g., string, float64, array)
      required:
      - name
      - type
    ReferenceTables-Table:
      title: ReferenceTable
      type: object
      properties:
        id:
          type: string
          format: int64
        label:
          type: string
        description:
          type: string
        iconUrl:
          type: string
        managedById:
          type: string
          format: int64
        customerId:
          type: string
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/User'
        datasetId:
          type: string
          format: int64
        checksum:
          type: string
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceTables-Field'
          description: The schema definition of the reference table
        primaryKey:
          type: array
          items:
            type: string
          description: The primary key columns of the reference table
        labelField:
          type: string
          description: The field that should be used for the OPAL label
    ReferenceTables-TableMetadata:
      title: ReferenceTableMetadata
      type: object
      properties:
        label:
          type: string
          description: The label of the reference table.
        description:
          type: string
          default: ''
          description: The description of the reference table.
        primaryKey:
          type: array
          items:
            type: string
          description: The primary key of the reference table.
        labelField:
          type: string
          description: The field that should be used for the OPAL label.
      required:
      - label
    RbacGroupRef:
      title: RbacGroupRef
      description: Reference to an RBAC group, including id, label, and description.
      type: object
      required:
      - id
      - legacyId
      - label
      - description
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        legacyId:
          type: string
          description: Deprecated. For compatibility with legacy APIs.
          deprecated: true
        label:
          type: string
        description:
          type: string
    OAuthExternalIntegrationRef:
      title: OAuthExternalIntegrationRef
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
    ServiceAccount-ExternalOAuth:
      title: ServiceAccountExternalOAuth
      type: object
      required:
      - integration
      - subject
      properties:
        integration:
          $ref: '#/components/schemas/OAuthExternalIntegrationRef'
        subject:
          type: string
