      - updatedBy
      - updatedAt
      properties:
        id:
          type: string
          description: Client-generated message id scoped to the chat.
        index:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of the message within the chat. Output only.
          readOnly: true
        chatRevision:
          type: integer
          format: int64
          minimum: 0
