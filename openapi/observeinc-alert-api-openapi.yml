  description: 'Operations tagged Alert across 2 of this provider''s published API definitions: observeinc-openapi-assembled.json, observeinc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
security:
- bearerAuth: []
tags:
- name: Alert
  description: Query monitor alerts. Learn more about alerts.
paths:
  /v1/alerts/{id}:
    get:
      summary: Get an alert by id
      description: 'Get a single alert by its unique id. Unlike the list endpoint, this lookup

        is not time-windowed: it returns the alert regardless of how long ago it

        fired. Returns 404 if no alert with the given id exists in the workspace

        or if the caller lacks view permission on the alert''s monitor.'
      operationId: GetAlert
      tags:
      - Alert
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: Unique identifier of the alert.
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Alert found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
  /v1/alerts:
    get:
      summary: List alerts
      description: 'List monitor alerts, optionally filtering and sorting the response.

        Filters are specified in the CEL query language.

        Supported orderBy fields: id, level, status, start, monitor.id, monitor.label.

        Time scoping can be provided in two ways (mutually exclusive):

        - startTime/endTime: a time range. Alerts overlapping this range are returned. Defaults to the last 24 hours.

        - activeAt: a single timestamp. Returns alerts that were active at that moment.

        If both activeAt and startTime/endTime are provided, returns 400.

        Default page size is 200, maximum is 1000.'
      operationId: ListAlerts
      tags:
      - Alert
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: "Filter that response alerts must match. Specified in CEL format.\nNote that filter expressions must be URL encoded.\n\nSupported filter fields:\n- `id` (string): unique alert identifier\n- `level` (string): one of `Critical`, `Error`, `Warning`, `Informational`, `NoData`, `None`\n- `status` (string): one of `Active`, `Ended`, `Retracted`\n- `monitor.id` (int): ID of the monitor that generated the alert\n- `monitor.label` (string): display label of the monitor (supports `.contains()`, `.startsWith()`, `.endsWith()`, and `.lowerAscii()` for case-insensitive matching)\n- `muted` (bool): whether the alert is muted (`true` / `false`)\n- `hasAiChat` (bool): whether an AI investigation exists for the alert. Tied to a feature under development, and rejected as an unknown field where that feature is not enabled.\n- `context.<key>` (string): context value by key, where `<key>` is a GroupBy column name from the monitor definition. Supports `.contains()`, `.startsWith()`, `.endsWith()`.\n  Dot notation reads a key that is a bare identifier (`context.host`); index notation reaches any key, including one carrying a space, hyphen or dot (`context[\"pod name\"]`, `context[\"k8s.pod.name\"]`). A correlation-tag grouping is keyed by its tag prefixed with `#` (`context[\"#deployment.environment.name\"]`). Only reading a key is supported: `in`, `has()` and macros such as `exists()` over `context` are rejected.\n"
        examples:
          filterByMuted:
            summary: Filter for muted alerts only
            value: muted == true
          filterByLevel:
            summary: Filter for critical alerts
            value: level == "Critical"
          filterByMonitorLabel:
            summary: Filter for alerts from monitors whose label contains "CPU"
            value: monitor.label.contains("CPU")
          filterByStatusAndLevel:
            summary: Filter for active warning or critical alerts
            value: status == "Active" && (level == "Critical" || level == "Warning")
          filterByContext:
            summary: Filter for alerts where the context host is a specific value
            value: context.host == "web-server-01"
          filterByContextContains:
            summary: Filter for alerts where a context field contains a substring
            value: context.host.contains("prod")
          filterByContextStartsWith:
            summary: Filter for alerts where a context field starts with a prefix
            value: context.region.startsWith("us-")
          filterByContextEndsWith:
            summary: Filter for alerts where a context field ends with a suffix
            value: context.env.endsWith("-staging")
          filterByContextIndexKey:
            summary: Filter on a context key that is not a bare identifier
            value: context["k8s.pod.name"] == "checkout-7f9c"
      - in: query
        name: orderBy
        schema:
          type: string
        required: false
        description: 'A comma-separated list of field expressions to sort by.

          Prefix a field with - for descending order (default is ascending).

          Default sort is by start time, descending.

          '
        examples:
          sortByStart:
            summary: Sort by start time, descending
            value: -start
          sortByLevel:
            summary: Sort by level ascending, then start descending
            value: level,-start
      - in: query
        name: startTime
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'Start of the time range to query. Alerts that overlap this range are returned

          (i.e., alerts whose end time is after startTime, or that are still active).

          Defaults to 24 hours ago if not provided.

          '
      - in: query
        name: endTime
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'End of the time range to query. Alerts whose start time is before endTime are returned.

          Defaults to current time if not provided.

          '
      - in: query
        name: activeAt
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'A single timestamp to query alerts that were active at that moment.

          Returns alerts where start <= activeAt and (end >= activeAt or the alert is still active).

          Mutually exclusive with startTime and endTime — if both are provided, returns 400.

          '
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/ExpandParam'
      - in: query
        name: includeFacets
        schema:
          type: boolean
        required: false
        description: 'When true, the response includes faceted counts for key alert attributes,

          computed over all alerts in the requested time window. These counts ignore

          any `filter`, `orderBy`, `offset`, or `limit` parameters, making them

          suitable for building filter panels.

          '
      responses:
        '200':
          description: Alerts queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
components:
  schemas:
    Chat-Ref:
      title: ChatRef
      type: object
      description: 'Reference to a chat. Always carries the `id`. The `record` field is

        populated with brief metadata only when `expand=true`.

        '
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/UUID'
          description: Uniquely identifies a chat.
        record:
          $ref: '#/components/schemas/Chat-Brief'
    Alert-LinkColumn:
      title: AlertLinkColumn
      type: object
      required:
      - name
      - meta
      properties:
        name:
          type: string
          description: 'The link column''s identifier. This is the programmatic name used to

            look up the column, not a display label.

            '
        meta:
          anyOf:
          - $ref: '#/components/schemas/Alert-LinkColumnMeta'
          - type: 'null'
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    ObjectRef:
      title: ObjectRef
      type: object
      description: 'A reference to another resource. Always carries the id; the optional `record` field carries the brief metadata, populated when expand=true. Brief expansion applies to one layer only — fields inside `record` that are themselves ObjectRefs (e.g. `record.managedBy`) are returned id-only, never with their own `record` populated. CEL filter expressions can deeper-resolve via lazy wrapper resolution if needed.

        '
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        record:
          $ref: '#/components/schemas/ObjectBrief'
    Alert-CorrelationTag:
      title: AlertCorrelationTag
      type: object
      description: 'A correlation tag reference. The tag identifier is the canonical

        name; the resolved backing column(s) are server-side details and

        not part of the wire shape.

        '
      required:
      - tag
      properties:
        tag:
          type: string
          description: Canonical correlation tag identifier.
    Alert-ResolvedServiceBinding:
      title: AlertResolvedServiceBinding
      type: object
      description: 'Service-binding triplet for an alert. Present whenever the alert''s

        monitor has a service binding declared; a dimension that does not

        resolve to a value is an empty string. Omitted only when the

        monitor has no service binding declared.

        '
      required:
      - serviceName
      - environment
      - serviceNamespace
      properties:
        serviceName:
          type: string
          description: Value of the `service.name` correlation tag.
        environment:
          type: string
          description: Value of the `deployment.environment.name` correlation tag.
        serviceNamespace:
          type: string
          description: Value of the `service.namespace` correlation tag.
    Alert-AutomaticInvestigation:
      title: AlertAutomaticInvestigation
      type: object
      required:
      - outcome
      - chat
      properties:
        outcome:
          $ref: '#/components/schemas/Alert-AutomaticInvestigationOutcome'
        chat:
          anyOf:
          - $ref: '#/components/schemas/Chat-Ref'
          - type: 'null'
          description: 'The automatically created investigation chat. Non-null when

            outcome is `Started` or `Completed`.

            '
    Alert-AutomaticInvestigationOutcome:
      title: AlertAutomaticInvestigationOutcome
      type: string
      description: Current state or terminal result of an automatic AI investigation attempt.
      enum:
      - Started
      - Completed
      - RateLimitedPerMonitor
      - RateLimitedPerCustomer
      - SkippedAlertMuted
      - SkippedAlertLevelNotSelected
      - FailedNoValidUser
      - FailedInternalError
    Monitor-Brief:
      title: MonitorBrief
      type: object
      description: Brief monitor metadata included when a reference is expanded.
      required:
      - name
      - label
      - description
      properties:
        name:
          type: string
          description: 'Name of the monitor, unique within its workspace.

            '
        label:
          type: string
          deprecated: true
          description: Same as `name`. Deprecated; read `name` instead.
        description:
          type:
          - string
          - 'null'
          description: The monitor's description. Null when no description is configured.
    Alert-ContextEntry:
      title: AlertContextEntry
      type: object
      description: A context entry representing a grouping value for which the alert triggered
      required:
      - column
      - value
      properties:
        column:
          $ref: '#/components/schemas/Alert-Column'
        value:
          type: string
    Chat-Message-ReadOnly:
      title: ChatMessageReadOnly
      type: object
      description: The readonly server fields of a message within a chat.
      required:
      - index
      - chatRevision
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      properties:
        id:
          type: string
          description: Client-generated message id scoped to the chat.
        index:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of the message within the chat. Output only.
          readOnly: true
        chatRevision:
          type: integer
          format: int64
          minimum: 0
          description: The chat revision that includes the last update of this message. Output only.
          readOnly: true
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
    Chat-Resource:
      title: ChatResource
      type: object
      description: 'A chat resource - a conversation with the LLM agent.


        The content of the conversation is in separate messages which

        can be inlined into the resource for some operations with `?expand=true`.

        '
      required:
      - id
      - revision
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - activeStreamId
      - alert
      properties:
        id:
          $ref: '#/components/schemas/UUID'
          description: Uniquely identifies a chat. Output only.
          readOnly: true
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonically increasing with every update to the chat or its messages. Output only.
          readOnly: true
        createdBy:
          $ref: '#/components/schemas/User'
          readOnly: true
        createdAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
        updatedBy:
          $ref: '#/components/schemas/User'
          readOnly: true
        updatedAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional human visible title
        summary:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional chat summary
        activeStreamId:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'ID of the currently active stream, or null when no stream is active.

            Used to determine whether the chat is in-progress (streaming) or idle/completed.

            '
        alert:
          description: The alert that triggered this chat, or null if not alert-triggered.
          anyOf:
          - $ref: '#/components/schemas/Chat-Alert'
          - type: 'null'
        messages:
          type: array
          description: Present only when `expand=true`. Output only.
          readOnly: true
          items:
            $ref: '#/components/schemas/Chat-FullMessage'
      examples:
      - id: 4eb09e18-81c2-11f0-9989-73a1cb13d4a3
        revision: 3
        createdBy:
          id: '123'
        createdAt: '2023-04-20T16:20:00Z'
        updatedBy:
          id: '123'
        updatedAt: '2023-04-20T16:20:00Z'
        label: Solving observability, once and for all
        summary: 'Step by step, we solve all observability problems,

          so that we don''t have to do that individually later on.

          '
    Alert-ActionStats:
      title: AlertActionStats
      type: object
      description: Statistics about notification actions taken for this alert
      required:
      - numNotifsDiscarded
      - numNotifsMuted
      - numNotifsSent
      - numErrors
      - lastMutedAt
      - lastSentAt
      - lastErroredAt
      properties:
        numNotifsDiscarded:
          type: string
          format: int64
        numNotifsMuted:
          type: string
          format: int64
        lastMutedAt:
          $ref: '#/components/schemas/NullableTime'
          description: When the alert was last muted. Null if never muted.
        numNotifsSent:
          type: string
          format: int64
        lastSentAt:
          $ref: '#/components/schemas/NullableTime'
          description: When a notification was last sent. Null if never sent.
        numErrors:
          type: string
          format: int64
        lastErroredAt:
          $ref: '#/components/schemas/NullableTime'
          description: When the last notification error occurred. Null if no errors.
    Chat-MessageMetadata:
      title: ChatMessageMetadata
      type: object
      description: Free-form metadata associated with the message (timings, etc.).
      additionalProperties: true
    NullableTime:
      type:
      - string
      - 'null'
      format: RFC3339
    Alert-CapturedValueType:
      title: AlertCapturedValueType
      type: string
      enum:
      - Aggregation
      - GroupBy
      - LinkSourceField
    Alert-Facets:
      title: AlertFacets
      type: object
      description: 'Faceted counts of all alerts in the requested time window, grouped by

        key attributes. Computed independently of any filter or pagination

        parameters.

        '
      required:
      - byStatus
      - byLevel
      - byMonitor
      - byMuted
      properties:
        byStatus:
          type: array
          description: Count of alerts grouped by status (Active, Ended, Retracted).
          items:
            $ref: '#/components/schemas/Alert-FacetEntry'
        byLevel:
          type: array
          description: Count of alerts grouped by severity level.
          items:
