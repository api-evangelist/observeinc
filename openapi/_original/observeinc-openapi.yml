          $ref: '#/components/schemas/Time'
          readOnly: true
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
    Chat-MessageMetadata:
      title: ChatMessageMetadata
      type: object
      description: Free-form metadata associated with the message (timings, etc.).
      additionalProperties: true
    Chat-UIMessagePart:
      title: ChatUIMessagePart
      description: 'A message part. The schema is provided by the AI SDK, see

        https://ai-sdk.dev/docs/reference/ai-sdk-core/ui-message#uimessagepart-types


        This commonly embeds image data, so it can be quite big, but

        often also just contains a snippet of text.


        The backend itself does NOT validate the contents of any part

        except requiring a string type field.


        This field is not part of the explicit schema since not all code

        generators support a required type field and capturing additional

        properties in a catch-all field.


        The client must validate this field for validity before use.

        '
      type: object
      examples:
      - type: text
        text: What is our current request failure rate?
        state: done
      - type: text
        text: What is our current request failure rate?
        state: done
      - type: file
        mediaType: image/png
        filename: my-living-room-i-wish.png
        url: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVQYV2NgYAAAAAMAAWgmWQ0AAAAASUVORK5CYII=
      additionalProperties: true
    Chat-FullMessage-CreateRequest:
      title: ChatFullMessageCreateRequest
      description: 'A message within a chat including message parts.

        Message parts may e.g. contain image data and be quite big.

        '
      type: object
      required:
      - parts
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - data
        metadata:
          $ref: '#/components/schemas/Chat-MessageMetadata'
        id:
          type: string
          description: Client-generated message id scoped to the chat.
        indexedText:
          description: 'The full text contained in `parts` for full text indexing.


            Since the schema of the message parts is not fully known to

            the API server, the client needs to fill this field with the logically

            contained text.


            The contents of this field are not shown to the user --

            the UI uses the more structured information in the `parts` field for

            that.

            '
          type: string
        parts:
          type: array
          maxLength: 256
          description: The message parts as defined by the AI SDK. Potentially large.
          items:
            $ref: '#/components/schemas/Chat-UIMessagePart'
      examples:
      - role: user
        indexedText: What are the most important metrics for critical-component?
        parts:
        - type: text
          text: What are the most important metrics for critical-component?
          state: done
    Chat-FullMessage:
      title: ChatFullMessage
      description: 'A message within a chat including the actual message "parts".

        Message parts may e.g. contain image data and be quite big, but

        often also just contain a text snippet.

        '
      allOf:
      - $ref: '#/components/schemas/Chat-Message-ReadOnly'
      - $ref: '#/components/schemas/Chat-FullMessage-CreateRequest'
      examples:
      - id: some-ai-sdk-id-1
        index: 0
        chatRevision: 1
        createdAt: '2023-04-20T16:20:00Z'
        createdBy:
          id: '123'
        updatedAt: '2023-04-20T16:20:00Z'
        updatedBy:
          id: '123'
        role: user
        indexedText: What are the most important metrics for critical-component?
        parts:
        - type: text
          text: What are the most important metrics for critical-component?
          state: done
    Chat-Resource:
      title: ChatResource
      type: object
      description: 'A chat resource - a conversation with the LLM agent.


        The content of the conversation is in separate messages which

        can be inlined into the resource for some operations with `?expand=true`.

        '
      required:
      - id
      - revision
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - activeStreamId
      - alert
      properties:
        id:
          $ref: '#/components/schemas/UUID'
          description: Uniquely identifies a chat. Output only.
          readOnly: true
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonically increasing with every update to the chat or its messages. Output only.
          readOnly: true
        createdBy:
          $ref: '#/components/schemas/User'
          readOnly: true
        createdAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
        updatedBy:
          $ref: '#/components/schemas/User'
          readOnly: true
        updatedAt:
          $ref: '#/components/schemas/Time'
          readOnly: true
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional human visible title
        summary:
          type: string
          minLength: 1
          maxLength: 4096
          description: Optional chat summary
        activeStreamId:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'ID of the currently active stream, or null when no stream is active.

            Used to determine whether the chat is in-progress (streaming) or idle/completed.

            '
        alert:
          description: The alert that triggered this chat, or null if not alert-triggered.
          anyOf:
          - $ref: '#/components/schemas/Chat-Alert'
          - type: 'null'
        messages:
          type: array
          description: Present only when `expand=true`. Output only.
          readOnly: true
          items:
            $ref: '#/components/schemas/Chat-FullMessage'
      examples:
      - id: 4eb09e18-81c2-11f0-9989-73a1cb13d4a3
        revision: 3
        createdBy:
          id: '123'
        createdAt: '2023-04-20T16:20:00Z'
        updatedBy:
          id: '123'
        updatedAt: '2023-04-20T16:20:00Z'
        label: Solving observability, once and for all
        summary: 'Step by step, we solve all observability problems,

          so that we don''t have to do that individually later on.

          '
    Alert-AutomaticInvestigationOutcome:
