        serviceNamespace:
          type: string
          description: Value of the `service.namespace` correlation tag.
    Alert-ActionStats:
      title: AlertActionStats
      type: object
      description: Statistics about notification actions taken for this alert
      required:
      - numNotifsDiscarded
      - numNotifsMuted
      - numNotifsSent
      - numErrors
      - lastMutedAt
      - lastSentAt
      - lastErroredAt
      properties:
        numNotifsDiscarded:
          type: string
          format: int64
        numNotifsMuted:
          type: string
          format: int64
        lastMutedAt:
          $ref: '#/components/schemas/NullableTime'
          description: When the alert was last muted. Null if never muted.
        numNotifsSent:
          type: string
          format: int64
        lastSentAt:
          $ref: '#/components/schemas/NullableTime'
          description: When a notification was last sent. Null if never sent.
        numErrors:
          type: string
          format: int64
        lastErroredAt:
          $ref: '#/components/schemas/NullableTime'
          description: When the last notification error occurred. Null if no errors.
    Alert-Resource:
      title: AlertResource
      type: object
      description: A monitor alert representing a detected condition.
      required:
      - id
      - start
      - end
      - detectedStart
      - detectedEnd
      - status
      - level
      - groupingHash
      - capturedValues
      - context
      - monitorVersion
      - monitor
      - muted
      properties:
        id:
          type: string
          description: Unique identifier for the alert
        start:
          $ref: '#/components/schemas/Time'
          description: When the alert condition first occurred
        end:
          $ref: '#/components/schemas/NullableTime'
          description: When the alert condition ended. Null for active alerts.
        detectedStart:
          $ref: '#/components/schemas/NullableTime'
          description: When the alert start was detected by the monitoring system. Null when not yet detected.
        detectedEnd:
          $ref: '#/components/schemas/NullableTime'
          description: When the alert end was detected by the monitoring system. Null for active alerts.
        status:
          $ref: '#/components/schemas/Alert-Status'
        level:
          $ref: '#/components/schemas/Alert-Level'
        groupingHash:
          type: string
          format: int64
          description: Hash of the grouping values for this alert
        capturedValues:
          type: array
          items:
            $ref: '#/components/schemas/Alert-CapturedValue'
        context:
          type: array
          items:
            $ref: '#/components/schemas/Alert-ContextEntry'
        monitorVersion:
          type: string
          format: int64
          description: Version of the monitor when this alert was created
        monitor:
          $ref: '#/components/schemas/Monitor-Ref'
          description: 'Reference to the monitor that generated this alert. Always carries

            the id; the `record` field is populated only when expand=true.

            '
        muted:
          type: boolean
          description: Whether the alert is currently muted by active mute rules.
        aiChats:
          type: array
          items:
            $ref: '#/components/schemas/Chat-Resource'
          description: 'Optional field tied to a feature under development. Where that

            feature is not enabled the key is omitted from the response

            entirely, rather than returned as an empty array; it becomes

            required once the feature is generally available.


            AI investigations for this alert, newest first; empty when it has

            never been investigated. An investigation is started either

            automatically, when the alert''s monitor has AI triaging enabled, or

            by a user from the alert.

            '
        automaticInvestigation:
          anyOf:
          - $ref: '#/components/schemas/Alert-AutomaticInvestigation'
          - type: 'null'
          description: 'The current state or terminal result of the automatic AI

            investigation attempt for this alert. Null when automatic

            investigation was not enabled or no attempt was made.


            Optional field tied to a feature under development. Where that

            feature is not enabled the key is omitted from the response,

            matching `aiChats`.

            '
        resolvedServiceBinding:
          oneOf:
          - $ref: '#/components/schemas/Alert-ResolvedServiceBinding'
          - type: 'null'
          description: 'Resolved (service.name, deployment.environment.name,

            service.namespace) triplet this alert is attributed to.

            Omitted only when the alert''s monitor has no service binding

            declared. When a binding wildcard does not resolve to a value

            for this alert, that dimension is an empty string.

            '
        stats:
          $ref: '#/components/schemas/Alert-ActionStats'
          description: Action statistics for this alert. Only included when expand=true.
    Apm-Interval:
      title: ApmInterval
      type: object
      description: 'A `[startTime, endTime)` half-open window. Used both as the per-record

        time slice on `MetricsRecord` and as the response-level executed-window

        echo. RFC3339, startTime inclusive, endTime exclusive.

        '
      required:
      - startTime
      - endTime
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
      additionalProperties: false
    Apm-ServiceType:
      title: ApmServiceType
      type: string
      description: 'Role of a service-keyed row. PascalCase per style guide. Selects which

        `related.correlationTags.serviceName` key to filter on:


        - `Service` → `service.name`

        - `Database` → `peer.db.name`

        - `Messaging` → `peer.messaging.system`

        - `ExternalCall` → `peer.server.address` (uninstrumented hosts)


        When more than one key is present, precedence is `Service` >

        `Database` > `Messaging` > `ExternalCall`. When `type` is null (unknown

        catalog type), use `service.name`.

        '
      enum:
      - Service
      - Database
      - Messaging
      - ExternalCall
    Apm-ServiceIdentity:
      title: ApmServiceIdentity
      type: object
      description: 'Shared OTel service identity fields for APM graph nodes and invocation

        participants.

        '
      required:
      - serviceName
      - environment
      - serviceNamespace
      - type
      - language
      properties:
        serviceName:
          type: string
        environment:
          type: string
        serviceNamespace:
          type:
          - string
          - 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/Apm-ServiceType'
          - type: 'null'
        language:
          type:
          - string
          - 'null'
    Apm-MetricsRecordPoint:
      title: ApmMetricsRecordPoint
      type: object
      description: One bucket inside MetricsRecord.series. timestamp = bucket start.
      required:
      - timestamp
      - invocationRatePerSecond
      - errorRatePerSecond
      - durationP95Seconds
      properties:
        timestamp:
          type: string
          format: date-time
        invocationRatePerSecond:
          type:
          - number
          - 'null'
        errorRatePerSecond:
          type:
          - number
          - 'null'
        durationP95Seconds:
          type:
          - number
          - 'null'
      additionalProperties: false
    Apm-MetricsRecord:
      title: ApmMetricsRecord
      type: object
      description: 'Closed RED carrier: invocationRatePerSecond, errorRatePerSecond,

        durationP95Seconds. `series[]` is opt-in via expand=true on

        /v1/apm/services only.

        '
      required:
      - interval
      - invocationRatePerSecond
      - errorRatePerSecond
      - durationP95Seconds
      properties:
        interval:
          $ref: '#/components/schemas/Apm-Interval'
        invocationRatePerSecond:
          type:
          - number
          - 'null'
        errorRatePerSecond:
          type:
          - number
          - 'null'
        durationP95Seconds:
          type:
          - number
          - 'null'
        series:
          type: array
          description: 'Per-bucket points over the same interval. Populated only when the

            endpoint documents an expand=true opt-in (see /v1/apm/services).

            Absent on every other endpoint.

            '
          items:
            $ref: '#/components/schemas/Apm-MetricsRecordPoint'
      additionalProperties: false
    Apm-MetricRef:
      title: ApmMetricRef
      type: object
      description: 'One queryable metric on Service.related.metrics. Names are the RED

        metrics used for this row (call count, error count, duration). Every

        entry shares the same `attributeMapping` as `related.correlationTags`.

        Pick the `serviceName` dimension from `Service.type`: `Service` →

        `service.name`, `Database` → `peer.db.name`, `Messaging` →

        `peer.messaging.system`, `ExternalCall` → `peer.server.address`.

        Precedence is `Service` > `Database` > `Messaging` > `ExternalCall`.

        When `type` is null, use `service.name`.

        '
      required:
      - metricName
      - dataset
      - attributeMapping
      properties:
        metricName:
          type: string
        dataset:
          $ref: '#/components/schemas/DatasetRef'
        attributeMapping:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    Apm-ServiceRelated:
      title: ApmServiceRelated
      type: object
      description: "Per-row correlation hints on Service. Always present; `metrics` may be\n`[]`. `correlationTags` maps Service fields to the attribute keys to\nfilter with:\n\n- `serviceName`: `service.name`, `peer.db.name`, `peer.messaging.system`,\n  `peer.server.address`\n- `environment`: `deployment.environment.name`\n- `serviceNamespace`: `service.namespace`\n\nThese are attribute keys, not dataset column names. Use `Service.type`\nto pick the `serviceName` key to filter on: `Service` →\n`service.name`, `Database` → `peer.db.name`, `Messaging` →\n`peer.messaging.system`, `ExternalCall` → `peer.server.address`.\nPrecedence is `Service` > `Database` > `Messaging` > `ExternalCall`.\nWhen `type` is null, use `service.name`. `environment` and\n`serviceNamespace` apply to every type.\n"
      required:
      - correlationTags
      - metrics
      properties:
        correlationTags:
          type: object
          description: 'Service field name → attribute keys to filter with. v1 always

            returns the three keys above. Pick `serviceName` by `Service.type`

            (see parent description).

            '
          additionalProperties:
            type: array
            items:
              type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Apm-MetricRef'
      additionalProperties: false
    Apm-Service:
      title: ApmService
      description: 'Service identity (OTel compound key) + RED snapshot under redMetrics +

        per-row related hints. ServiceInvocation uses `metrics` (not

        `redMetrics`) for the same MetricsRecord type — intentional asymmetry.

        '
      allOf:
      - $ref: '#/components/schemas/Apm-ServiceIdentity'
      - type: object
        required:
        - redMetrics
        - related
        properties:
          serviceNamespace:
            type:
            - string
            - 'null'
          type:
            oneOf:
            - $ref: '#/components/schemas/Apm-ServiceType'
            - type: 'null'
          language:
            type:
            - string
            - 'null'
          redMetrics:
            $ref: '#/components/schemas/Apm-MetricsRecord'
          related:
            $ref: '#/components/schemas/Apm-ServiceRelated'
    Apm-ErrorType:
      title: ApmErrorType
      type: string
      description: "Stable, machine-readable APM error category.\n\n- `BadRequest`: the request is malformed or otherwise the caller's\n  doing (inverted time window, canceled request, invalid filter).\n- `RequiredParamMissing`: a required parameter was omitted or passed\n  empty.\n- `InvalidTimestamp`: a time bound is not a valid RFC3339 timestamp.\n- `OutOfAcceleratedRange`: the requested window starts before this\n  account's accelerated telemetry is available. `acceleratedFrom` is\n  the earliest recoverable timestamp.\n- `NotConfigured`: an account/config state, not a malformed request\n  and not a server fault. The tracing-content dataset an APM read\n  needs has not been installed (or has not yet been discovered) for\n  this account. Retrying will not help until that dataset exists.\n- `PayloadTooLarge`: the result exceeds a server-enforced size cap\n  (for example the invocation graph's edge limit). Narrow the window\n  or supply a focal identity.\n- `TimedOut`: the query exceeded\
        \ its time budget.\n- `InternalError`: an unexpected server failure.\n"
      enum:
      - BadRequest
      - RequiredParamMissing
      - InvalidTimestamp
      - OutOfAcceleratedRange
      - NotConfigured
      - PayloadTooLarge
      - TimedOut
      - InternalError
    Apm-Error:
      title: ApmError
      description: 'APM error envelope. Extends the platform error (type + message) with a

        closed `type` enum (see Apm-ErrorType). On OutOfAcceleratedRange,

        acceleratedFrom is the recovery timestamp.

        '
      allOf:
      - $ref: '#/components/schemas/ErrorMessage'
      - type: object
        required:
        - type
        - message
        properties:
          type:
            $ref: '#/components/schemas/Apm-ErrorType'
          acceleratedFrom:
            type: string
            format: date-time
            description: 'Earliest moment for which telemetry is available on this account.

              Present only on type=OutOfAcceleratedRange.

              '
    Apm-InvocationParticipant:
      title: ApmInvocationParticipant
      description: 'Source or target end of a ServiceInvocation edge. endpointName is

        populated only in focal-endpoint mode of /v1/apm/invocation-graph.

        '
      allOf:
      - $ref: '#/components/schemas/Apm-ServiceIdentity'
      - type: object
        properties:
          serviceNamespace:
            type:
            - string
            - 'null'
          type:
            oneOf:
            - $ref: '#/components/schemas/Apm-ServiceType'
            - type: 'null'
          language:
            type:
            - string
            - 'null'
          endpointName:
            type:
            - string
            - 'null'
    Apm-ServiceInvocation:
      title: ApmServiceInvocation
      type: object
      description: 'Directed call edge from source to target. Both are always non-null —

        roots are services with no inbound edge in invocations[], not edges

        with null source. Carrier field is `metrics` (not `redMetrics`).

        '
      required:
      - source
      - target
      - metrics
      properties:
        source:
          $ref: '#/components/schemas/Apm-InvocationParticipant'
        target:
          $ref: '#/components/schemas/Apm-InvocationParticipant'
        metrics:
          $ref: '#/components/schemas/Apm-MetricsRecord'
      additionalProperties: false
    Apm-InvocationGraphResponse:
      title: ApmInvocationGraphResponse
      type: object
      description: 'The service dependency graph for the requested scope. `interval` echoes

        the resolved query window, `services` lists every service in the graph,

        and `invocations` lists the calls between them. A service that is never

        the `target` of a call is a root.

        '
      required:
      - interval
      - services
      - invocations
      properties:
        interval:
          $ref: '#/components/schemas/Apm-Interval'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Apm-Service'
        invocations:
          type: array
          items:
            $ref: '#/components/schemas/Apm-ServiceInvocation'
      additionalProperties: false
