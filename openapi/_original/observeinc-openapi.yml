  /v1/metrics:
    get:
      summary: List metrics
      description: 'List metrics defined by, or auto-discovered in, the customer''s metric

        datasets that the user has read access to. Default page size is 100; maximum is 1000.

        Default ordering is by `name` ascending, then `dataset.id` ascending.

        Set `expand=true` to inline reference fields (`dataset.record`, …). Without `expand`,

        references contain only `id`.


        ## Filtering and ordering with CEL

        The `filter` and `orderBy` query parameters are evaluated as

        [Common Expression Language (CEL)](https://cel.dev) expressions

        against a stable schema that mirrors the metric response body.

        `filter` must evaluate to `bool`; `orderBy` is a CSV list of

        CEL expressions whose values must be comparable. URL-encode

        both; CSV-escape `orderBy` items first (see the `orderBy`

        parameter for syntax).


        ### Discrepancies between CEL and REST


        | Field         | CEL                                                     | REST         | Notes                                                                                                                     |

        | ------------- | -------------------------------------------------------- | ------------ | --------------------------------------------------------------------------------------------------------------------------- |

        | `objectTags`  | `map(string, list(string))`, from the metric''s dataset''s object tags | not present  | CEL-only convenience field. Filter with `"env" in objectTags`; to read the tags, fetch the dataset via `dataset.id`. |


        ### Available CEL functions

        The metric CEL environment registers the [CEL standard

        definitions](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#StdLib)

        (operators, `in`, `?:`, `size()`, `string.contains`, `string.startsWith`,

        `string.endsWith`, `matches`, etc.) plus the following extension

        libraries from

        [cel-go v0.28.0](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext):


        - [`ext.Strings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Strings) — `charAt`, `indexOf`, `join`, `lowerAscii`, `replace`, `split`, `substring`, `trim`, `upperAscii`, `format`

        - [`ext.Lists`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Lists) — `lists.flatten`, `lists.range`, `lists.slice`

        - [`ext.Math`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Math) — `math.greatest`, `math.least`

        - [`ext.Sets`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Sets) — `sets.contains`, `sets.equivalent`, `sets.intersects`

        - [`ext.Regex`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Regex) — `re.capture`, `re.extract`

        - [`ext.Encoders`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Encoders) — `base64.encode`, `base64.decode`

        - [`ext.Bindings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Bindings) — `cel.bind` for let-binding sub-expressions

        - [`ext.Protos`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Protos) — protobuf helpers

        - [`cel.OptionalTypes`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#OptionalTypes) — `optional.of`, `optional.ofNonZero`, `optional.none`

        '
      operationId: ListMetrics
      tags:
      - Metrics
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/ExpandParam'
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
        description: 'CSV list of CEL expressions, each producing a comparable

          value. Prefix an item with `-` for descending order.


          CSV-escape first, then URL-encode. Wrap an item in `"` if it

          contains a comma or `"`; double a literal `"` to `""` inside

          a quoted item.


          Supported fields: See the description of the `filter` parameter for the

          list of supported fields.

          '
        example: -lastReported,name
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: "Filter that response metrics must match. Specified in CEL format.\nNote that filter expressions must be URL encoded.\n\nSupported filter fields:\n- `name` (string): metric name\n- `type` (string): metric type\n- `unit` (string): metric unit\n- `description` (string): metric description\n- `rollup` (string): metric rollup\n- `aggregate` (string): metric aggregate\n- `userDefined` (bool): whether the metric is user-defined\n- `status` (string): metric status\n- `dataset.id` (int): ID of the metric dataset\n- `dataset.label` (string): label of the metric dataset\n- `lastReported` (timestamp): last reported time\n- `metricTags` (list): tag paths observed for this metric. Each\n  element is an object with `field` (string) and `path` (string).\n  Use CEL macros to test membership, e.g.\n  `metricTags.exists(t, t.field == \"container\")`.\n- `correlationTags` (list): correlation tags relevant to this\n  metric. Each element is an object with `tag` (string) and `path`\n  (an\
          \ object with `field` and `path`). e.g.\n  `correlationTags.exists(c, c.tag == \"service.name\")`.\n- `objectTags` (map of string to list of string): user-applied\n  object tags on the metric's dataset. Test membership with `in`,\n  e.g. `\"env\" in objectTags` or\n  `\"env\" in objectTags && \"prod\" in objectTags[\"env\"]`.\n\nSee the Metric-Resource schema for the detailed descriptions of the supported fields.\n\n## CEL functions\n\n### `hasCorrelationTag(tag string, value string) bool`\n\nReturns `true` if this metric has data points whose correlation tag\n`tag` takes on `value` within a recent observation window.\n\nBoth arguments must be constant string literals.\n\nLimits and error conditions:\n- HTTP 400 if a single filter references more than 8 unique\n  `hasCorrelationTag(T, V)` callsites.\n- For each `(tag, value)` pair, fan-out is capped at 10 candidate\n  datasets, selected deterministically in ascending dataset id.\n  Datasets beyond the cap are not consulted for\
          \ that pair.\n- HTTP 500 if the OPAL query fails (e.g. Snowflake unavailable).\n- HTTP 503 if no query backend is wired (test / degraded apiserver).\n"
        examples:
          filterByName:
            summary: Filter by exact name
            value: name == "cpu_usage"
          filterByType:
            summary: Filter by metric type
            value: type == "Gauge"
          filterByNameRegex:
            summary: Regex search by name
            value: name.matches("http.*")
          filterByDataset:
            summary: Filter to a specific dataset's metrics
            value: dataset.id == 41001234
          filterByDatasetLabel:
            summary: Filter by the metric dataset's label
            value: dataset.label == "Kubernetes Metrics"
          filterByMultiple:
            summary: User-defined gauges
            value: type == "Gauge" && userDefined == true
          filterByMetricTag:
            summary: Metrics that carry a given tag field
            value: metricTags.exists(t, t.field == "container")
          filterByCorrelationTagName:
            summary: Metrics with a specific correlation tag
            value: correlationTags.exists(c, c.tag == "service.name")
          filterByCorrelationTagPath:
            summary: Match on a correlation tag's nested path field
            value: correlationTags.exists(c, c.tag == "service.name" && c.path.field == "container")
          filterByCorrelationTagKV:
            summary: Filter to metrics that report a specific (correlation-tag, value) pair
            value: hasCorrelationTag("env","prod")
          filterByCorrelationTagAndName:
            summary: Combine hasCorrelationTag with a name predicate
            value: hasCorrelationTag("env","prod") && name.matches("http_.*")
          filterByCorrelationTagOr:
            summary: Union of two correlation-tag value matches
            value: hasCorrelationTag("env","prod") || hasCorrelationTag("env","staging")
          filterByObjectTag:
            summary: Metrics whose dataset carries a given object tag key
            value: '"env" in objectTags'
          filterByObjectTagKV:
            summary: Metrics whose dataset carries a specific object tag key/value
            value: '"env" in objectTags && "prod" in objectTags["env"]'
      responses:
        '200':
          description: Metrics queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/login/delegated/{serverToken}:
    get:
      summary: Poll the status of a pending login request
      operationId: pollDelegatedLogin
      tags:
      - Login
      description: 'This endpoint polls the status of a pending login request. The serverToken is

        returned from the initial request, and is used to identify the request.

        '
      parameters:
      - name: serverToken
        in: path
        description: The serverToken returned from the initial request.
        required: true
        schema:
          type: string
          format: password
      security: []
      responses:
        '200':
          description: 'The request is still pending, or has been accepted, denied, or timed out.

            '
          content:
            application/json:
              schema:
                type: object
                required:
                - settled
                properties:
                  ok:
                    description: Whether this HTTP request was valid (does not indicate completion status).
                    type: boolean
                  settled:
                    description: 'If the request has been accepted, denied, or timed out (is settled) then this is true,

                      else if we need to poll again, it is false. If the request is not yet settled, the server

                      side will wait a bit before returning this response, which allows the client to easily

                      implement long polling.

                      '
                    type: boolean
                  accessKey:
                    description: 'The access key if the request has been accepted. If the request is settled but not

                      accepted, it will be empty. Note that only the first request after the login is settled

                      will contain the access key, because it is generated once and not stored server side

                      (only a hash is stored, for later API request authentication.) This key imbues the same

                      powers in the Observe API as are available to the issuing user.

                      '
                    type: string
                    format: password
                  message:
                    description: 'A message from the server. In case of error, this may be helpful to display to the user.

                      '
                    type: string
        '400':
          description: Invalid request.
  /v1/documentation/search:
