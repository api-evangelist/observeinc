servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
security:
- bearerAuth: []
tags:
- name: Tag Values
paths:
  /v1/tags/values:
    get:
      summary: Search tag values
      description: 'Returns tag values matching the query.

        Use `Regex` to interpret `query` as a regular expression, or `Semantic` for semantic similarity search.'
      operationId: SearchTagValues
      tags:
      - Tag Values
      parameters:
      - name: query
        in: query
        required: true
        description: Text to search for.
        schema:
          type: string
      - name: mode
        in: query
        required: true
        description: How `query` is interpreted when matching tags.
        schema:
          $ref: '#/components/schemas/TagValues-SearchMode'
      - name: kind
        in: query
        description: Kind of tag to search for.
        schema:
          $ref: '#/components/schemas/TagKind'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Matching tag name-value pairs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagValues-Response'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
components:
  responses:
    ErrorResponse-5XX:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-429:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
  schemas:
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    TagValuePair:
      title: TagValuePair
      type: object
      required:
      - name
      - value
      - kind
      properties:
        name:
          type: string
          description: Tag name.
        value:
          type: string
          description: Tag value.
        kind:
          $ref: '#/components/schemas/TagKind'
    ErrorMessage:
      type: object
      properties:
        type:
          type: string
          description: A stable, machine-readable identifier for the kind of error.
        message:
          type: string
          description: Error message
      required:
      - type
      - message
    TagKind:
      title: TagKind
      type: string
      enum:
      - Metric
      - Correlation
      description: Kind of tag.
    TagValues-SearchMode:
      title: TagValuesSearchMode
      type: string
      enum:
      - Regex
      - Semantic
      description: '`Regex`: treat `query` as a regular expression.

        `Semantic`: use semantic search against `query`.

        '
    TagValues-Response:
      title: TagValuesResponse
      type: object
      required:
      - tagValuePairs
      - meta
      properties:
        tagValuePairs:
          type: array
          description: Tag name-value pairs matching the query and pagination.
          items:
            $ref: '#/components/schemas/TagValuePair'
        meta:
          $ref: '#/components/schemas/Meta'
  parameters:
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip before starting to collect the result set
      schema:
        type: integer
        format: int64
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return in the response
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Authorization: Bearer <customerid> <apitoken>

