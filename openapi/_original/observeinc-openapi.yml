          format: int64
          minimum: 1
          maximum: 5000
          default: 500
        required: false
        description: 'Max number of nodes (including the focal) in the returned neighborhood.

          Default 500, max 5000. When the BFS hits this cap, meta.totalCount is -1.

          '
      responses:
        '200':
