servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
security:
- bearerAuth: []
tags:
- name: Documentation
  description: Semantic search across Observe's built-in documentation.
paths:
  /v1/documentation/search:
    post:
      summary: Search documentation
      description: 'Semantic search across Observe''s built-in documentation. Given a natural-language

        query, returns the most relevant documentation chunks ranked by cosine similarity.


        Results are returned at the chunk level, not whole documents. A single documentation

        page may be split into multiple chunks, each with its own embedding and score.

        Multiple chunks from the same source page can appear in the results.'
      operationId: SearchDocumentation
      tags:
      - Documentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Documentation-SearchRequest'
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Documentation-SearchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
components:
  schemas:
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    Documentation-SearchResult:
      title: DocumentationSearchResult
      type: object
      required:
      - title
      - text
      properties:
        title:
          type: string
          description: Chunk title, typically the source document or section name.
        text:
          type: string
          description: The chunk's text content.
        url:
          type:
          - string
          - 'null'
          description: Link to the full documentation page on docs.observeinc.com, or null if unavailable.
    Documentation-SearchResponse:
      title: DocumentationSearchResponse
      type: object
      required:
      - documentation
      - meta
      properties:
        documentation:
          type: array
          items:
            $ref: '#/components/schemas/Documentation-SearchResult'
        meta:
          $ref: '#/components/schemas/Meta'
    Documentation-SearchRequest:
      title: DocumentationSearchRequest
      type: object
      required:
      - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4096
          description: Natural-language search query.
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
          description: Maximum number of results to return.
        minScore:
          type: number
          format: float
          default: 0.5
          minimum: 0
          maximum: 1
          description: Minimum cosine similarity score. Results below this threshold are excluded.
    ErrorMessage:
      type: object
      properties:
        type:
          type: string
          description: A stable, machine-readable identifier for the kind of error.
        message:
          type: string
          description: Error message
      required:
      - type
      - message
  responses:
    ErrorResponse-400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-5XX:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-429:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Authorization: Bearer <customerid> <apitoken>

        '
