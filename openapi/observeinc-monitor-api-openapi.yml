      - name
      - description
      - disabled
      - ruleKind
      - monitorVersion
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - disabledDetail
      - scheduled
      - rollupStatus
      - health
      - governorState
      - alertState
