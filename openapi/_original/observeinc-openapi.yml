servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
paths:
  /v1/service-accounts/{accountId}/api-tokens:
    post:
      summary: Create an API token
      operationId: CreateApiToken
      tags:
      - ServiceAccounts
      parameters:
      - in: path
        name: accountId
        schema:
          type: string
          format: int64
        required: true
        description: The id of the service account associated with the API token
        example: 1
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiToken-CreateRequest'
      responses:
        '201':
          description: API token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: Get a list of API tokens for this service account
      description: Get a list of all API tokens for this service account
      operationId: ListApiTokens
      tags:
      - ServiceAccounts
      parameters:
      - in: path
        name: accountId
        schema:
          type: string
          format: int64
        required: true
        description: The id of the service account associated with the API token
        example: 1
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: API tokens queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/dashboards:
    post:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      summary: Create a dashboard
      description: '> **Beta — may change; breaking changes are coordinated with affected

        > customers. Suitable for evaluation, not production reliance.**


        Create a dashboard. The server assigns `id`, `createdAt`, `updatedAt`,

        `createdBy`, and `updatedBy`.

        '
      operationId: CreateDashboard
      tags:
      - Dashboards
      parameters:
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Dashboard-CreateRequest'
      responses:
        '201':
          description: Dashboard created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '409':
          $ref: '#/components/responses/ErrorResponse-409'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      summary: List dashboards
      description: '> **Beta — may change; breaking changes are coordinated with affected

        > customers. Suitable for evaluation, not production reliance.**


        Returns a paginated list of dashboards the caller can read. List items

        include envelope metadata only (no `definition`). Default page size is

        100; maximum is 100. Default ordering is `name` ascending, then `id`

        ascending.


        Set `expand=true` to populate display fields on `createdBy` and

        `updatedBy`, and `record` on `managedBy`. Without `expand`, references

        contain only `id`.

        '
      operationId: ListDashboards
      tags:
      - Dashboards
      parameters:
      - in: query
        name: filter
        required: false
        schema:
          type: string
        description: '[Common Expression Language (CEL)](https://cel.dev) expression that

          each dashboard must match. It must evaluate to a boolean.


          **Identity and content:** `id` (int in CEL, string in JSON), `name`,

          `description` (string), `visibility` (`Listed` or `Hidden`).


          **Audit:** `createdAt`, `updatedAt` (timestamp); `createdBy.id`,

          `updatedBy.id` (user id, int).


          **Owner reference:** `managedBy.id` (int); `managedBy.record.label`,

          `managedBy.record.description` (string). These are filterable even

          without `expand=true` — `expand` controls what is *returned*, not

          what can be filtered.


          **Facets (filter-only, not sortable):**


          | Field | CEL type | Notes |

          |---|---|---|

          | `objectTags` | `map(string, list(string))` | User-applied tags, as a map of tag key to a list of values. |

          | `parameters.correlationTags` | `list(string)` | Correlation-tag names picked by the dashboard''s `correlationTag`-kind parameters. |

          | `parameters.resources.ids` | `list(int)` | Dataset ids picked by the dashboard''s `resource`-kind parameters. |

          | `parameters.resources.names` | `list(string)` | Dataset names for the same `resource`-kind parameters. |

          | `queries.inputs.ids` | `list(int)` | Dataset ids bound to the dashboard''s query-card inputs. |

          | `queries.inputs.names` | `list(string)` | Dataset names for the same query-card inputs. |

          | `datasetFilter.id` | `int`, nullable | The primary dataset filter''s dataset id, when set. |

          | `datasetFilter.name` | `string`, nullable | The primary dataset filter''s dataset name, when set. |


          Supports `matches()` for regex. Example: `name.matches("prod.*")`.

          '
      - in: query
        name: orderBy
        required: false
        schema:
          type: string
        description: 'CSV list of [CEL](https://cel.dev) expressions, each producing a

          comparable value. Prefix an item with `-` for descending order.

          Default sort is `name` ascending, then `id` ascending.


          Sortable fields: `id`, `name`, `description`, `visibility`,

          `createdAt`, `updatedAt`, `createdBy.id`, `updatedBy.id`, `managedBy.id`.

          Facet fields (`objectTags`, `parameters.*`, `queries.*`,

          `datasetFilter.*`) cannot be sorted.


          CSV-escape first, then URL-encode. Wrap an item in `"` if it contains

          a comma or `"`; double a literal `"` to `""` inside a quoted item.

          '
        examples:
          defaultSort:
            summary: Default name then id ascending (explicit)
            value: name,id
          nameDesc:
            summary: Name descending, then id descending
            value: -name,-id
          csvQuotedExpression:
            summary: Multi-key sort with a CSV-quoted conditional CEL expression
            value: '"managedBy != null ? managedBy.record.label : name",-id'
      - name: offset
        in: query
        description: Number of items to skip before starting to collect the result set.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        description: Maximum number of items to return in the response. Capped at 100.
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Dashboards queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/datasets/{datasetId}/query-filters:
    post:
      summary: Create a new dataset query filter
      description: Create a new query filter for a specific dataset
      operationId: CreateDatasetQueryFilter
      tags:
      - Dataset Query Filter
      parameters:
      - $ref: '#/components/parameters/DatasetIdParam'
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryFilter-CreateRequest'
      responses:
        '201':
          description: Dataset query filter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQueryFilter-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: Get a list of dataset query filters
      description: Get a list of all query filters for a specific dataset
      operationId: ListDatasetQueryFilters
      tags:
      - Dataset Query Filter
      parameters:
      - $ref: '#/components/parameters/DatasetIdParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Dataset query filters retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - queryFilters
                - meta
                properties:
                  queryFilters:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasetQueryFilter-Resource'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/ingest/filters:
    post:
      summary: Create a drop filter
      description: 'Creates a drop filter. The OPAL pipeline is compiled against the source

        dataset''s schema; if compilation fails the request is rejected with a

        400 whose error body details the compiler errors.


        A dataset accepts at most 100 drop filters. Creating the 101st returns

        a 400. Use `POST /v1/ingest/filters/validate` to check a pipeline

        before creating the filter.


        Allow 1-2 minutes for a new filter to take effect on the ingest path.

        '
      operationId: CreateIngestFilter
      tags:
      - Drop Filters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestFilters-CreateRequest'
      responses:
        '201':
          description: Drop filter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestFilters-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: List drop filters
      description: List drop filters for the calling customer. Default ordering is by `id` ascending. Pagination is offset/limit with `limit` defaulting to 100 and capped at 1000. The `expand` flag will populate the brief record on the `sourceDataset` and `managedBy` references.
      operationId: ListIngestFilters
      tags:
      - Drop Filters
      parameters:
      - $ref: '#/components/parameters/ExpandParam'
      - $ref: '#/components/parameters/IngestFilters-OffsetQuery'
      - $ref: '#/components/parameters/IngestFilters-LimitQuery'
      - $ref: '#/components/parameters/IngestFilters-OrderByQuery'
      - $ref: '#/components/parameters/IngestFilters-FilterQuery'
      responses:
        '200':
          description: Drop filters queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestFilters-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/ingest/routes/{type}:
    post:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      summary: Create an ingest route.
      description: '> **Beta — schema may still change; breaking changes are coordinated with affected customers. Suitable for evaluation, not production reliance.**


        Creates an ingest route. The destination ID must be the ID of a source

        dataset whose type matches the `type` path parameter. Returns the created

        route.

        '
      operationId: CreateIngestRoute
      tags:
      - Ingest Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRoutes-CreateRequest'
      parameters:
      - $ref: '#/components/parameters/IngestRoutes-Type'
      responses:
        '201':
          description: Ingest route created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRoutes-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      summary: List ingest routes
      description: '> **Beta — schema may still change; breaking changes are coordinated with affected customers. Suitable for evaluation, not production reliance.**


        List ingest routes for a type. Routes are returned in priority order: the

        route at index 0 is matched against incoming data first, index 1 is

        evaluated next if the first did not match, and so on. The type''s default

        route is always last, and matches anything the others did not.


        Disabled routes are included in the response but are skipped during

        matching. This endpoint is not paginated; it returns every route for the

        type, and `meta.totalCount` is that count.

        '
      operationId: ListIngestRoutes
      tags:
      - Ingest Routes
      parameters:
      - $ref: '#/components/parameters/IngestRoutes-Type'
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Ingest routes queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRoutes-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    patch:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      summary: Update ingest route priorities
      description: '> **Beta — schema may still change; breaking changes are coordinated with affected customers. Suitable for evaluation, not production reliance.**


        Reorder the ingest routes for a type. Send an ordered list of route IDs

        that sets the new priority order. The list must contain every route ID for

        the type, with no duplicates and no other IDs.


        Returns all routes for the type in the new priority order.

        '
      operationId: UpdateIngestRoutePriorities
      tags:
      - Ingest Routes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRoutes-UpdatePriorityRequest'
      parameters:
      - $ref: '#/components/parameters/IngestRoutes-Type'
      responses:
        '200':
          description: Ingest route priorities updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRoutes-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/ingest/tokens:
    post:
      summary: Create an ingest token
      description: 'Creates an ingest token. The secret is returned exactly once in the response

        and cannot be retrieved again.


        **Quota:** A customer can hold at most a fixed number of ingest tokens

        (default 5000). Exceeding this returns `403` with type `quota_exceeded`.

        Contact Observe support to raise the cap.

        '
      operationId: CreateIngestToken
      tags:
      - Ingest Tokens
      parameters:
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestToken-CreateRequest'
      responses:
        '201':
          description: Ingest token created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestToken-CreateResponse'
