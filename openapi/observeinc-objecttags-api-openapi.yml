servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
security:
- bearerAuth: []
tags:
- name: ObjectTags
  x-displayName: Object Tag
  description: Search for object tags on objects such as dashboards, datasets, worksheets, etc.
paths:
  /v1/object-tags/search:
    get:
      summary: Search object tag keys
      description: 'Returns unique tag keys used across objects such as dashboards, datasets, worksheets, etc.

        Results are sorted by object count (descending), then alphabetically.

        Filter performs case-insensitive substring matching.'
      operationId: SearchObjectTagKeys
      tags:
      - ObjectTags
      parameters:
      - name: filter
        in: query
        description: Filter keys to those containing this substring (case-insensitive)
        schema:
          type: string
          maxLength: 256
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Tag keys retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectTagKeys-SearchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
  /v1/object-tags/search/{key}:
    get:
      summary: Search values for an object tag key
      description: 'Returns unique values for a specific tag key across objects such as dashboards, datasets, worksheets, etc.

        Results are sorted by object count (descending), then alphabetically.

        Filter performs case-insensitive substring matching.'
      operationId: SearchObjectTagValues
      tags:
      - ObjectTags
      parameters:
      - name: key
        in: path
        required: true
        description: The tag key to get values for
        schema:
          type: string
          maxLength: 256
        example: environment
      - name: filter
        in: query
        description: Filter values to those containing this substring (case-insensitive)
        schema:
          type: string
          maxLength: 256
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Tag values retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectTagValues-SearchResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
components:
  schemas:
    ObjectTagKeys-SearchResponse:
      title: ObjectTagKeysSearchResponse
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTagKey'
          description: Unique tag keys with counts, sorted by count descending then alphabetically
          example:
          - key: environment
            count: 42
          - key: team
            count: 15
    ObjectTagKey:
      title: ObjectTagKey
      type: object
      required:
      - key
      - count
      properties:
        key:
          type: string
          description: The tag key
        count:
          type: integer
          format: int64
          description: Number of objects with this tag key
    ObjectTagValue:
      title: ObjectTagValue
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
          description: The tag value
        count:
          type: integer
          format: int64
          description: Number of objects with this tag key-value pair
    ErrorMessage:
      type: object
      properties:
        type:
          type: string
          description: A stable, machine-readable identifier for the kind of error.
        message:
          type: string
          description: Error message
      required:
      - type
      - message
    ObjectTagValues-SearchResponse:
      title: ObjectTagValuesSearchResponse
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ObjectTagValue'
          description: Unique values with counts, sorted by count descending then alphabetically
          example:
          - value: production
            count: 25
          - value: staging
            count: 10
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return in the response
      schema:
        type: integer
        format: int64
  responses:
    ErrorResponse-400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-5XX:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-429:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
