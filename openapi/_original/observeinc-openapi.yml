  /v1/datasets/stats:
    get:
      summary: Get dataset attribute statistics
      description: 'Returns aggregated statistics — distinct value count and the top-K

        most frequent value/count pairs — for one or more dataset

        attributes, optionally restricted to a CEL-filtered subset of

        datasets.


        Each `attributes` entry is a CEL expression that produces a

        comparable value (string, int, bool, timestamp); compound

        expressions are allowed (`coalesce(_package, label)`). The CEL

        environment matches `GET /v1/datasets`; see that endpoint''s

        description for the field mapping, type discrepancies, and

        available functions.


        Each `multiValueAttributes` entry is a CEL expression that produces

        a `list<comparable>`; the list is flattened across all matching

        datasets and counted as **total occurrences**, so a single

        dataset whose expression evaluates to a 3-element list

        contributes 3 increments. `multiValueAttributes` `count` values may

        therefore exceed `meta.filteredDatasets`. For `attributes` the

        count is unchanged: the number of *datasets* with that value.


        At least one of `attributes` or `multiValueAttributes` must be

        non-empty; passing neither returns 400.


        Stat values are returned as JSON strings regardless of the

        expression''s CEL type:


        - `string` — verbatim.

        - `int` — decimal digits (e.g. `"41000234"`).

        - `bool` — `"true"` or `"false"`.

        - `timestamp` — RFC 3339 (e.g. `"2024-01-01T00:00:00Z"`).


        The response `meta` block reports `totalDatasets` (before the

        filter) and `filteredDatasets` (after) so callers can compute

        coverage.

        '
      operationId: GetDatasetStats
      tags:
      - Dataset
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: 'CEL expression restricting which datasets contribute to the

          statistics. Must evaluate to `bool`. Must be URL-encoded.

          If omitted, statistics are computed across all readable

          datasets. See `GET /v1/datasets` for the CEL primer and

          filter examples.

          '
      - in: query
        name: attributes
        schema:
          type: string
        required: false
        description: 'CSV list of CEL expressions, each producing a comparable

          value (string, int, bool, timestamp). Each expression

          identifies one stat to compute over the filtered dataset

          set. Maximum 10 expressions per request. See the operation

          description for the wire format of stat values.


          Either `attributes` or `multiValueAttributes` must be non-empty;

          both may be supplied together.


          CSV-escape first, then URL-encode. Wrap an item in `"` if it

          contains a comma or `"`; double a literal `"` to `""` inside

          a quoted item.

          '
      - in: query
        name: multiValueAttributes
        schema:
          type: string
        required: false
        description: 'CSV list of CEL expressions, each producing a `list<comparable>`

          (e.g. `interfaces.map(i, i.path)`, `correlationTags.map(t, t.tag)`,

          `primaryKey`, `fieldList.map(f, f.name)`). For each matching

          dataset, the expression''s list is flattened into a per-expression

          bag and counts are total occurrences — a single dataset

          contributes one increment per element. The flattened bag for

          each expression is capped at 10,000 values across all matching

          datasets; exceeding the cap returns 400.


          Maximum 10 expressions. Either `attributes` or `multiValueAttributes`

          must be non-empty; both may be supplied together. `topK`

          applies independently to each entry of either array.


          CSV-escape first, then URL-encode. Wrap an item in `"` if it

          contains a comma or `"`; double a literal `"` to `""` inside

          a quoted item.

          '
      - in: query
        name: topK
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        required: true
        description: 'Number of top values to return per attribute, sorted by count

          descending. Range 1–100. The total distinct count for each

          attribute is always reported via `distinctCount`, even when it

          exceeds `topK`.

          '
      responses:
        '200':
          description: Dataset statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset-StatsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/monitors/stats:
    get:
      summary: Get monitor attribute statistics
      description: "Counts monitors by one or more fields. No monitors are returned. Each\nentry in `attributes` is a field to group by, and the response carries one\nblock per entry: that field's distinct-value count, and its most frequent\nvalues with a count each. Grouping by `health` answers \"how many monitors\nare in each health state\".\n\nFields are the ones `GET /v1/monitors` lists under `filter`, written the\nsame way. An entry may also be a CEL expression over them, for buckets no\nsingle field provides: `aiTriagingMode == \"Triage\"` gives `\"true\"` and\n`\"false\"` rather than one bucket per stored mode. The expression must yield\none scalar per monitor — that value becomes the bucket key — so a list or\nobject is rejected with `400`.\n\nKeys come back as JSON strings whatever the field's type: numbers as\ndecimal digits, bools as `\"true\"` or `\"false\"`, timestamps as RFC 3339.\n\n`meta` reports `totalMonitors` (before the filter) and `filteredMonitors`\n(after).\n\nFor\
        \ example, facet counts for the list's Health and Type columns:\n\n```\nGET /v1/monitors/stats?attributes=health,ruleKind&topK=10\n```\n\nThe AI column's two buckets, over enabled monitors only. Both values hold\nquotes, so both are CSV-escaped — inner `\"` doubled, the item wrapped —\nthen URL-encoded:\n\n```\nGET /v1/monitors/stats\n  ?attributes=\"aiTriagingMode == \"\"Triage\"\"\"\n  &filter=disabled == false\n```\n"
      operationId: GetMonitorStats
      tags:
      - Monitor
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: 'CEL expression restricting which monitors contribute to the

          statistics. Must evaluate to `bool`. Must be URL-encoded. If omitted,

          statistics cover every monitor the caller may read. See

          `GET /v1/monitors` for the field list and examples.

          '
      - in: query
        name: attributes
        schema:
          type: string
        required: true
        description: 'Comma-separated list of the fields to group by — a field name from

          the `GET /v1/monitors` `filter` table, or a CEL expression over those

          fields. One statistic is computed per entry. Maximum 20 entries; an

          empty list returns `400`.


          Because an expression may itself contain a comma or a quote, the list

          is CSV: wrap an entry in `"` if it holds either, and double any

          literal `"` inside a wrapped entry. CSV-escape first, URL-encode

          second. A bare field name needs neither, so the common case is just

          `attributes=health,ruleKind`.

          '
      - in: query
        name: topK
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        required: true
        description: 'Number of top values to return per attribute, sorted by count

          descending. Range 1–100. Each attribute''s total distinct count is

          reported in `distinctCount` regardless, so a caller can tell when

          values were left out.

          '
      responses:
        '200':
          description: Monitor statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor-StatsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/alerts:
    get:
      summary: List alerts
      description: 'List monitor alerts, optionally filtering and sorting the response.

        Filters are specified in the [CEL query language](https://cel.dev).

        Supported orderBy fields: id, level, status, start, monitor.id, monitor.label.

        Time scoping can be provided in two ways (mutually exclusive):

        - startTime/endTime: a time range. Alerts overlapping this range are returned. Defaults to the last 24 hours.

        - activeAt: a single timestamp. Returns alerts that were active at that moment.

        If both activeAt and startTime/endTime are provided, returns 400.

        Default page size is 200, maximum is 1000.

        '
      operationId: ListAlerts
      tags:
      - Alert
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: "Filter that response alerts must match. Specified in CEL format.\nNote that filter expressions must be URL encoded.\n\nSupported filter fields:\n- `id` (string): unique alert identifier\n- `level` (string): one of `Critical`, `Error`, `Warning`, `Informational`, `NoData`, `None`\n- `status` (string): one of `Active`, `Ended`, `Retracted`\n- `monitor.id` (int): ID of the monitor that generated the alert\n- `monitor.label` (string): display label of the monitor (supports `.contains()`, `.startsWith()`, `.endsWith()`, and `.lowerAscii()` for case-insensitive matching)\n- `muted` (bool): whether the alert is muted (`true` / `false`)\n- `hasAiChat` (bool): whether an AI investigation exists for the alert. Tied to a feature under development, and rejected as an unknown field where that feature is not enabled.\n- `context.<key>` (string): context value by key, where `<key>` is a GroupBy column name from the monitor definition. Supports `.contains()`, `.startsWith()`, `.endsWith()`.\n\
          \  Dot notation reads a key that is a bare identifier (`context.host`); index notation reaches any key, including one carrying a space, hyphen or dot (`context[\"pod name\"]`, `context[\"k8s.pod.name\"]`). A correlation-tag grouping is keyed by its tag prefixed with `#` (`context[\"#deployment.environment.name\"]`). Only reading a key is supported: `in`, `has()` and macros such as `exists()` over `context` are rejected.\n"
        examples:
          filterByMuted:
            summary: Filter for muted alerts only
            value: muted == true
          filterByLevel:
            summary: Filter for critical alerts
            value: level == "Critical"
          filterByMonitorLabel:
            summary: Filter for alerts from monitors whose label contains "CPU"
            value: monitor.label.contains("CPU")
          filterByStatusAndLevel:
            summary: Filter for active warning or critical alerts
            value: status == "Active" && (level == "Critical" || level == "Warning")
          filterByContext:
            summary: Filter for alerts where the context host is a specific value
            value: context.host == "web-server-01"
          filterByContextContains:
            summary: Filter for alerts where a context field contains a substring
            value: context.host.contains("prod")
          filterByContextStartsWith:
            summary: Filter for alerts where a context field starts with a prefix
            value: context.region.startsWith("us-")
          filterByContextEndsWith:
            summary: Filter for alerts where a context field ends with a suffix
            value: context.env.endsWith("-staging")
          filterByContextIndexKey:
            summary: Filter on a context key that is not a bare identifier
            value: context["k8s.pod.name"] == "checkout-7f9c"
      - in: query
        name: orderBy
        schema:
          type: string
        required: false
        description: 'A comma-separated list of field expressions to sort by.

          Prefix a field with - for descending order (default is ascending).

          Default sort is by start time, descending.

          '
        examples:
          sortByStart:
            summary: Sort by start time, descending
            value: -start
          sortByLevel:
            summary: Sort by level ascending, then start descending
            value: level,-start
      - in: query
        name: startTime
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'Start of the time range to query. Alerts that overlap this range are returned

          (i.e., alerts whose end time is after startTime, or that are still active).

          Defaults to 24 hours ago if not provided.

          '
      - in: query
        name: endTime
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'End of the time range to query. Alerts whose start time is before endTime are returned.

          Defaults to current time if not provided.

          '
      - in: query
        name: activeAt
        schema:
          $ref: '#/components/schemas/Time'
        required: false
        description: 'A single timestamp to query alerts that were active at that moment.

          Returns alerts where start <= activeAt and (end >= activeAt or the alert is still active).

          Mutually exclusive with startTime and endTime — if both are provided, returns 400.

          '
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/ExpandParam'
      - in: query
        name: includeFacets
        schema:
          type: boolean
        required: false
        description: 'When true, the response includes faceted counts for key alert attributes,

          computed over all alerts in the requested time window. These counts ignore

          any `filter`, `orderBy`, `offset`, or `limit` parameters, making them

          suitable for building filter panels.

          '
      responses:
        '200':
          description: Alerts queried successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
