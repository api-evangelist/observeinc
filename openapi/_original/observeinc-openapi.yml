    delete:
      summary: Delete a MonitorV2
      operationId: deleteMonitor
      tags:
      - Monitor
      parameters:
      - name: id
        required: true
        schema:
          type: integer
        in: path
        description: The Monitor object id
      responses:
        '204':
          description: The object was deleted
        '400':
          description: Invalid request
    get:
      x-badges:
      - name: alpha
        position: before
        color: '#FF6600'
      summary: Get a monitor
      description: '> **⚠️ Alpha — the versioned response is under active development and

        > may change without notice. The default response is stable.**


        Returns one monitor in full: what `GET /v1/monitors` returns for it,

        plus the query and rules that define it.


        The `Observe-Api-Version` header picks one of two response shapes.


        **Default (no header).** The long-standing body — `id`, `name`,

        `description`, `disabled`, `health`, `ruleKind`, `monitorVersion`,

        `definition`, `actionRules` and `effectiveScheduling` — which does not

        change. The schema on this page describes the versioned shape, not this

        one.


        **Versioned.** `Observe-Api-Version: 2026-10-06` or later returns the

        `Monitor-Resource` below, which matches the list: the list''s audit and

        health fields, durations in seconds, and no `definition` wrapper. It is rolling out

        account by account; until it

        reaches yours, the header returns `403`. An earlier or unparseable date

        returns the default shape.


        Only `GET` has the versioned shape so far. `PATCH` and `DELETE` ignore the

        header, so a versioned `GET` body cannot yet be sent back as-is.

        '
      operationId: GetMonitor
      tags:
      - Monitor
      parameters:
      - $ref: '#/components/parameters/Monitor-Id'
      - name: expand
        in: query
        description: 'When `true`, populates `label` on the `createdBy` and `updatedBy` references, and `record` on each `actions[].action`, including `label` on an email action''s `users`.

          '
        schema:
          type: boolean
        required: false
      - name: Observe-Api-Version
        in: header
        description: 'Picks the response shape by release date (YYYY-MM-DD). `2026-10-06` or later returns `Monitor-Resource`, if enabled for your account (otherwise `403`). No header, or an earlier or unparseable date, returns the default shape described above.

          '
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: false
      responses:
        '200':
          description: The monitor
          headers:
            Observe-Api-Version:
              schema:
                type: string
              description: The version this response was resolved against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    patch:
      summary: Update a MonitorV2
      description: 'Partially updates a monitor. Only **PATCH** is supported for this URL.


        **Top-level merge:** The server reads the current monitor, then for each of these

        properties—`name`, `disabled`, `description`, `ruleKind`, `definition`, `actionRules`—uses

        the request value if the key is present in the body, otherwise keeps the stored value.

        Keys omitted from the body do not change.


        **Replace entire subtrees:** If `definition` or `actionRules` appears in the body, it

        **replaces the whole** stored `definition` or `actionRules` value. The server does **not**

        deep-merge inside `definition`, inside individual action rules, or inside nested structures

        (for example an action rule’s `definition`). To change part of the monitor definition or

        action configuration, send the complete `definition` and/or full `actionRules` array you want

        saved.


        **Action rules:** when a rule''s `definition.inline` is `true` the action belongs to this

        monitor, and sending the rule back updates that action in place, keeping its `actionId`.

        To rotate a PagerDuty `routing_key`, which sits in `definition.webhook.body`, GET the

        monitor, edit the key, and PATCH `actionRules` back. A rule pointing at a shared action

        (`definition.inline` is `false`) is bound by `actionId` alone; change a shared action''s

        payload on the action itself.


        **Not controlled by the body:** Other monitor fields (such as `id` from the path, or

        `monitorVersion`) are not updated from this JSON body using the merge rules above.


        **Extra properties:** Any other top-level JSON properties in the body are ignored for this

        merge (they are not written to the monitor).

        '
      operationId: updateMonitor
      tags:
      - Monitor
      parameters:
      - name: id
        required: true
        schema:
          type: integer
        in: path
        description: The Monitor object id
      requestBody:
        description: 'Any subset of patchable fields. Omitted keys among

          `name`, `disabled`, `description`, `ruleKind`, `definition`, and `actionRules` leave the

          corresponding stored values unchanged. When `definition` or `actionRules` is sent, it must

          be the full replacement value for that field.

          '
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorV2PatchRequest'
      responses:
        '204':
          description: 'The object was updated

            '
        '400':
          description: Invalid request
        '404':
          description: The object was not found
