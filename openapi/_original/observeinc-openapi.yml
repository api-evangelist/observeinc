  /v1/monitors:
    post:
      summary: Create a new MonitorV2 and bind to actions
      description: 'Creates a monitor. The `201` body is the default shape of `GET /v1/monitors/{id}`, not `Monitor-Resource`: this endpoint ignores `Observe-Api-Version`.

        '
      operationId: createMonitor
      tags:
      - Monitor
      requestBody:
        description: The MonitorV2 to create
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorV2'
      responses:
        '201':
          description: The monitor was created
          headers:
            Location:
              schema:
                type: string
              description: The URI to the newly created monitor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorV2'
        '400':
          description: Invalid request
    get:
      summary: List monitors
      description: 'This operation has two response shapes, chosen per request by the

        `Observe-Api-Version` header.


        **Default — stable.** Omit the header and the response is a plain JSON

        array of monitors. This is the long-standing behaviour that existing

        callers receive, and it does not change. It is summarised here rather

        than fully specified: the parameters and the response schema documented

        on this page describe the versioned shape.


        **Versioned — rolling out.** Send

        `Observe-Api-Version: 2026-08-04` (or later) to get the paginated

        `{monitors, meta}` envelope specified below, with CEL `filter`,

        `limit`/`offset` paging, `orderBy` and `expand`. This shape is being

        rolled out account by account; until it reaches your account, sending

        the header returns `403`. An earlier or unparseable date selects the

        default shape instead.

        '
      operationId: ListMonitors
      tags:
      - Monitor
      parameters:
      - name: filter
        in: query
        description: 'CEL expression that returned monitors must match. Must evaluate to

          `bool`, and must be URL-encoded.


          Only the fields below are filterable. An expression that fails to

          compile, or that references anything outside this table, is rejected

          with `400`; the field set is fixed, so retrying with a different

          spelling will not succeed. `createdBy.name` is a common example of a

          reference that is rejected — only `.id` is exposed on a user.


          | Field | CEL type | Notes |

          |-------|----------|-------|

          | `id` | `int` | Compare unquoted, even though `id` serializes as a string in JSON. The default ordering. |

          | `name` | `string` | Supports `matches()` for an RE2 regex. |

          | `label` | `string` | Deprecated alias of `name`. |

          | `description` | `string` | Supports `matches()`. Compare against `""` for "no description" — the response renders it as `null`, but the filter sees the empty string. |

          | `disabled` | `bool` | Turned off by a user, or by a limit. |

          | `ruleKind` | `string` | A `MonitorRuleKind` value, e.g. `"Threshold"`. |

          | `aiTriagingMode` | `string` | A `MonitorAiTriagingMode` value. `"Triage"` is the enabled state the list''s AI auto-investigate column shows. |

          | `createdAt` | `timestamp` | Use `timestamp("2026-01-01T00:00:00Z")` to compare. |

          | `updatedAt` | `timestamp` | |

          | `createdBy.id` | `int` | Id of the creating user. |

          | `updatedBy.id` | `int` | Id of the last user to update it. |

          | `managedBy.id` | `int` | Id of the managing app. Null when no app manages it. |

          | `managed` | `bool` | Whether an app manages this monitor. `managed == false` selects the user-managed monitors, which `managedBy.id == null` cannot express. |

          | `scheduled` | `bool` | Whether it runs on its own schedule. |

          | `disabledCause` | `string` | A `MonitorDisabledCause` value, e.g. `"AlertRateLimit"`. Null while enabled. |

          | `governorState` | `string` | A `MonitorGovernorState` value: `"Normal"`, `"GracePeriod"` or `"CostDisabled"`. Null when no spend limit is configured. |

          | `rollupStatus` | `string` | A `MonitorRollupStatus` value: the outcome of the monitor''s own last run. Not every documented value is reachable — see the note below. |

          | `health` | `string` | A `MonitorHealth` value: one rollup of run outcome, disabled cause, spend-limit state and cluster failover state. This is the value the list''s Health column shows. Not every documented value is reachable — see the note below. |

          | `alertState` | `string` | A `MonitorAlertState` value: `"Triggering"`, `"Previous"` or `"Never"`. |

          | `muteState` | `string` | A `MonitorMuteState` value. |

          | `muteCount` | `int` | Number of mute rules covering the monitor; `0` when unmuted. |

          | `mutedUntil` | `timestamp` | Null when not muted, or muted indefinitely. |

          | `lastAlarmTime` | `timestamp` | Null if it has never alerted. |

          | `lastErrorTime` | `timestamp` | Null if it has never logged a fatal error. |

          | `lastWarnTime` | `timestamp` | Null if it has never warned. |


          Comparisons combine with `&&` and `||`. A nullable field is compared

          with `== null` / `!= null`; write the field on the left, since

          `null == lastAlarmTime` is not recognised as a null check.


          When `filter` is used together with the deprecated `nameExact` or

          `nameSubstring` parameters, every condition must match.

          '
        schema:
          type: string
        required: false
        examples:
          regexOnName:
            summary: Regex match on the monitor name
            value: name.matches("checkout.*")
          enumAndBool:
            summary: Enum and boolean fields combined
            value: ruleKind == "Threshold" && disabled == false
          byCreator:
            summary: Integer field — `createdBy.id` is unquoted in CEL
            value: createdBy.id == 40000123
          healthAndMute:
            summary: Failing and not silenced
            value: rollupStatus == "Failed" && muteState == "NotMuted"
          neverAlerted:
            summary: Null check — write the field on the left
            value: lastAlarmTime == null
          userManaged:
            summary: Not managed by an app
            value: managed == false
          costLimited:
            summary: Over its cost budget
            value: governorState == "CostDisabled"
      - name: expand
        in: query
        description: 'When `true`, populates `label` on the `createdBy` and `updatedBy` references.

          '
        schema:
          type: boolean
        required: false
      - name: limit
        in: query
        description: Maximum number of results to return. Defaults to 200, max 1000.
        schema:
          type: integer
          format: int64
          default: 200
          minimum: 1
          maximum: 1000
        required: false
      - name: offset
        in: query
        description: Number of results to skip for pagination. Defaults to 0.
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
        required: false
      - name: orderBy
        in: query
        description: 'Comma-separated fields to order by, each optionally prefixed with `-`

          for descending. Defaults to `id`.


          Orderable fields: `id`, `name` (or its deprecated alias `label`),

          `description`, `ruleKind`,

          `disabled`, `createdAt`, `updatedAt`, `createdBy`, `updatedBy`,

          `managedBy`, `scheduled`, `muteState`, `rollupStatus`, `health`,

          `alertState`, `aiTriagingMode`, `lastAlarmTime`, `lastErrorTime`,

          `lastWarnTime`. Anything else is

          rejected with `400` — this list is narrower than the filterable

          fields, so check it rather than assuming a filterable field can also

          be sorted on.


          `health` and `alertState` sort by severity, not alphabetically.

          `id` is appended as a final tiebreak so paging is deterministic.

          '
        schema:
          type: string
        required: false
        examples:
          mostRecentlyAlerted:
            summary: Most recently alerting first
            value: -lastAlarmTime
          byLabel:
            summary: Two keys
            value: ruleKind,-label
      - name: nameExact
        in: query
        deprecated: true
        description: 'Deprecated since API version 2026-08-04: use `filter` with `label == "..."` instead. Retained for backward compatibility; limits results to an exact match on the monitor label. When combined with `filter`, both conditions must match.

          '
        schema:
          type: string
        required: false
      - name: nameSubstring
        in: query
        deprecated: true
        description: 'Deprecated since API version 2026-08-04: use `filter` with `label.matches("...")` instead. Retained for backward compatibility; limits results to a case-insensitive substring match on the monitor label. When combined with `filter`, both conditions must match.

          '
        schema:
          type: string
        required: false
      - name: Observe-Api-Version
        in: header
        description: 'Selects the response shape by release date (YYYY-MM-DD). A date on or after `2026-08-04` returns the `{monitors, meta}` envelope documented below, and requires that shape to be enabled for your account (otherwise `403`). Omitting the header returns the legacy bare-array response, as does an earlier or unparseable date. The no-header default never changes.

          '
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: false
      responses:
        '200':
          description: Monitors listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
