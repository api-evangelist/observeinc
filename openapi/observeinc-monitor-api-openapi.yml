          description: 'Cost-governor state. Null when no spend limit is configured for the monitor, which is the common case. `health` already folds this in; read it directly only to distinguish "no limit" from `Normal`.

            '
        alertState:
          $ref: '#/components/schemas/Monitor-AlertState'
        aiTriagingMode:
          anyOf:
          - $ref: '#/components/schemas/Monitor-AiTriagingMode'
          - type: 'null'
          description: 'Whether AI auto-investigation runs when this monitor alerts. Null when the stored mode is not one this API declares. Not reported as `None`, because the filter compares the stored value and `aiTriagingMode == "None"` would not select these rows.

            '
        muteState:
          $ref: '#/components/schemas/Monitor-MuteState'
