      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    DatasetQueryFilter-UpdateRequest:
      title: DatasetQueryFilterUpdateRequest
      type: object
      properties:
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type:
          - string
          - 'null'
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. When updating a filter''s semantics, a request may provide either `filter` or `pipeline`, but not both.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            When updating a filter''s semantics, a request may provide either `filter` or `pipeline`, but not both. `pipeline` is preferred, as `filter` may be removed in a future API version.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
        startTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type:
          - string
          - 'null'
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
    User:
      title: User
      type: object
      required:
      - id
      properties:
        id:
          title: User Identifier
          $ref: '#/components/schemas/ObjectId'
        label:
          title: User Label
          type: string
        timezone:
          type: string
        locale:
          type: string
    DatasetQueryFilter-Resource:
      title: DatasetQueryFilter
      type: object
      required:
      - id
      - label
      - filter
      - pipeline
      - disabled
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. When creating or updating a filter, clients must provide exactly one of `filter` or `pipeline`.

            API responses always include both `filter` and `pipeline`; clients should consume `pipeline`.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            When creating or updating a filter, clients must provide exactly one of `filter` or `pipeline`.

            API responses always include both `filter` and `pipeline`; clients should consume `pipeline`.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
        errors:
          type: array
          items:
            type: string
          description: List of error messages if the filter has issues (omitted if no errors)
        createdBy:
          $ref: '#/components/schemas/User'
          description: User who created the filter
        createdAt:
          type: string
          format: date-time
          description: When the filter was created
        updatedBy:
          $ref: '#/components/schemas/User'
          description: User who last updated the filter
        updatedAt:
          type: string
          format: date-time
          description: When the filter was last updated
        startTime:
          type: string
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type: string
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type: string
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
    ErrorMessage:
      type: object
      properties:
        type:
          type: string
          description: A stable, machine-readable identifier for the kind of error.
        message:
          type: string
          description: Error message
      required:
      - type
      - message
    DatasetQueryFilter-CreateRequest:
      title: DatasetQueryFilterCreateRequest
      type: object
      required:
      - label
      properties:
        label:
          type: string
          description: Human-readable name for the filter
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Long-form description of the filter
        filter:
          type: string
          description: 'Legacy OPAL boolean expression string for the filter predicate (without the leading `filter` verb).


            Deprecated in favor of `pipeline` and may be removed in a future API version. Exactly one of `filter` or `pipeline` must be provided when creating a filter.

            '
          minLength: 1
        pipeline:
          type: string
          description: 'Canonical OPAL pipeline snippet for the filter. May contain only filter verbs (and comments).


            Exactly one of `filter` or `pipeline` must be provided when creating a filter. `pipeline` is preferred for new integrations, as `filter` may be removed in a future API version.

            '
          minLength: 1
        disabled:
          type: boolean
          description: Whether the filter is disabled by the user
          default: false
        startTime:
          type: string
          format: date-time
          description: Activation window start time (inclusive). If omitted, the filter applies from negative infinity (unbounded from the past).
        endTime:
          type: string
          format: date-time
          description: Activation window end time (exclusive). If omitted, the filter applies to positive infinity (unbounded to the future).
        layout:
          type: string
          description: UI layout/metadata for the filter builder. This field is used by the Observe UI and should be omitted by other clients.
