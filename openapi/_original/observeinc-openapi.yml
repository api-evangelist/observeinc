          description: Invalid request.
  /v1/tags:
    get:
      summary: List tags
      description: "Returns a paginated list of tags (both correlation and metric kinds)\ndefined across the tenant's datasets. Each entry groups all per-dataset\ndefinitions of a single `(name, kind)` pair.\n\nUse `GET /v1/tags/values` to search tag *values*.\n\n## Filtering and ordering with CEL\n\nThe `filter` and `orderBy` query parameters are evaluated as\n[Common Expression Language (CEL)](https://cel.dev) expressions over\neach tag in the response.\n\n### Available CEL fields\n\n- `name` (string) — tag name; supports `.matches(\"regex\")`\n- `kind` (string) — `\"Correlation\"` or `\"Metric\"`\n- `datasetCount` (int) — number of distinct datasets defining the tag\n- `mappings` (list) — per-dataset definitions; supports `.exists(m, ...)`\n  quantifier. Each `m` exposes:\n    - `m.dataset.id` (int) — dataset id\n    - `m.dataset.label` (string) — dataset label (available without\n      `expand`); matches the `dataset.record.label` returned in the body\n    - `m.path.field` (string)\n\
        \    - `m.path.path` (string)\n    - `m.origin.id` (int, null for Metric) — dataset where the mapping\n      was originally declared. Equals `m.dataset.id` when declared\n      directly on that dataset; differs when inherited from upstream.\n    - `m.origin.label` (string, null for Metric) — label of the origin\n      dataset; guard with `m.origin != null` before accessing.\n    - `m.createdBy.id` (int, null for Metric)\n\n### Available CEL functions\n\nThe tag CEL environment registers the [CEL standard\ndefinitions](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#StdLib)\n(operators, `in`, `?:`, `size()`, `string.contains`, `string.startsWith`,\n`string.endsWith`, `matches`, etc.) plus the following extension\nlibraries from\n[cel-go v0.28.0](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext):\n\n- [`ext.Strings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Strings) — `charAt`, `indexOf`, `join`, `lowerAscii`, `replace`, `split`, `substring`, `trim`, `upperAscii`,\
        \ `format`\n- [`ext.Lists`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Lists) — `lists.flatten`, `lists.range`, `lists.slice`\n- [`ext.Math`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Math) — `math.greatest`, `math.least`\n- [`ext.Sets`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Sets) — `sets.contains`, `sets.equivalent`, `sets.intersects`\n- [`ext.Regex`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Regex) — `re.capture`, `re.extract`\n- [`ext.Encoders`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Encoders) — `base64.encode`, `base64.decode`\n- [`ext.Bindings`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Bindings) — `cel.bind` for let-binding sub-expressions\n- [`ext.Protos`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/ext#Protos) — protobuf helpers\n- [`cel.OptionalTypes`](https://pkg.go.dev/github.com/google/cel-go@v0.28.0/cel#OptionalTypes) — `optional.of`, `optional.ofNonZero`, `optional.none`\n\
        \n### Defaults\n\n- Default page size: 50; maximum: 100.\n- Default order: `kind` ascending, then `name` ascending.\n\nSet `expand=true` to inline the `dataset.record` brief (label,\ndescription, iconUrl, contentType) on every dataset reference.\n\nSet `sampleValues=true` to attach a bounded sample of each tag's\nvalues (see the `sampleValues` parameter).\n"
      operationId: ListDatasetTags
      tags:
      - Tags
      parameters:
      - name: filter
        in: query
        required: false
        description: 'CEL expression that response tags must match. Must evaluate to

          `bool`. Must be URL-encoded. See the operation description for

          available fields.

          '
        schema:
          type: string
        examples:
          byNameRegex:
            summary: Tags whose name matches a regex
            value: name.matches("^env.*")
          byExactName:
            summary: Tags with an exact name
            value: name == "service"
          correlationOnDataset:
            summary: Correlation tags defined on dataset 41000123
            value: kind == "Correlation" && mappings.exists(m, m.dataset.id == 41000123)
          anyTagOnDataset:
            summary: Any tag (either kind) defined on a particular dataset
            value: mappings.exists(m, m.dataset.id == 41000123)
          byDatasetNameSubstring:
            summary: Tags whose dataset name contains a substring (case-insensitive)
            value: mappings.exists(m, m.dataset.label.lowerAscii().contains("orders"))
          byDatasetNameRegex:
            summary: Tags on datasets whose name matches a regex
            value: mappings.exists(m, m.dataset.label.matches("(?i)^orders"))
          declaredDirectly:
            summary: Correlation tags declared directly on a dataset (not inherited)
            value: kind == "Correlation" && mappings.exists(m, m.origin != null && m.origin.id == m.dataset.id)
          inheritedFromUpstream:
            summary: Correlation tags inherited from a different upstream dataset
            value: kind == "Correlation" && mappings.exists(m, m.origin != null && m.origin.id != m.dataset.id)
          inheritedFromSpecificDataset:
            summary: Correlation tags inherited specifically from dataset 41000999
            value: mappings.exists(m, m.origin != null && m.origin.id == 41000999 && m.dataset.id != 41000999)
      - name: orderBy
        in: query
        required: false
        description: 'CSV CEL expressions; default `kind,name`. Prefix an item with `-`

          for descending. Supported expressions evaluate to comparable values

          (e.g. `name`, `kind`, `datasetCount`).

          '
        schema:
          type: string
        example: kind,name
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/ExpandParam'
      - name: sampleValues
        in: query
        required: false
        description: 'When `true`, each returned tag includes up to 20 sample values in

          `sampleValues`. This is a bounded, non-paginated sample, NOT the

          full value set. Sampling is best-effort: `sampleValues` may be

          empty or absent for a tag whose values could not be retrieved.

          Use `GET /v1/tags/values` to search across tag values.

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Tags retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
  /v1/ingest/filters/filterable-datasets:
    get:
      summary: List datasets eligible for drop filtering
