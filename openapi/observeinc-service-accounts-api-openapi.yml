components:
  parameters:
    ExpandParam:
      name: expand
      in: query
      description: Whether to expand resources referenced in the response to include additional fields
      schema:
        type: boolean
  schemas:
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    RbacGroupRef:
      title: RbacGroupRef
      description: Reference to an RBAC group, including id, label, and description.
      type: object
      required:
      - id
      - legacyId
      - label
      - description
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        legacyId:
          type: string
          description: Deprecated. For compatibility with legacy APIs.
          deprecated: true
        label:
          type: string
        description:
          type: string
    ApiTokenScope:
      type: string
      enum:
      - api:read
      - api:write
      - unscoped
    ServiceAccount-UpdateRequest:
      title: ServiceAccountUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        disabled:
          type: boolean
          description: Whether the service account is disabled. Disabling a service account will delete all of its API tokens.
        externalOAuth:
          description: The external OAuth binding for this service account. Set to null to clear the binding.
          anyOf:
          - $ref: '#/components/schemas/ServiceAccount-ExternalOAuth'
          - type: 'null'
    ApiToken-UpdateRequest:
      title: ApiTokenUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        lifetimeHours:
          type: integer
          minimum: 1
        disabled:
          type: boolean
    ObjectId:
      type: string
      format: ObjectId
    Time:
      type: string
      format: RFC3339
    User:
      title: User
      type: object
      required:
      - id
      properties:
        id:
          title: User Identifier
          $ref: '#/components/schemas/ObjectId'
        label:
          title: User Label
          type: string
        timezone:
          type: string
        locale:
          type: string
    ApiToken-CreateRequest:
      title: ApiTokenCreateRequest
      type: object
      required:
      - label
      - lifetimeHours
      properties:
        label:
          type: string
        description:
          type: string
        lifetimeHours:
          type: integer
          minimum: 1
        scopes:
          type: array
          description: Optionally constrains the token's effective permissions. An empty/omitted list leaves the token unscoped. Unknown scopes are rejected.
          items:
            $ref: '#/components/schemas/ApiTokenScope'
    ApiToken-ListResponse:
      title: ApiTokenListResponse
      type: object
      required:
      - apiTokens
      - meta
      properties:
        apiTokens:
          type: array
          items:
            $ref: '#/components/schemas/ApiToken-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    OAuthExternalIntegrationRef:
      title: OAuthExternalIntegrationRef
      type: object
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
    ServiceAccount-CreateRequest:
      title: ServiceAccountCreateRequest
      type: object
      required:
      - label
      properties:
        label:
          type: string
        description:
          type: string
        externalOAuth:
          description: The external OAuth binding to create for this service account.
          $ref: '#/components/schemas/ServiceAccount-ExternalOAuth'
    ServiceAccount-ListResponse:
      title: ServiceAccountListResponse
      type: object
      required:
      - serviceAccounts
      - meta
      properties:
        serviceAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccount-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    ServiceAccount-Resource:
      title: ServiceAccountObject
      type: object
      required:
      - id
      - label
      - description
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      - disabled
      - externalOAuth
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
        description:
