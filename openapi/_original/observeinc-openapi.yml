  /v1/apm/invocation-graph:
    get:
      x-badges:
      - name: beta
        position: before
        color: '#FFCC00'
      tags:
      - APM
      operationId: GetApmInvocationGraph
      summary: Get the APM service invocation graph
      description: "> **Beta — may change; breaking changes are coordinated with affected\n> customers. Suitable for evaluation, not production reliance.**\n\nReturns the service dependency graph for a time window: the services\nobserved and the calls between them, always scoped to a single\n`environment` (required). Which graph you get depends on the identity\nparameters you add on top of `environment`:\n- `environment` only: the full graph for that environment.\n- `+ serviceName`: the graph centered on one service.\n- `+ serviceName` + `endpointName`: centered on one endpoint of that\n  service.\n\n`services` lists every service in the graph; `invocations` lists the\ncalls between them, each from a `source` to a `target` with aggregated\nrequest, error, and latency metrics. A service that is never the\n`target` of a call is a root.\n\nWhen centered on an endpoint, `endpointName` is set on whichever side of\na call is that endpoint — `source` when the endpoint makes the call,\n`target`\
        \ when it serves the call — and is null on every other\nparticipant. Match it exactly against the value from a prior response.\n\nBy default the full graph for the scope is returned. Set\n`directNeighborsOnly=true` (with a `serviceName`) to return only the\nfocal service and the services one hop away from it. If a full graph is\nnot available for a request, it is rejected with `BadRequest` indicating\n`directNeighborsOnly=true` should be used.\n\n`serviceNamespace` is an optional additional filter that matches on\neither end of a call (a call is kept when its `source` or `target` is in\nthat namespace — a cross-namespace union). `environment`, by contrast,\nmatches on both ends: a call is kept only when both its `source` and\n`target` are in that environment.\n\nRequired parameter combinations: `environment` is always required (`400\nRequiredParamMissing` otherwise); `endpointName` and\n`directNeighborsOnly` each require a `serviceName`.\n\nThe graph is returned in a single response\
        \ and is not paginated. A\nrequest whose graph would exceed the maximum size is rejected with `413\nPayloadTooLarge` rather than truncated. Narrow the time window, or\ncenter the graph on a service or endpoint, to reduce its size.\n"
      parameters:
      - $ref: '#/components/parameters/Apm-ServiceNameParam'
      - name: environment
        in: query
        description: 'OTel deployment.environment, matched exactly. Required: the

          invocation graph is always scoped to a single environment. Omitting

          it returns `400 RequiredParamMissing`.

          '
        schema:
          type: string
      - $ref: '#/components/parameters/Apm-ServiceNamespaceParam'
      - name: endpointName
        in: query
        description: 'Name of an endpoint on the service to center the graph on, matched

          exactly. Requires `serviceName` and `environment`.

          '
        schema:
          type: string
      - name: directNeighborsOnly
        in: query
        description: 'Return only the focal service and the services directly connected

          to it (one hop away). Requires `serviceName`. Omit (the default) to

          return the full graph.

          '
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Apm-StartTimeParam'
      - $ref: '#/components/parameters/Apm-EndTimeParam'
      - name: limit
        in: query
        description: 'Not accepted on this endpoint — the dependency graph is returned in

          a single response, not a paginated list. Supplying `limit` returns

          `BadRequest`.

          '
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: 'Not accepted on this endpoint (see `limit`). Supplying `offset`

          returns `BadRequest`.

          '
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Invocation graph returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apm-InvocationGraphResponse'
        '400':
          $ref: '#/components/responses/Apm-ErrorResponse-400'
        '401':
          description: Unauthorized — missing or invalid credentials (platform auth layer; body conforms to Apm-Error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apm-Error'
        '403':
          description: Forbidden — caller lacks permission for this resource (body conforms to Apm-Error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apm-Error'
        '404':
          description: Not found — unrecognized route (body conforms to Apm-Error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apm-Error'
        '413':
          $ref: '#/components/responses/Apm-ErrorResponse-413'
        '500':
          $ref: '#/components/responses/Apm-ErrorResponse-500'
        '504':
          $ref: '#/components/responses/Apm-ErrorResponse-504'
