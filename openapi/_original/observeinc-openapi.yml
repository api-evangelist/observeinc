  /v1/meta/export/worksheet/{worksheetId}:
    post:
      summary: Export a worksheet
      operationId: exportWorksheet
      tags:
      - Export
      description: "Export data used by a worksheet.\n\nResults are limited to a maximum of 100,000 rows.\n\nResults can be returned as CSV or NDJSON.\n* Set Accept header to `text/csv` or `application/x-ndjson`\n* Default: CSV\n\n  Either two of `startTime`, `endTime`, and `interval` or `interval` alone can be specified to set the time interval. The `startTime` parameter is inclusive and the `endTime` parameter is exclusive, to prevent overlap from subsequent windows.\n\n* `interval`: An interval relative to now\n* `startTime` + `endTime`: The specified time interval\n* `startTime` **or** `endTime` + `interval`: The specified time interval relative to the provided start or end time\n"
      parameters:
      - name: worksheetId
        description: ID of the worksheet to export.
        in: path
        schema:
          type: integer
        required: true
        examples:
          A worksheet ID:
            value: '123456789'
      - name: startTime
        in: query
        description: Beginning of time window (inclusive) as ISO time.
        schema:
          type: string
        required: false
        examples:
          A start time:
            value: '2023-04-20T16:20:00Z'
      - name: endTime
        in: query
        description: End of time window (exclusive) as ISO time. Defaults to now if just `interval` is specified.
        schema:
          type: string
        required: false
        examples:
          An end time:
            value: '2023-04-20T16:30:00Z'
      - name: interval
        in: query
        description: Length of time window (if start or end is missing).
        schema:
          type: string
        required: false
        examples:
          An interval:
            value: 10m
            summary: A duration in h / m / s units
      - name: stage
        in: query
        description: Which stage to get the data from. Defaults to last stage.
        schema:
          type: string
        required: false
      responses:
        '200':
          description: '## Description of result data formats


            ### Content-type: application/x-ndjson

            The results are returned with each row represented as distinct json objects separated by newlines.

            The contents of the json object representing each row is keys representing each column in the output, with values representing the value of that that column for that row.


            ### Content-type: text/csv

            The results are returned in csv format, the first row in csv is a header row with the names of the columns.

            '
          content:
            application/x-ndjson:
              schema:
                type: string
              example: '{"BUNDLE_ID":"3729","BUNDLE_TIMESTAMP":"1695924000540747582","DATASTREAM_ID":"41000006","DATASTREAM_TOKEN_ID":"ds1thSTHMTVac5mLzmLv","EXTRA":{"clusterUid":"bd89af7a-2ab9-42de-97da-0d5894354da6","path":"/data/logs"},"FIELDS":{"field1":"value1","field2":"value2"},"OBSERVATION_INDEX":"7","OBSERVATION_KIND":"http","_ob_datastream_token_id":"ds1thSTHMTVac5mLzmLv"}

                {"BUNDLE_ID":"3729","BUNDLE_TIMESTAMP":"1695924000540747582","DATASTREAM_ID":"41000006","DATASTREAM_TOKEN_ID":"ds1thSTHMTVac5mLzmLv","EXTRA":{"clusterUid":"bd89af7a-2ab9-42de-97da-0d5894354da6","path":"/data/logs"},"FIELDS":{"field1":"value3","field2":"value4"},"OBSERVATION_INDEX":"1","OBSERVATION_KIND":"http","_ob_datastream_token_id":"ds1thSTHMTVac5mLzmLv"}

                '
            text/csv:
              schema:
                type: string
              example: '"BUNDLE_TIMESTAMP","OBSERVATION_KIND","FIELDS","EXTRA","BUNDLE_ID","OBSERVATION_INDEX","DATASTREAM_ID","DATASTREAM_TOKEN_ID","_ob_datastream_token_id"

                "1695924000540747582","http","{""field1"":""value1"",""field2"":""value2""}","{""clusterUid"":""bd89af7a-2ab9-42de-97da-0d5894354da6"",""path"":""/data/logs""}","3729","7","41000006","ds1thSTHMTVac5mLzmLv","ds1thSTHMTVac5mLzmLv"

                "1695924000540747582","http","{""field1"":""value3"",""field2"":""value4""}","{""clusterUid"":""bd89af7a-2ab9-42de-97da-0d5894354da6"",""path"":""/data/logs""}","3729","1","41000006","ds1thSTHMTVac5mLzmLv","ds1thSTHMTVac5mLzmLv"

                '
        '400':
          description: Invalid request.
  /v1/login:
    post:
      summary: Generate an API token
      operationId: generateAPIToken
      tags:
      - Login
      description: 'Given an email address and a password, generate an API authorization token.

        This token can be used with Bearer authorization when used together with

        the customer ID. (The customer ID is the same as the first number in the API

        server URL.)


        ```

        Authorization: Bearer <customerid> <apitoken>

        ```


        Only "local" users that have a password can use this API; SSO users cannot

        log in using a password.


        This endpoint does not itself need to Authorization header.

        '
      security: []
      requestBody:
        description: The login username and password.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - user_email
              - user_password
              properties:
                user_email:
                  description: The email address of the user to mint credentials for.
                  type: string
                user_password:
                  description: The password of the user minting credentials.
                  type: string
                  format: password
                tokenName:
                  description: Optional name of the token, to remember what it is for.
                  type: string
            example:
              user_email: user@example.com
              user_password: hunter1
              tokenName: for the coin tracker integration
      responses:
        '200':
          description: '## Description of result data formats


            ### Content-type: application/json

            The response contains an ''ok'' field (boolean) and an "access_key"

            field (string).  The "access_key" is a secret value and is as good

            as the password for accessing the customer instance, so treat it

            with care. You must remember it, because it is not stored and

            cannot be retrieved again, although another access key can be

            generated through another invocation of the API.  By default,

            access keys that are not used, are invalidated after about 10 days

            of inactivity.

            '
          content:
            application/json:
              schema:
                type: string
              example: '{"ok":true,"access_key":"ZrL5BhtFXvu2Xe78GznP1dP2Ts81ZszA"}

                '
        '400':
          description: Invalid request.
