  description: 'Operations tagged Skills across 2 of this provider''s published API definitions: observeinc-openapi-assembled.json, observeinc-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{customerid}.observeinc.com
  description: US west server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
- url: https://{customerid}.{cluster}.observeinc.com
  description: Specific regional cluster (prod)
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    cluster:
      enum:
      - eu-1
      - ap-1
      default: eu-1
      description: For regional clusters, choose one.
- url: https://{customerid}.{domain}.com
  description: Specific Observe server
  variables:
    customerid:
      default: OBSERVE_CUSTOMERID
      description: The customer ID for your instance.
    domain:
      default: OBSERVE_DOMAIN
      description: The Observe domain for your instance.
security:
- bearerAuth: []
tags:
- name: Skills
  x-displayName: Skill
  description: Manage custom AI agent skills for the AI-SRE agent.
paths:
  /v1/skills:
    post:
      summary: Create a skill
      description: Create a new skill with the given metadata and content.
      operationId: CreateSkill
      tags:
      - Skills
      parameters:
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Skill-CreateRequest'
      responses:
        '201':
          description: Skill created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: List skills
      description: Get a paginated list of skills. Returns metadata only by default; use expand=true to include content.
      operationId: ListSkills
      tags:
      - Skills
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/ExpandParam'
      - name: orderBy
        in: query
        description: 'Comma-separated list of fields to order by.

          Prefix with `-` for descending order.

          Supported fields: `id`, `label`, `createdAt`, `updatedAt`.

          '
        schema:
          type: string
        example: -updatedAt
      - name: visibility
        in: query
        description: Filter skills by visibility. If omitted, returns skills based on access rules (creator sees all own skills; others see only Listed).
        schema:
          type: string
          enum:
          - Listed
          - Unlisted
      responses:
        '200':
          description: Skills listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill-ListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
  /v1/skills/{id}:
    delete:
      summary: Delete a skill
      description: Delete a skill.
      operationId: DeleteSkill
      tags:
      - Skills
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: int64
        required: true
        description: The id of the skill to delete
      responses:
        '204':
          description: Skill deleted successfully
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    get:
      summary: Get a skill
      description: Retrieve a specific skill by ID.
      operationId: GetSkill
      tags:
      - Skills
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: int64
        required: true
        description: The id of the skill to retrieve
      - $ref: '#/components/parameters/ExpandParam'
      responses:
        '200':
          description: Skill retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    patch:
      summary: Update a skill
      description: Update an existing skill using JSON Merge Patch semantics.
      operationId: UpdateSkill
      tags:
      - Skills
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: int64
        required: true
        description: The id of the skill to update
      - $ref: '#/components/parameters/ExpandParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Skill-UpdateRequest'
      responses:
        '200':
          description: Skill updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skill-Resource'
        '400':
          $ref: '#/components/responses/ErrorResponse-400'
        '401':
          $ref: '#/components/responses/ErrorResponse-401'
        '403':
          $ref: '#/components/responses/ErrorResponse-403'
        '404':
          $ref: '#/components/responses/ErrorResponse-404'
        '429':
          $ref: '#/components/responses/ErrorResponse-429'
        5XX:
          $ref: '#/components/responses/ErrorResponse-5XX'
    servers:
    - url: https://{customerid}.observeinc.com
      description: US west server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
    - url: https://{customerid}.{cluster}.observeinc.com
      description: Specific regional cluster (prod)
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        cluster:
          enum:
          - eu-1
          - ap-1
          default: eu-1
          description: For regional clusters, choose one.
    - url: https://{customerid}.{domain}.com
      description: Specific Observe server
      variables:
        customerid:
          default: OBSERVE_CUSTOMERID
          description: The customer ID for your instance.
        domain:
          default: OBSERVE_DOMAIN
          description: The Observe domain for your instance.
components:
  parameters:
    ExpandParam:
      name: expand
      in: query
      description: Whether to expand resources referenced in the response to include additional fields
      schema:
        type: boolean
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip before starting to collect the result set
      schema:
        type: integer
        format: int64
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return in the response
      schema:
        type: integer
        format: int64
  schemas:
    ObjectId:
      type: string
      format: ObjectId
    Meta:
      description: List Response Metadata
      type: object
      required:
      - totalCount
      properties:
        totalCount:
          description: 'The total number of resources available, independent of pagination.

            The API may return -1 if the total count is unknown or cannot be computed

            in reasonable time.

            '
          type: integer
          format: int64
    Skill-CreateRequest:
      title: SkillCreateRequest
      type: object
      required:
      - label
      - description
      - content
      properties:
        label:
          type: string
        description:
          type: string
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/Skill-Visibility'
    Skill-Resource:
      title: SkillResource
      type: object
      required:
      - id
      - label
      - description
      - visibility
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
        description:
          type: string
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/Skill-Visibility'
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/User'
        updatedAt:
          type: string
          format: date-time
    User:
      title: User
      type: object
      required:
      - id
      properties:
        id:
          title: User Identifier
          $ref: '#/components/schemas/ObjectId'
        label:
          title: User Label
          type: string
        timezone:
          type: string
        locale:
          type: string
    ErrorMessage:
      type: object
      properties:
        type:
          type: string
          description: A stable, machine-readable identifier for the kind of error.
        message:
          type: string
          description: Error message
      required:
      - type
      - message
    Skill-ListResponse:
      title: SkillListResponse
      type: object
      required:
      - skills
      - meta
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill-Resource'
        meta:
          $ref: '#/components/schemas/Meta'
    Skill-Visibility:
      title: SkillVisibility
      type: string
      enum:
      - Listed
      - Unlisted
    Skill-UpdateRequest:
      title: SkillUpdateRequest
      type: object
      properties:
        label:
          type: string
        description:
          type: string
        content:
          type: string
        visibility:
          $ref: '#/components/schemas/Skill-Visibility'
  responses:
    ErrorResponse-5XX:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-429:
      description: Rate limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    ErrorResponse-401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Authorization: Bearer <customerid> <apitoken>

        '
