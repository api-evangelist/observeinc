          $ref: '#/components/schemas/NullableTime'
          description: 'When the mute covering this monitor expires. Null when the monitor is not muted, or is muted indefinitely — use `muteState` to tell those apart.

            '
        muteCount:
          type: integer
          format: int64
          description: Number of mute rules currently covering this monitor.
        lastErrorTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a fatal error. Null if it never has.

            '
        lastAlarmTime:
          $ref: '#/components/schemas/NullableTime'
          description: When the monitor last raised an alert. Null if it never has.
        lastWarnTime:
          $ref: '#/components/schemas/NullableTime'
          description: 'When the monitor last logged a non-fatal warning. Null if it never has.

            '
        managedBy:
          anyOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
          description: 'App that manages this monitor, or null when it is user-managed. Returned id-only; request the app separately for its metadata.

            '
        lookbackSeconds:
          type: number
          format: double
          description: Window of data each evaluation considers, in seconds.
        dataStabilizationDelaySeconds:
          type:
          - number
          - 'null'
          format: double
          description: 'How long evaluation waits for late data before judging a window, in seconds. Null when the monitor takes the server default.

            '
        maxAlertsPerHour:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Alerts per hour after which the monitor disables itself. Null when the monitor takes the server default.

            '
        scheduling:
          $ref: '#/components/schemas/Monitor-Scheduling'
        inputQuery:
          $ref: '#/components/schemas/Monitor-MultiStageQuery'
        valueColumn:
          type:
